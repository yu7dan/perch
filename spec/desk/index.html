<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Perch · 台面</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div id="veil"></div>
<div id="brand"><img src="perch-logo.png" alt="">Perch</div>
<div id="clock"></div>
<div id="deskicons"></div>
<div id="zones"></div>
<div id="tabs"></div>
<div id="ghost" hidden><span></span></div>
<div id="drop" hidden><span></span></div>
<div id="snap" hidden></div>
<img id="dragi" hidden alt="">
<div id="tray" hidden></div>
<div id="pp" class="pop" hidden></div>
<div id="mp" class="pop" hidden></div>
<div id="dock"></div>
<div id="stownote">（模拟）收起后这里就是你真实的桌面，别的窗口照常用</div>
<div id="orb" hidden><i class="orb-ring"></i><img src="perch-logo.png" alt="" draggable="false"><span class="orb-bd" hidden></span><div class="orb-tip"></div><div class="orb-bub" hidden></div></div>
<div id="set" hidden></div>
<div id="ql" hidden></div>
<div id="cf" hidden></div>
<div id="fpk" hidden></div>
<div id="lp" hidden></div>
<div id="ov" hidden></div>
<div id="toast" hidden></div>
<div id="cap"><span id="cap-t"></span><span id="cap-k"></span><span id="cap-ch"></span><button id="cap-b" type="button"></button><em>退出模拟：Alt+F4</em></div>
<div id="cur"><i></i><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 2.5 19.5 12l-7 1.6-3.6 6.9z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
