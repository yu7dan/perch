name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            $bad
            exit 1
          }

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      # Every frontend string and every backend uimsg code must exist in both
      # dictionaries, and en/zh placeholders must agree. See docs/I18N.md.
      - name: i18n dictionaries
        run: node scripts/i18n-check.mjs

      - name: frontend syntax
        shell: pwsh
        run: |
          Get-ChildItem assets/js -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
