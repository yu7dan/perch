name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            $bad
            exit 1
          }

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
