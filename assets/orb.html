<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Perch</title>
<!-- 收起后的悬浮按钮（像桌宠，带 Perch 的标）：Go 那边单独的一个小窗口 —— 总在最前、无边框、透明底、不占任务栏。
     外观逐字取自定稿模拟（spec/desk/desk.css 的 #orb 那一段）。主窗口藏着的时候，状态由它推过来（perch:orb-state）。 -->
<style>
:root { --acc: #8aa4ff; --warn: #f5b454; --txt: #ececf1; --dim: rgba(236,236,241,.55); --ease: cubic-bezier(.2,.8,.2,1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; color: var(--txt); user-select: none; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
/* 按钮：一颗有厚度的圆 —— 上亮下暗的漆面、顶上一道高光、一圈极细的暗边把它从任何壁纸上托出来；
   阴影收在窗口留的 16px 边距里（超出去会被窗口边切出一道硬边，看着就像套了个框）。 */
#orb { position: absolute; top: 16px; right: 16px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; cursor: grab;
  background: radial-gradient(120% 120% at 32% 18%, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 44%), linear-gradient(165deg, #3a3e4c 0%, #22242c 52%, #141519 100%);
  box-shadow: 0 0 0 1px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.24), inset 0 -2px 6px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.42);
  transition: box-shadow .3s, transform .2s var(--ease), filter .2s; }
#orb.on-left { right: auto; left: 16px; }
#orb img { width: 30px; height: 30px; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
#orb:hover { transform: scale(1.05); filter: brightness(1.12); }
#orb:active { transform: scale(.96); }
#orb.dragging { transition: none; cursor: grabbing; transform: scale(1.1); }
#orb.orb-in { animation: orbIn .5s var(--ease); }
@keyframes orbIn { from { transform: scale(.3); opacity: 0; } }
#orb.hop { animation: hop .8s var(--ease); }
@keyframes hop { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-10px); } 50% { transform: translateY(0); } 70% { transform: translateY(-4px); } }
.orb-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; pointer-events: none; }
#orb.busy .orb-ring { border-top-color: var(--acc); border-right-color: rgba(138,164,255,.25); animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#orb.waiting { box-shadow: 0 0 0 2px rgba(245,180,84,.75), inset 0 1px 0 rgba(255,255,255,.24), 0 0 10px rgba(245,180,84,.4), 0 4px 10px rgba(0,0,0,.42); }
.orb-bd { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--warn); color: #1d1405; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.orb-tip, .orb-bub { position: absolute; right: 74px; top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 8px 12px; border-radius: 12px; font-size: 12px;
  background: rgba(22,23,29,.92); border: 1px solid rgba(255,255,255,.12); pointer-events: none; }
#orb.on-left .orb-tip, #orb.on-left .orb-bub { right: auto; left: 74px; }
.orb-tip { display: flex; flex-direction: column; gap: 2px; opacity: 0; transition: opacity .15s; }
#orb.tip .orb-tip { opacity: 1; }
#orb.dragging .orb-tip, #orb .orb-bub:not([hidden]) ~ .orb-tip { opacity: 0; }
.orb-tip em { font-style: normal; color: var(--warn); }
.orb-tip .dim { font-size: 11px; color: var(--dim); }
.orb-bub { width: max-content; max-width: 280px; white-space: normal; line-height: 1.5; border-color: rgba(245,180,84,.5); animation: zIn .25s var(--ease); }
@keyframes zIn { from { opacity: 0; } }
/* 浅色主题：白色的漆面按钮、白底提示 */
html.light #orb { background: radial-gradient(120% 120% at 32% 18%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 50%), linear-gradient(165deg, #ffffff 0%, #eef0f5 55%, #dde1ea 100%);
  box-shadow: 0 0 0 1px rgba(20,24,40,.14), inset 0 1px 0 rgba(255,255,255,1), inset 0 -2px 6px rgba(20,24,40,.08), 0 4px 10px rgba(30,40,80,.22); }
html.light #orb img { filter: invert(1) drop-shadow(0 1px 0 rgba(255,255,255,.6)); }
html.light .orb-tip, html.light .orb-bub { background: rgba(250,251,254,.96); border-color: rgba(20,24,40,.10); color: #1b1d24; }
html.light .orb-tip .dim { color: rgba(27,29,36,.55); }
</style>
</head>
<body>
<div id="orb" class="orb-in"><i class="orb-ring"></i><img src="/icons/perch-logo.png" alt="" draggable="false"><span class="orb-bd" hidden></span><div class="orb-bub" hidden></div><div class="orb-tip"></div></div>
<script type="module">
import { Events } from "/wails/runtime.js";
/* 窗口几何只走一条路（perch:orb-bounds → Go 的 SetBounds，一次摆好位置和大小）：
   原来加宽 / 收窄 / 拖动三件事分两条通道发、先改大小再挪位置，按钮会在屏上跳一下；
   鼠标一跳出按钮又触发收窄 → 按钮回到鼠标底下 → 又加宽，来回乱弹（用户 2026-11-09 反馈）。
   拖动按「抓住按钮的那一点」算位置，和窗口此刻是宽是窄无关 —— 原来按宽窗口的位置算，松手时按钮离鼠标很远。 */
const orb = document.getElementById("orb");
const BASE = 92, WIDE = 400, PAD = 16;   // 窄窗口边长、加宽后的宽度、按钮在窄窗口里离边的距离（和 cmd/perch/desk.go 一致）
let st = { run: 0, wait: 0 };
let narrow = { x: window.screenX, y: window.screenY };   // 窄窗口（92×92）此刻该在的屏幕位置
let wide = false, bubT = 0, leaveT = 0, drag = null, moved = false, raf = 0;

const scr = () => ({ L: screen.availLeft || 0, T: screen.availTop || 0, W: screen.availWidth || 1920, H: screen.availHeight || 1080 });
const onLeft = () => narrow.x + BASE / 2 < scr().L + scr().W / 2;
function side() { orb.classList.toggle("on-left", onLeft()); }
// 加宽「往屏幕里面」伸：贴右边时窗口往左长，按钮在屏上纹丝不动
function bounds() {
  if (!wide) return { x: narrow.x, y: narrow.y, w: BASE, h: BASE };
  return onLeft() ? { x: narrow.x, y: narrow.y, w: WIDE, h: BASE } : { x: narrow.x - (WIDE - BASE), y: narrow.y, w: WIDE, h: BASE };
}
function push() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; Events.Emit("perch:orb-bounds", bounds()); }); }
function setWide(on) { if (on === wide) return; wide = on; side(); push(); }
function paint() {
  orb.classList.toggle("busy", st.run > 0);
  orb.classList.toggle("waiting", st.wait > 0);
  const bd = orb.querySelector(".orb-bd");
  bd.hidden = !st.wait; bd.textContent = st.wait;
  const en = st.lang === "en";
  orb.querySelector(".orb-tip").innerHTML = `<b>Perch</b><span>${st.run ? (en ? `${st.run} running` : `${st.run} 个在跑`) : (en ? "All idle" : "都空闲")}${st.wait ? ` · <em>${st.wait}${en ? " waiting" : " 个等你"}</em>` : ""}</span><span class="dim">${en ? "Click to return to the desk · drag to move" : "点一下回到台面 · 按住能拖"}</span>`;
}
Events.On("perch:orb-state", (e) => {
  const d = (e && e.data) || {};
  st = { run: d.run | 0, wait: d.wait | 0, lang: d.lang };
  document.documentElement.classList.toggle("light", d.theme === "light");
  paint();
  // 收着的时候冒出新的「等你」：像桌宠一样冒个气泡，跳一下。
  if (d.bub && !drag) {
    const b = orb.querySelector(".orb-bub");
    b.textContent = d.bub; b.hidden = false;
    setWide(true);
    orb.classList.remove("hop"); void orb.offsetWidth; orb.classList.add("hop");
    clearTimeout(bubT);
    bubT = setTimeout(() => { b.hidden = true; if (!orb.classList.contains("tip")) setWide(false); }, 5000);
  }
});
orb.addEventListener("mouseenter", () => { if (drag) return; clearTimeout(leaveT); orb.classList.add("tip"); setWide(true); });
orb.addEventListener("mouseleave", () => {
  if (drag) return;
  // 稍等一下再收：手从按钮边上擦过去不该让窗口来回伸缩
  clearTimeout(leaveT);
  leaveT = setTimeout(() => { orb.classList.remove("tip"); if (orb.querySelector(".orb-bub").hidden) setWide(false); }, 180);
});
// 按住拖：按钮跟着「抓住的那一点」走；松手贴到最近的左右边。没拖开就是点一下 = 回到台面。
orb.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  orb.setPointerCapture(e.pointerId);
  const r = orb.getBoundingClientRect();
  drag = { sx: e.screenX, sy: e.screenY, gx: e.clientX - r.left, gy: e.clientY - r.top };
  moved = false;
});
orb.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!moved && Math.hypot(e.screenX - drag.sx, e.screenY - drag.sy) < 5) return;
  if (!moved) {
    moved = true; clearTimeout(leaveT); clearTimeout(bubT);
    orb.classList.add("dragging"); orb.classList.remove("tip");
    orb.querySelector(".orb-bub").hidden = true;
    wide = false; side();
  }
  // 窄窗口里按钮的左上角在 (PAD, PAD)：窗口位置 = 鼠标 − 抓点 − PAD
  narrow = { x: Math.round(e.screenX - drag.gx - PAD), y: Math.round(e.screenY - drag.gy - PAD) };
  push();
});
orb.addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null;
  orb.classList.remove("dragging");
  if (!moved) { Events.Emit("perch:orb-click"); return; }
  const { L, T, W, H } = scr();
  narrow = { x: narrow.x + BASE / 2 < L + W / 2 ? L + 6 : L + W - BASE - 6, y: Math.max(T + 6, Math.min(T + H - BASE - 6, narrow.y)) };
  side(); push();
  Events.Emit("perch:orb-moved", { x: narrow.x, y: narrow.y });
});
// 每次收起 Go 都会把这个窗口复位成窄的再显示：页面跟着回到初始样子。
Events.On("perch:orb-shown", (e) => {
  const d = (e && e.data) || {};
  wide = false; drag = null; moved = false;
  clearTimeout(bubT); clearTimeout(leaveT);
  narrow = { x: typeof d.x === "number" ? d.x : window.screenX, y: typeof d.y === "number" ? d.y : window.screenY };
  orb.querySelector(".orb-bub").hidden = true;
  orb.classList.remove("tip", "dragging", "hop", "orb-in");
  void orb.offsetWidth; orb.classList.add("orb-in");
  side();
});
side(); paint();
</script>
</body>
</html>
