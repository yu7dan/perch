<!-- ⚠️ 这一段必须是**普通脚本**，而且必须在下面的 module 之前：它专门抓脚本求值期的错误
     （白屏最难查的那一种）—— 画在页面上，并攒进 window.__bootErr，等 ctl 通道起来补发到日志。 -->
<script>
window.__bootErr = [];
window.__facts = [];
(function () {
  function show(msg) {
    try {
      window.__bootErr.push(msg);
      var d = document.getElementById("boot-err");
      if (!d) {
        d = document.createElement("div");
        d.id = "boot-err";
        d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;" +
          "background:#7f1d1d;color:#fff;font:12px/1.5 Consolas,monospace;" +
          "padding:8px 12px;white-space:pre-wrap;max-height:40vh;overflow:auto";
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += (d.textContent ? "\n" : "Boot error / 启动错误：\n") + msg;
    } catch (_) {}
  }
  window.addEventListener("error", function (e) {
    if (e && (e.message || e.error)) show(String(e.message || e.error));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    show("Unhandled promise rejection / 未处理的 Promise 拒绝: " + String((e && e.reason) || "?"));
  });
})();
</script>
<!-- Wails 运行时是 ESM；这里只 import 一次并挂到 window，下面的 classic script 共享这一份。 -->
<script type="module">
  import { Stream, JSONStream, Window, Events } from "/wails/runtime.js";
  window.__wails = { Stream, JSONStream, Window, Events };
</script>
<!-- 前端自有脚本是 classic script：**数字前缀就是加载顺序**，它们共享同一个全局词法作用域。
     0x 公用小件 → 1x 终端 → 2x 通道与状态 → 3x 台面 → 99 启动闸。新增文件取一个能插进顺序的编号，并同步这里。 -->

<script defer src="/js/03-icons.js"></script>
<script defer src="/js/05-prefs.js"></script>
