        </svg>
      </button>
      <button class="wc-btn" id="wc-max" title="最大化" aria-label="最大化">
        <svg class="wc-glyph" id="wc-ico-max" viewBox="0 0 10 10" aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"
                stroke-width="1" shape-rendering="crispEdges"/>
        </svg>
        <svg class="wc-glyph off" id="wc-ico-restore" viewBox="0 0 10 10" aria-hidden="true">
          <!-- 还原 = 後方方框只露上边和右边 + 前方一个完整方框（与 U+E923 同构） -->
          <path d="M2.5 0.5 H9.5 V7.5" fill="none" stroke="currentColor"
                stroke-width="1" shape-rendering="crispEdges"/>
          <rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor"
                stroke-width="1" shape-rendering="crispEdges"/>
        </svg>
      </button>
      <button class="wc-btn wc-close" id="wc-close" title="关闭" aria-label="关闭">
        <svg class="wc-glyph" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" fill="none" stroke="currentColor"
                stroke-width="1"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 1. 导航栏 -->
  <aside id="rail">
    <div class="nav on" data-nav="工作区">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h6l2 2h10v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 7V6a1 1 0 0 1 1-1h4l2 2"/></svg>
      <span>工作区</span><span class="cnt" id="n-ws">0</span>
    </div>
    <div class="nav" data-nav="会话">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H9l-5 4z"/></svg>
      <span>会话</span><span class="cnt" id="n-ss">0</span>
    </div>
    <div class="nav" data-nav="历史">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>历史</span>
    </div>
    <div class="nav" data-nav="搜索">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <span>搜索</span>
    </div>
    <div class="rail-spacer"></div>
    <div class="nav" data-nav="设置">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
      <span>设置</span>
    </div>
  </aside>

  <!-- 2. 会话列表 -->
  <section id="list">
    <div class="list-head">
      <h1>工作区</h1>
      <div style="margin-left:auto;display:flex;gap:2px">
        <button class="icon-btn" title="新建工作区">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" title="刷新索引" id="reload">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
        </button>
      </div>
    </div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="q" placeholder="搜索会话、目录…" spellcheck="false">
      <span class="kbd">⌘K</span>
    </label>
    <div class="scroll" id="scroll">
      <div class="grp">工作区<span class="b" id="g-ws"></span></div>
      <div id="ws-list"></div>
      <div class="grp">会话<span class="b" id="g-ss"></span></div>
      <div id="ss-list"></div>
      <!-- C6a：子代理那一组搬去了右栏（#rsb 的「子代理」模块）——
           它说的是"当前工作衍生出去的会话"，和右栏这一列的语义是一回事，
           留在左侧滚动区里只是和主会话抢地方。 -->
    </div>
  </section>

  <!-- 3. 主区（C6a：**只放 agent**）。
       原来这里并排着面板 A（终端）和面板 B（历史流），中间一条 divider ——
       三个都出自"一次只看一个东西"的那一版。现在：
         · 历史流 → 搬到右栏，成为它的「对话流」模块；
         · 那条 divider → 搬到右栏的左边界（拖它 = 改右栏宽度）；
         · 主区 → 只剩 agent：并行网格（C4）+ 拎出来的独立页（C5）。
       于是主区的宽度只由"窗口 − 左栏 − 右栏"决定，agent 一多也不再有人
       从它身上切走一块 —— 这一条就是 C6a 要修的那个 bug 本身。 -->
  <main id="main">
    <div id="panes">
      <!-- A：实时终端。
           面板里**只有终端**：头上那条是 absolute overlay 且默认 chromeless
           （透明、无边框、无图标、无文字，只有悬停时才浮出按钮），脚下什么都没有。
           这就是 Orca 的嵌入方式 —— 见 .phead 那段注释。 -->
      <section class="pane a on">
        <div class="pbody" id="termbody"><!-- 每个标签一个 .termhost，由 createTab() 挂进来。

             想清楚"谁在管这块 DOM"再动它：Go 那边**一个标签一条 stream + 一个
             ConPTY**，前端这边一个标签一个 xterm 实例。面板本身只是个容器，
             它不记得"当前是谁" —— 那是 activeTab 的事。 --></div>
        <div class="phead">
          <div class="rt">
            <button class="pbtn" id="restore" title="把上次的输出恢复到这个面板"></button>
          </div>
        </div>
      </section>

    </div>

    <!-- C9：收起终端面板之后的这一屏（「群组」）。
         它和 #panes 是**并列**的，不在 #panes 里面 —— 两者的可见性是互斥的，
         由 #app 上那一个 .term-collapsed 类一次说清（见 CSS 3b 段）。
         为什么不挂在格子列表里：它不是"某一格"，它是"所有格"。 -->
    <div id="group">
      <!-- 顶部条（序号 + logo + 状态点）和主体列表都建在 JS 里。
           元素建一次、之后按**签名**原地更新（理由见 renderGroup：整表重建会
           把选中态和滚动位置一起抹掉，而这块面是每 400ms 就会收到新东西的）。 -->
      <div id="group-head"></div>
      <div id="group-list"></div>
    </div>
  </main>

  <!-- 4. 右栏（C6a）—— 外壳级的**独立区域**。
       历史流不再是一个"面板"，而是这里的一个**模块**：这一列关心的是
       "关于当前工作的读数"，模块只是它的几个切面。

       为什么做成独立列而不是继续塞在中栏里：用户的观察是原话 ——
       「只要添加 Agent，或者说这个页面变大、添加的东西更多的时候，
         历史流这个模块会被压缩变小」。根因就是它和终端在同一个 flex 行里
         分宽度。搬成兄弟列之后，它和中栏之间只剩一条可拖的边界，没有别的关系。

       结构（对应 Orca components/right-sidebar/index.tsx:139-213）：
         #rsb-head  36px = 模块条（图标 + 活动态下划线）+ 收起按钮
         .rsb-mod         = 每个模块一格，正在看的那个才有 hidden=false
       模块条在下、面板头在上的两层，和 Orca 的 'top' 布局一致：
       它 36px 的 activity bar 里只有图标，标题由各面板自己的头负责。 -->
  <aside id="rsb">
    <!-- 拖它 = 改右栏宽度。它属于右栏（绝对定位在左边界上），不属于中栏。 -->
    <div id="divider" class="divider"></div>
    <div id="rsb-head">
      <div id="rsb-bar">
        <!-- 图标全部是 **Lucide 原始 path + polyline**（24×24 网格，从
             raw.githubusercontent.com/lucide-icons/lucide/main/icons/*.svg 取回原文），
             按 16px 渲染、描边 1.7 —— 和标题栏、标签条那一套同源同重。
             上一批的 side/diff 两枚是照 Lucide 的样子**手画**的（形状和真正的
             git-fork / file-diff 并不一样），这次连它们一起换成原文：
             同一个工具条里混"真图标"和"像图标的画"，放大一点就露馅。 -->
        <!-- ① 需要你（inbox）—— 带**数字徽标**。
             ⚠️ 这是**明确偏离 Orca** 的一处，用户点名要的：Orca 的活动条只有
             7px 圆点、全库没有任何数字徽标（它靠"点 + 悬停提示"表达注意力）。
             理由是它一次只跑几个 agent，而我们的默认视图是 N 格同屏，
             "几件事在等你"这个读数比一个点更能回答"我现在要不要切过去"。 -->
        <button class="arbtn on" data-mod="need" title="需要你">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span class="badge" id="need-badge" hidden>0</span>
        </button>
        <button class="arbtn" data-mod="side" title="子代理">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg>
        </button>
        <button class="arbtn" data-mod="diff" title="改动">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M9 10h6"/><path d="M12 13V7"/><path d="M9 17h6"/></svg>
        </button>
        <button class="arbtn" data-mod="flow" title="流水">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>
        </button>
        <!-- 对话流原来在这里占第 5 个按钮位，现在它是下段常驻的那一块（见本文件
             #rsb-hist）。撤掉按钮不是删功能 —— 它从"要点一下才存在"变成"一直在"。 -->
      </div>
      <div class="rt">
        <button class="icon-btn" id="rsb-close" title="收起右栏 (Ctrl+Shift+B)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
        </button>
      </div>
    </div>

    <!-- 上段。这层包裹不是装饰：它把"四个模块"变成一个真的盒子，下段（对话流）
         才有东西可以跟它分高度（flex 的两个兄弟之间才谈得上分）。 -->
    <div id="rsb-mods">

    <!-- ① 需要你 —— 这一列里唯一"主语是我"的模块：它回答的不是"它在干什么"，
         而是"现在该把注意力放哪一格"。数据来自两条**实测过的腿**：
           hook  Stop / StopFailure / Notification  → 它刚说完话、它挂了、它要你批
           登记表 sessions\<pid>.json 的 status      → busy / idle（"在跑"/"该我了"）
         两组合起来才能分清"忙"和"等你"，单看任何一条都分不出来（详情见 JS 那段）。

         v1 的行是**只读**的：点一下 = 切到那一格 + 闪两下。就地作答/批权限
         留着以后（要先把 TUI 那个选择器的按键序列量出来），所以这里刻意
         不放任何"点一下就动手"的按钮 —— 一个点了不知道会发生什么的按钮，
         比"你得自己切过去"更糟。 -->
    <section class="rsb-mod" data-mod="need">
      <div class="bhead">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </span>
        <span class="nm2">需要你</span>
        <div class="rt"><span class="pill" id="need-cnt">0</span></div>
      </div>
      <div class="scroll"><div class="vlist" id="need-list"></div></div>
    </section>

    <!-- ② 子代理 —— 从左侧列表的第三组搬过来。它原本和主会话挤在同一个
         滚动区里，但它说的其实是"当前这个工作**衍生出去**的那些会话"，
         和右栏这一列的语义一致，所以归到这里。 -->
    <section class="rsb-mod" data-mod="side" hidden>
      <div class="bhead">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg>
        </span>
        <span class="nm2">子代理</span>
        <div class="rt"><span class="pill g" id="rsb-side-cnt">0</span></div>
      </div>
      <!-- 两段，**都叫子代理，但来源不同**：
           #side-live  = 当前这一格**现在**派生出去的子代理（hook SubagentStart/Stop
                         + 转录里的 Agent 工具调用），是实时信号。
           #side-list  = 会话库索引出来的历史子代理会话（C6a 从左栏第三组搬来的）。
           上面那段是"正在发生"，下面那段是"发生过" —— 所以实时那段在上。 -->
      <div class="scroll">
        <div id="side-live"></div>
        <div class="cap" id="side-cap">会话库里的子代理 · 0</div>
        <div id="side-list"></div>
      </div>
    </section>

    <!-- ③ 改动 —— 数据来自**跟着转录文件走**的那条腿（transcript.go）：
         Edit 的结果里带一份标准 unified diff（structuredPatch），数 +/- 前缀
         就是 ±N；Write 带整份 content，数行数就是 +N。不用我们自己 diff 两份文本。
         两段分组：「改过的」（edit/write，这里才有 ±N）在前，「读过的」在后 ——
         读过的文件不是"改动"，但它同样是"这个会话碰过什么"的读数，
         藏掉就等于每次都要靠记忆猜它读过什么。 -->
    <section class="rsb-mod" data-mod="diff" hidden>
      <div class="bhead">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M9 10h6"/><path d="M12 13V7"/><path d="M9 17h6"/></svg>
        </span>
        <span class="nm2">改动</span>
        <span class="sub ell" id="led-who">没有当前格</span>
        <div class="rt"><span class="sub" id="led-sum"></span><span class="pill" id="led-cnt">0</span></div>
      </div>
      <div class="scroll"><div class="vlist" id="led-list"></div></div>
    </section>

    <!-- ④ 流水 —— 当前这一格的**实时**活动（转录里每一条 tool_use / 文本 / 你的话）。
         和「对话流」的分工要说清楚，否则这两栏看着像重复：
           流水   = 当前格、**现在**、结构化到"哪一步在动哪个文件"、跟着转录增量进来
           对话流 = 左栏选中的**那个会话**、全文、来自索引器（是会话库的读物）
         一条是"活着的那一格的脉搏"，一条是"翻旧账"。 -->
    <section class="rsb-mod" data-mod="flow" hidden>
      <div class="bhead">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>
        </span>
        <span class="nm2">流水</span>
        <span class="sub ell" id="feed-who">没有当前格</span>
        <div class="rt"><span class="pill" id="feed-cnt">0</span></div>
      </div>
      <div class="scroll"><div class="vlist" id="feed-list"></div></div>
    </section>
    </div><!-- /#rsb-mods 上段到此为止 -->

    <!-- 上段/下段之间那条可拖的边界（拖 = 改下段高度）。 -->
    <div id="rsb-split" title="拖动调整对话流高度"></div>

    <!-- 下段：对话流，**常驻**。主语是**左栏选中的那个会话**，和上面四个格子级
         模块不同源 —— 它是会话库（历史）的读物。等 C6b 把左栏改成
         工作台/历史/搜索/设置 之后，它该跟着「历史」那条线走。
         为什么不放回活动条：它是"当前会话在说什么"的正文，跟四个格子级模块
         抢同一个按钮位和同一段高度时，谁被切走谁的阅读位置就丢。
         ⚠️ 默认**只占一行头部**（折叠），点箭头或往下拖才展开 —— 见 CSS 里
         那段注释：Orca 撤掉自己右栏那个"底部常驻面板"的理由正是抢垂直空间。 -->
    <section id="rsb-hist">
      <div class="bhead">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </span>
        <span class="nm2">对话流</span>
        <button id="h-src" title="下段显示的是哪一段对话">当前格</button>
        <span class="sub ell" id="h-sub">未选择会话</span>
        <div class="rt"><span class="sub" id="h-foot"></span><span class="pill g" id="h-cnt">0</span><button class="icon-btn" id="h-fold" title="展开/收起对话流" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button></div>

<!-- ⚠️ 这一段必须是**普通脚本**，而且必须在下面的 module 之前 —— 它专门抓
     一种最难查的白屏：**module 里的语法错误**。模块解析失败时它一行都不执行，
     连下面那个 jserr 都还没注册，日志/控制台/标题三条路全断 ——
     表现就是"整个界面空白，什么都没发生"，看起来像 Go 挂了。
     所以这里做两件事，两条都不依赖任何别的通道：
       1) 把错误画在页面上（大红条）—— 截图就能看见；
       2) 攒进 window.__bootErr，等 ctl 通道起来之后补发到日志（见 ctl.onopen）。 -->
<script>
window.__bootErr = [];
// 非错误的启动期事实（诊断探针在 ctl 通道建好之前算出来的东西），同样等
// ctl.onopen 补发。和 __bootErr 分开只是为了日志里别把事实写成"错误"。
window.__facts = [];
(function () {
  function show(msg) {
    try {
      window.__bootErr.push(msg);
      var d = document.getElementById("boot-err");
      if (!d) {
        d = document.createElement("div");
        d.id = "boot-err";
        d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;" +
          "background:#7f1d1d;color:#fff;font:12px/1.5 Consolas,monospace;" +
          "padding:8px 12px;white-space:pre-wrap;max-height:40vh;overflow:auto";
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += (d.textContent ? "\n" : "启动错误：\n") + msg;
    } catch (_) {}
  }
  window.addEventListener("error", function (e) {
    // 资源加载失败（img/script）没有 message，别把那些混进来
    if (e && (e.message || e.error)) show(String(e.message || e.error));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    show("未处理的 Promise 拒绝: " + String((e && e.reason) || "?"));
  });
})();
</script>
<script type="module">
// Window / Events 是 Wails 运行时带的前端 API。窗口按钮能走它就别自己绕后端 ——
// 这两个在运行时里是直接调平台层（`internal/runtime/desktop/@wailsio/runtime/src/window.ts`），
// 我们只需要接上"什么时候该换字形"。
import { Stream, JSONStream, Window, Events } from "/wails/runtime.js";

// ---------------------------------------------------------------------------
// 页面里没有控制台可看，未捕获的错误必须自己送出来。
// 送法有两种，**主通道是 stream 的 log 控制帧**（直接落到 spike.err 里，
// 和 [web] 那几行并排，排查时一个 Get-Content 就看到了）。
//
// ⚠️ 另一条曾经以为可行的通道是「写 document.title，外面用
// (Get-Process spike).MainWindowTitle 读」—— **实测无效**：Wails v3 不把
// document.title 传到原生窗口标题，标题始终是应用名。写它只是留个保险，
// 别再把排查希望寄托在它上面。
function jserr(what, e) {
  const msg = `JS错误 ${what}: ${(e && (e.message || e.reason || e)) || "?"}`;
  try { document.title = msg; } catch {}
  try { window.__bootErr.push(msg); } catch (_) {}
  try { sendCtrl({ type: "log", msg }); } catch {}
}
window.addEventListener("error", (e) => jserr("error", e));
window.addEventListener("unhandledrejection", (e) => jserr("rejection", e));

// 焦点归属探针。终端应用里「焦点现在在谁身上」是核心不变量，但它在画面上
// **看不见** —— 只能把事实回传到日志里看。有界：只报前 12 次，不留噪音。
// 用途（2026-10-15）：验证面板头上那排浮出按钮会不会把焦点从终端上抢走。
let focusProbeLeft = 12;
function focusProbe(where) {
  if (focusProbeLeft-- <= 0) return;
  const a = document.activeElement;
  sendCtrl({ type: "log", msg: `focus ${where} -> ${a ? a.tagName + (a.id ? "#" + a.id : "") + (a.className ? "." + String(a.className).split(" ")[0] : "") : "null"}` });
}
window.addEventListener("focusin", () => focusProbe("in"), true);
window.addEventListener("focusout", () => focusProbe("out"), true);

// ligatures 只发 ESM，只能当 module 引；拿不到就退化成无连字，不影响可用性
let LigaturesAddon = null;
try {
  const m = await import("/addon-ligatures.esm.js");
  LigaturesAddon = m.LigaturesAddon ?? m.default?.LigaturesAddon ?? null;
} catch (e) { console.warn("[spike] ligatures 未加载:", e); }

// 字体必须在**建终端之前**就绪。
// xterm 是按字体的实际度量去算单元格宽高的，字体还没加载就 open()，
// 算出来的是回退字体的格子 —— 之后再换字体会留下歪掉的列宽和光标位置。
// 这是 webfont 终端最经典的坑。
// 顺序跟 CSS 的 --mono 必须一致。**Cascadia 放第一**，不是审美问题：
// Claude Code 的开场横幅是拿 U+2580–259F 方块元素拼的像素图，只有
// 等宽终端字体才把它们画成对齐的实心块；拿 CJK 字体兜底会得到全角宽度，
// 方块之间被撑开、图案糊成一团白。Cascadia 是 Windows Terminal 的字体，
// Orca 的字体栈里写的也是它。
const MONO = '"Cascadia Code WB", "JetBrains Mono WB", Consolas, "Microsoft YaHei", monospace';
try {
  await Promise.all([
    document.fonts.load('400 14px "Cascadia Code WB"'),
    document.fonts.load('700 14px "Cascadia Code WB"'),
    document.fonts.load('italic 400 14px "Cascadia Code WB"'),
    document.fonts.load('400 14px "JetBrains Mono WB"'),
    document.fonts.load('700 14px "JetBrains Mono WB"'),
  ]);
  await document.fonts.ready;
} catch (e) { console.warn("[spike] 字体加载异常:", e); }

const CTRL = 0xFF;
const enc = new TextEncoder();

const $ = (id) => document.getElementById(id);

// ===========================================================================
// 终端 —— **一个标签一份**
//
// 这一段原来是一个只有一份的全局终端：`const term = new Terminal(…)` 写在模块
// 顶层，`fit` / `serialize` / `ready` / `stream` / `agentTitleRaw` 全是模块级
// 变量。加第二个标签**不是"再 new 一个 Terminal"就行** —— 那些变量天然只能有
// 一个主人，必须整体变成每个标签各自一份，否则两个会话的输出会写进同一块
// 缓冲、两个 PTY 会收到同一串键盘字节。
//
// 做法是**把它们收进 createTab() 的函数作用域**：函数体里 `const term` 就地
// 遮蔽模块级的 `term`，于是下面这一大段（选项、addon、WebGL 挂载顺序、尺寸
// 停稳、OSC 标题、状态点）**一行都不用改**，闭包自动把它绑到"这一个标签"。
// 比把每处引用改写成 `tab.xxx` 安全得多：那些注释记的都是"为什么"，改引用
// 等于把它们全搬一遍，搬错一处就是一处静默的行为差异（比如两个标签共用
// 一份 lastSizeSent，第二个标签的 resize 就永远发不出去）。
//
// 模块级只留三样：
//   term       —— **当前激活标签**的 xterm。文件后面（IME 锚定、状态栏读数、
//                 焦点恢复）几十处读的都是它，所以它是"视图"而不是"某一份"。
//                 只由 setActive() 赋值，别在别处写。
//   activeTab  —— 当前激活的标签对象。
//   TAB_LIST   —— 标签模型，按创建顺序；标签条按它渲染。
// 其余曾经是模块级的（ready / connDown / agentTitleRaw / liveTitle /
// lastSizeSent / raf…）现在全都是标签自己的状态。
// ===========================================================================
let activeTab = null;
/* C5：被"拎成一张独立页"的那一格；null = 看的是并行网格。
   ⚠️ 它只是一个**视图**开关，不是模型成员 —— TAB_LIST 里那格照样在、PTY 照跑
   （这正是"关掉页面就把 agent 还给网格"能成立的原因：agent 从来没离开过网格）。
   声明放在这里而不是页面那段代码旁边：createTab 在**模块求值期间**同步调
   renderGrid()，而 renderGrid 要读它 —— 放到后面就是 TDZ
   （`Cannot access 'soloTab' before initialization`，本文件已经栽过一次，见
   createTab 里 `let ready` 那段）。 */
let soloTab = null;
let term = null;                 // 激活标签的 xterm（视图，见上）
const TAB_LIST = [];             // 标签模型，按创建顺序
// 正在用 WebGL 的格子数。**网格把"一个上下文"变成了"每格一个上下文"**：
// Chromium 对同时存在的 WebGL 上下文有硬上限（约 16），超了会**静默丢掉最早
// 那些**，表现是从某个格子开始整片变糊 —— 像是渲染坏了，其实是名额用光了。
// 所以到上限就主动退回 DOM 渲染器（那条路本来就在：gfx.on=false）。
/* ⚠️ 2026-10-15 实测把上限从 8 提到 12，依据是两条量出来的事实：
   ① **10 格全是 WebGL，而且清晰**（每格 canvas=2、webgl=true，截图放大看字形
      是锐的 —— 超上限的表现是"整片变糊"，而糊是**静默**的，所以这一条必须
      看像素，不能看日志）；
   ② 那个 8 是**我们自己拍的**，不是平台的墙。试过 Orca 那条路
      （`WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--max-active-webgl-contexts=32`，
      它自己是把上限抬到 128 的，见 terminal-webgl-hidden-retention.ts:4）——
      **抬不抬都一样**：不带那个环境变量时 10 格照样全是 WebGL。
      也就是说 WebView2 的默认天花板本来就够，没必要给整个 WebView2 进程
      塞一个全局启动参数。

let webglLive = 0;
const WEBGL_MAX_CELLS = 12;

// 新标签的默认启动意图。cwd 留空 = 交给 Go 侧的默认工作目录（spikeCwd）。
const DEFAULT_SPAWN_SPEC = { agent: "claude", cwd: "", resume: { kind: "new", id: "" } };

// createTab：建一个标签。**它是 async，但在第一个 await 之前就把终端建好、
// 而且 fit 过一次了** —— 这条不能破：启动那段（模块顶层，等不了一个 await）
// 拿到的必须是**已经 fit 过**的终端，否则第一个标签的尺寸要等下一帧才对。
// （C6a 之前这里还有一条更硬的理由：cellWidthPx() 要等 xterm 量出格子宽，
//   而分栏宽度的启动恢复依赖它。那套换算退役后，只剩上面这条"首帧就得是对的"。）
//
// 顺序：先建 DOM/xterm（同步）→ 再问 Go 要一条 stream（异步）→ 接上 PTY。
// stream 为什么必须晚于终端：Go 那边的 stream handler 是**按标签在运行期注册**
// 的（main.go tabManager.create），名字由 Go 发（term:<id>），前端不自己编 ——
// 自己编的话，一旦前端连的时候 Go 还没注册，服务端会直接 404
// （stream_server.go:247-256 在**连接建立时**才按名字查 handler）。
async function createTab(spec) {
  const T = {
    spec: spec || DEFAULT_SPAWN_SPEC,
    id: 0, streamName: "", stream: null,
    ready: false, connDown: false,
    // —— 标题与状态点：都要跟着**这个标签**走，切换标签时不能串
    agentTitleRaw: "", agentState: null,
    liveTitle: "",
    // —— 尺寸：这是"吉祥物出现两次"那套去重的全部状态，每个标签必须各有一份
    lastSizeSent: "", resizeCount: 0,
    seenKey: "", tries: 0, rejectLogged: false, settleAt: 0, raf: 0,
    // C2：Go 护栏拒绝这次启动时，原因记在这儿（见 ctl 的 tab.ok 处理）。
    resumeRefused: null,
    // —— WebGL：装在一个**容器**里而不是两个散变量。上下文丢失时 addon 会被
    //    置回 null，那份改动必须被外面（状态栏那格读数）看见。
    gfx: { addon: null, on: false },
    term: null, fit: null, serialize: null,
    host: null, cellEl: null, cellBody: null, tabEl: null, nmEl: null, dotEl: null, icoEl: null,
  };
  // ⚠️ **先登记再建**：下面 `await spawnTab(T)` 期间 Go 就会把 tab.ok 发回来，
  // 而应答是靠"在 TAB_LIST 里找一个还等着应答的标签"来配对的。等到函数末尾
  // 才 push，那条应答就永远配不上，标签会一直挂在那儿等超时。
  TAB_LIST.push(T);

  /* ⚠️ `ready` 必须**在这里**声明，不能留到 stream 建好那段（原位置）——
     它的原位置在 `await spawnTab(T)`（下面）之后，而 createTab 在这个 await
     处会让出主线程：让出期间任何一帧回调只要碰到它（`attachWebgl` 里那个
     `requestAnimationFrame(() => { fit.fit(); pushSize(); })`、以及
     `checkCanvasDpr` 那几处日志），就会读到尚未初始化的 `ready`，
     抛 **ReferenceError: Cannot access 'ready' before initialization**。
     后果不是"报个错"这么轻：T 早就 push 进 TAB_LIST 了（先登记再建），
     于是网格里多出一个 **id=0、没有 stream** 的幽灵格，关它的时候日志是
     `关格子 tab=0 stream已关=false`（2026-10-15 实测逮到）。
     声明提到这里之后，`sendCtrl` 那个 `if (!ready) return;` 就回到它本来
     该有的语义：stream 还没开，消息丢掉。 */
  let ready = false;

  // —— 网格里那一格，**三层固定结构**：
  //      .cell ─┬─ .cellhead   ← 这个标签的 .tab 元素本体
  //             └─ .cellbody   ← .termhost 的父，boxOk() 的断言基准
  //    头为什么**复用 .tab 而不是新造一个**：重命名、状态点、agent 图标那套
  //    判据全都挂在"标签对象"上（T.nmEl / T.dotEl / T.icoEl），换个爹照旧能用；
  //    新造一个等于把那套逻辑再抄一遍，而它里面全是踩过的坑（见重命名那段）。
  T.cellEl = document.createElement("div");
  T.cellEl.className = "cell";
  T.cellBody = document.createElement("div");
  T.cellBody.className = "cellbody";
  T.host = document.createElement("div");
  T.host.className = "termhost";
  // 第一个标签（还没有 activeTab）先认领 #termhost —— setActive() 之前就有代码
  // 按这个 id 找宿主（历史上是 cellWidthPx 量格子宽用的；现在没有读者了，
  // 但"谁是当前格"这条约定留着，见 .termhost 那段 CSS 注释）。
  // 之后这个 id 跟着"当前格"走，见 setActive。
  if (!activeTab) T.host.id = "termhost";
  T.cellBody.appendChild(T.host);

  // —— 格子的头（**建一次就不重建**：重命名会把 .nm 换成输入框，
  //    重建等于把用户正在打的字连输入框一起删掉）。元素挂在标签对象上，
  //    所以 renderTabTitle / renderAgentDot 认的永远是"标签对象"而不是 id。
  T.tabEl = document.createElement("div");
  T.tabEl.className = "tab cellhead";
  T.tabEl.innerHTML =
    `<span class="adot" data-state="idle" role="img" aria-label="空闲"></span>` +
    `<span class="tab-ico"></span>` +
    `<span class="nm ell"></span>` +
    `<span class="x" title="关闭">×</span>`;
  T.dotEl = T.tabEl.querySelector(".adot");
  T.icoEl = T.tabEl.querySelector(".tab-ico");
  T.nmEl  = T.tabEl.querySelector(".nm");
  T.icoEl.innerHTML = claudeIcon(12);   // agent 图标只在格子头这一个落点（见 P5 那段注释）
  renderTabTitle(T);

  T.cellEl.appendChild(T.tabEl);
  T.cellEl.appendChild(T.cellBody);
  $("termbody").appendChild(T.cellEl);
  renderGrid();

  // 下面整段原来直接写 $("termhost")（按 id 找唯一宿主）。现在宿主是每个标签
  // 自己一个，所以这里只认**自己的**那一个 —— 另一个格子的 PTY 推 resize 时
  // 绝不能拿这一格的盒子去量。
  const host = T.host;

const term = new Terminal({
  // 必须是**具体字体名**：xterm.js 把这一串原样交给 canvas 的 font，
  // 不经过 CSS 引擎 —— 写 var(--code) 会让整串解析失败并静默掉回默认字体。
  // 第一位是自带的 webfont（见上面 @font-face），后面只是兜底。
  fontFamily: MONO,
  fontSize: 14,
  lineHeight: 1,                    // Orca 不设，xterm 默认就是 1
  // Orca 用 300/500（它默认字体是 macOS 的 SF Mono，有细体）。
  // 我们只带了 JetBrains Mono 的 400/700 —— 硬套 300 会被浏览器**合成**出假细体，
  // 而且中文回退字体也会跟着被合成，比老实用 400 更难看。
  fontWeight: 400,
  fontWeightBold: 700,
  cursorBlink: true,
  cursorStyle: "block",             // Orca 默认块状光标，不是竖线
  cursorInactiveStyle: "outline",
  scrollback: 5000,                 // Orca 桌面默认 5000 行
  scrollSensitivity: 1.15,
  fastScrollSensitivity: 5,
  allowProposedApi: true,           // unicode11 与 serialize 需要
  allowTransparency: false,
  // Orca 是按**背景亮度**分档的，不是按应用明暗模式
  // （terminal-contrast-correction.ts）：亮底 4.5（WCAG-AA 正文），
  // 暗底 3（WCAG-AA 大字）。它把 4.5 用在暗底上会"把鲜艳的 ANSI 色
  // 过度提亮"（原注释点名的 bug #7934）。我们的底是 #0a0a0a（近黑），取 3。
  minimumContrastRatio: 3,
  drawBoldTextInBrightColors: true,
  scrollbar: { width: 7 },          // 细滚动条；FitAddon 会把它算成一条 gutter，代价约 1 列
  // macOS 上非美式键盘要靠 Option 组合出 @ 和 € 这类字符。
  // 我们在 Windows 上跑，但这是 Orca 的默认值，留着以免以后移植时漏掉。
  macOptionIsMeta: false,
  macOptionClickForcesSelection: true,
  // 【关键】声明支持 kitty 键盘协议，让**会用 `CSI ? u` 探测**的 CLI 知道
  // 我们能收增强按键上报。Claude Code 就探测这个：没有这个握手，
  // 它会退回传统编码，Shift+Enter 之类的按键就丢了。
  // Orca 原注释：Matches VS Code's xtermTerminal.ts。
  vtExtensions: { kittyKeyboard: true },
  // ANSI 16 色（black…brightWhite）逐字取自 Orca 的默认暗色主题
  // "Ghostty Default Style Dark"，**不动** —— 它们与底色无绑定关系。
  // 只有 background / cursorAccent 跟着 --term-bg 走了我们的画布色，理由见文件顶部。
  theme: {
    background: "#0a0a0a", foreground: "#ffffff",
    cursor: "#ffffff", cursorAccent: "#0a0a0a",
    selectionBackground: "#5a7898", selectionForeground: "#ffffff",
    black: "#1d1f21", red: "#cc6666", green: "#b5bd68", yellow: "#f0c674",
    blue: "#81a2be", magenta: "#b294bb", cyan: "#8abeb7", white: "#c5c8c6",
    brightBlack: "#666666", brightRed: "#d54e53", brightGreen: "#b9ca4a",
    brightYellow: "#e7c547", brightBlue: "#7aa6da", brightMagenta: "#c397d8",
    brightCyan: "#70c0b1", brightWhite: "#eaeaea",
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new WebLinksAddon.WebLinksAddon());
try { term.loadAddon(new ImageAddon.ImageAddon()); }
catch (e) { console.warn("[spike] image addon 未加载:", e); }

// Unicode 11 宽度表：中文、盒线字符按 2 列算。不加载的话宽度全按 1 列，
// 中文和边框会整体错位。
term.loadAddon(new Unicode11Addon.Unicode11Addon());
term.unicode.activeVersion = "11";

let serialize = null;
try { serialize = new SerializeAddon.SerializeAddon(); term.loadAddon(serialize); }
catch (e) { console.warn("[spike] serialize addon 未加载:", e); }

term.open(host);

// ---------------------------------------------------------------------------
// WebGL 的挂载顺序 —— 这一段是**照 Orca 的 pane-webgl-renderer.ts 搬的**，
// 不是自己排的。原文件里有句注释点破了关键：
//
//   "the grid this pane is running was measured under DOM cell metrics …
//    Keeping that grid leaves an unpainted right gutter and a
//    **PTY narrower than the pane**. Refit on the next frame."
//
// 也就是说：DOM 渲染器和 WebGL 渲染器的**单元格度量不一样**
// （WebGL 会把设备像素下的格子宽度取整）。如果先 fit、后挂 WebGL，
// 那个列宽是按 DOM 度量算出来的 —— PTY 拿到的列数和 WebGL 实际画出来的
// 格子宽度**对不上**，终端里所有按列定位的字符都会落在错误的位置上。
//
// 我们之前就是 open() → fit() → 挂 WebGL，正好是这个顺序。
//
// Orca 的解法是 attachWebglAndRefit()：挂载和重排**成对出现**，
// 而且挂完要 refresh 一帧（新 canvas 是空的，不重绘会看起来卡住）。
// ---------------------------------------------------------------------------
const gfx = { addon: null, on: false };
function attachWebgl() {
  // 名额满了就用 DOM 渲染器起来。**不是降级失败** —— xterm 的 DOM 渲染器
  // 画出来的字是对的，只是慢一档；而超上限的后果是"最早那些上下文被静默丢掉"，
  // 那是随机的、会连累已经正常的格子，比慢一档糟得多。
  if (webglLive >= WEBGL_MAX_CELLS) {
    // ⚠️ bootFact 而不是 sendCtrl：这个函数跑在 `await spawnTab(T)` **之前**，
    // 那时标签自己的流还没开（ready=false），工厂内那个 sendCtrl 会**静默丢掉**
    // 这条消息 —— 第一次实测第 9 格时它就是这么消失的：格子确实退成了 DOM
    // 渲染器（webgl=false canvas=0），但"为什么退"一个字都没留下。
    bootFact(`WebGL 名额已满（${webglLive}/${WEBGL_MAX_CELLS}），这一格用 DOM 渲染器`);
    return false;
  }
  try {
    gfx.addon = new WebglAddon.WebglAddon();
    gfx.addon.onContextLoss(() => {
      // 上下文丢失意味着字形图集被清空，必须整个退回 DOM 渲染器，
      // 并且**重排** —— 见上面：度量变了不重排，列宽就是错的。
      console.warn("[spike] WebGL 上下文丢失，退回 DOM 渲染器");
      try { gfx.addon.dispose(); } catch (e) {}
      gfx.addon = null;
      gfx.on = false;                       // 状态栏那格读数要跟着变
      webglLive--;                          // 名额还回去，别的格子能捡到
      requestAnimationFrame(() => { try { fit.fit(); pushSize(); } catch (e) {} });
      if (activeTab === T) paintRenderStatus();
    });
    term.loadAddon(gfx.addon);
    webglLive++;
    // 新挂上的 canvas 是空白的：立刻重绘一次，否则要等新输出才看得见东西。
    term.refresh(0, term.rows - 1);
    return true;
  } catch (e) {
    console.warn("[spike] WebGL 不可用，退回 DOM 渲染:", e);
    try { gfx.addon && gfx.addon.dispose(); } catch (e2) {}
    gfx.addon = null;
    return false;
  }
}

gfx.on = attachWebgl();
// 挂完渲染器才 fit —— 顺序反了列宽就是错的。
fit.fit();
// 再排一帧：字体/渲染器都就位后，格子度量才算稳定。
await new Promise((r) => requestAnimationFrame(r));
fit.fit();

// 快速 TUI 重绘会在**没有上下文丢失事件**的情况下把 xterm 的字形图集搅坏
// （Orca 的 clearTextureAtlas 就是为这个存在的，原注释：rapid TUI redraws
// can corrupt xterm's WebGL glyph atlas without a context-loss event）。
// Claude Code 正是高频重绘的 TUI，所以给它一个显式出口。
function resetGlyphAtlas() {
  if (!gfx.addon) return;
  try {
    gfx.addon.clearTextureAtlas();
    term.refresh(0, term.rows - 1);
    sendCtrl({ type: "log", msg: "已重置 WebGL 字形图集" });
  } catch (e) {}
}

// canvas 后备存储的 dpr 与当前 dpr 不一致时，整屏会发虚/错位。
// Orca 有专门的 terminal-canvas-dpr-repair.ts；这里先只做检测并回报，
// 因为在我们这个容器里还没观察到过一次 —— 不猜它一定存在。
function checkCanvasDpr() {
  const c = host.querySelector("canvas");
  if (!c) { sendCtrl({ type: "log", msg: "canvas 不存在（DOM 渲染器）" }); return; }
  const want = Math.round(c.clientWidth * devicePixelRatio);
  if (Math.abs(c.width - want) > 1) {
    sendCtrl({ type: "log", msg: `canvas dpr 不匹配: width=${c.width} 期望≈${want} dpr=${devicePixelRatio}` });
    requestAnimationFrame(() => { fit.fit(); pushSize(); });
  } else {
    sendCtrl({ type: "log", msg: `canvas dpr 正常: ${c.width}x${c.height} dpr=${devicePixelRatio}` });
  }
}

if (LigaturesAddon) {
  try { term.loadAddon(new LigaturesAddon()); }
  catch (e) { console.warn("[spike] ligatures 挂载失败:", e); }
}

  // 页面级代码要读的那几样，在这里就挂到标签对象上 —— **必须早于下面的
  // installImeAnchor**：它第一个动作就是 `t.term.element`，晚一行就是
  // "Cannot read properties of null (reading 'element')"。
  T.term = term; T.fit = fit; T.serialize = serialize; T.gfx = gfx;

// IME 候选框锚定：**每个标签各装一份**（原来是个模块级 IIFE，见下面那段注释 ——
// 在"只有一个终端"的前提下它才成立）。这里终端刚 open 完、元素齐全，
// 也正是它需要的时机。
installImeAnchor(T);

  // ---- 终端（含 WebGL）已经就位，现在去 Go 那边认领一条 stream ----
  // 必须在下面的 onopen/onmessage **之前**：那些赋值要一个真对象。
  // 名字由 Go 给（term:<id>），前端不自己编 —— 理由见 createTab 上面那段。
  const streamName = await spawnTab(T);
  /* C2：Go 明确拒绝了这次启动（护栏，见 resume.go）—— **不能走到下面去**。
     下面那句 `Stream(streamName)` 收的是空名字，会连一条不存在的流，然后
     T.stream 也照样被设上；那一格从此是个"看着在跑、其实没有 PTY"的幽灵。
     所以这里就地收尾：撤格 + 把原因说出来。
     ✅ 判据只认 `T.resumeRefused`，**不认"没有 streamName"**：后者还包括
     "2s 没等到应答"，那种情况必须保持原样（格子留着、界面交出去，见 spawnTab
     里那条兜底注释）—— 启动时第一个格子走的正是那条路，撤了就是白屏。 */
  if (!streamName && T.resumeRefused) {
    // ⚠️ 这里必须用 bootFact，**不能用 sendCtrl** —— createTab 这一层里
    // `sendCtrl` 指的是下面那个本格版本（故意遮蔽模块级的那个），而它开头就是
    // `if (!ready) return`：流还没开，消息**静默丢掉**。这条日志就这么消失过一次
    // （2026-10-15：拒绝路径跑通了、日志里却只有 closeTab 和 toast 那两行）。
    bootFact(`接上被拒（收尾）code=${T.resumeRefused.code} → 撤格、不建流`);
    closeTab(T);
    showToast(T.resumeRefused.msg || `接不上（${T.resumeRefused.code}）`, "err");
    return T;
  }
  T.streamName = streamName;

  // `ready` 已在函数开头声明（TDZ 那段注释），这里不再重新声明。
  const stream = Stream(streamName);
  // ⚠️ **必须挂到标签对象上**：closeTab 要靠它关掉这条连接，而 Go 那边是
  // "Receive 失败 → handler return → defer 收 PTY" 这条链。
  // 少了这一行，关格子只是把 DOM 和模型删掉 —— **PTY、claude.exe、Go 里的
  // stream handler 全部原地留着**，而且不留任何痕迹（这正是它一直没被发现的原因：
  // 关掉一个非当前格连日志都不产生）。
  T.stream = stream;

  // 标签自己的控制帧出口。**故意遮蔽**模块级的 sendCtrl：模块级那个发往 ctl
  // 通道（页面级的事实，比如"新建标签"），这一个发往本标签的字节流。于是
  // 下面整段里所有 sendCtrl({type:"resize"|"rename"|"open-wt"|"log"})
  // 自动落到正确的标签上 —— 一处调用点都不用改。
  function sendCtrl(obj) {
    if (!ready) return;
    const j = enc.encode(JSON.stringify(obj));
    const f = new Uint8Array(j.length + 1);
    f[0] = CTRL; f.set(j, 1);
    try { stream.send(f); } catch (e) { jserr("sendCtrl", e); }
  }

  stream.onopen = () => {
    ready = true; T.ready = true;
    T.connDown = false; renderAgentDot(T);
    if (activeTab === T) paintConnStatus(true);
    pushSize();
    fontProbe(); checkCanvasDpr();
  };

// 探针：量出方块/制表符这类字符**到底是哪个字体供的**。
// 机制是宽度 —— 等宽字体供的半格字符宽度 = 1 个字符宽；中文字体供的是**全角**，
// 宽度翻倍，相邻格子就会互相重叠，像素风 logo 的负空间被填死，糊成一块砖。
function fontProbe() {
  const c = document.createElement("canvas").getContext("2d");
  const w = (fam, ch) => { c.font = `14px ${fam}`; return c.measureText(ch).width.toFixed(1); };
  const probe = { "█": "U+2588", "▀": "U+2580", "─": "U+2500", "中": "CJK" };
  const parts = [];
  for (const [ch, name] of Object.entries(probe)) {
    parts.push(`${name}:主栈${w(MONO, ch)}/JBM${w('"JetBrains Mono WB"', ch)}/Cascadia${w('"Cascadia Code"', ch)}/MS Gothic${w('"MS Gothic"', ch)}`);
  }
  sendCtrl({ type: "log", msg: "fontprobe " + parts.join("  ") });
  sendCtrl({ type: "log", msg: `cascadia-avail=${document.fonts.check('14px "Cascadia Code"')} jbm-avail=${document.fonts.check('14px "JetBrains Mono WB"')}` });
}
stream.onclose = () => {
  ready = false; T.ready = false;
  T.connDown = true; renderAgentDot(T);
  if (activeTab === T) paintConnStatus(false);
};
stream.onerror = () => {
  T.connDown = true; renderAgentDot(T);
  if (activeTab === T) { $("s-dot").className = "dot off"; $("s-st").textContent = "连接错误"; }
};
stream.onmessage = (ev) => {
  const d = ev.data;
  if (d instanceof ArrayBuffer)   term.write(new Uint8Array(d));
  else if (ArrayBuffer.isView(d)) term.write(new Uint8Array(d.buffer, d.byteOffset, d.byteLength));
  else                            term.write(String(d));
};
term.onData((d) => { if (ready) stream.send(enc.encode(d)); });

// 每次 xterm 改变列宽都会**折行重排**已有内容，而 xterm 会在这一步把上一帧的
// 残留顶进回滚缓冲 —— 用户看到的"滚动时好几个吉祥物"就是这么来的。
// 所以要知道**到底发生了几次 resize、都在什么时候**：
// 一次拖拽该只推一次（见下面 settle 的 SETTLE_MS），这条日志就是判据。
let resizeCount = 0;
term.onResize(({ cols, rows }) => {
  resizeCount++;
  sendCtrl({ type: "log", msg: `term.resize #${resizeCount} -> ${cols}x${rows} @${Math.round(performance.now())}ms` });
});
// 这一个 chunk 里有没有 OSC 标题（下面 stale 计时器的分支判据，Orca handleChunk），
// 以及那个计时器的句柄。**都是每个标签一份**：两个会话各自在干活/空闲，
// 共用一个计时器会让先静下来的那个把另一个的 working 环灭掉。
let titleInThisChunk = false;
let staleTimer = 0;

// ---------------------------------------------------------------------------
// OSC 标题的**唯一落点**是标签（终端给的名字 = 这个标签的名字，这也是
// Windows Terminal 的约定）。以前这里同时写 #tab-nm 和 #p-title，
// 于是同一个 "Claude Code" 在中间列顶上并排出现两次（见上面 .phead 那段注释）。
term.onTitleChange((t) => {
  T.agentTitleRaw = t;
  titleInThisChunk = true;
  applyAgentTitleStatus(T, t);   // 状态点跟着标题走（下面「状态点」一节）
  renderTabTitle(T);
});

term.onWriteParsed(() => {
  const hadTitle = titleInThisChunk;
  titleInThisChunk = false;
  if (hadTitle) return;
  if (!T.agentTitleRaw || detectAgentStatusFromTitle(T.agentTitleRaw) !== "working") return;
  clearTimeout(staleTimer);
  staleTimer = setTimeout(() => {
    staleTimer = 0;
    const cleared = clearWorkingIndicators(T.agentTitleRaw);
    T.agentTitleRaw = cleared;
    // 走**同一个**渲染点：这里原来自己写一遍 #tab-nm，于是"3 秒静默"一触发
    // 就会把用户起的名字顶掉 —— 名字的优先级只该有一处（见 renderTabTitle）。
    renderTabTitle(T);
    T.agentState = "idle";
    renderAgentDot(T);
  }, STALE_WORKING_TITLE_TIMEOUT_MS);
});

// lastSizeSent：**尺寸没变就绝不往 PTY 发 resize**。
//
// 这一条是用户报的「滚动时吉祥物出现两次」的根因。
// 对 PTY 来说，一次 resize 就是「终端窗口被改变了」这个事件；CLI 收到它会
// **重画自己的开场界面**。而 pushSize() 在 onopen、ResizeObserver 初次观测、
// 窗口变化、拖拽分隔条时都会跑 —— 哪怕算出来的列宽行数和上次一模一样。
// 于是 Claude Code 画了两遍介绍框，第一份被顶进回滚缓冲，
// 往上滚就能看到两个吉祥物。
//
// 顺带：反复发同样的 resize 还会让 ConPTY 反复重排屏缓冲，
// 是那种"没什么事但一直微微闪"的来源。
let lastSizeSent = "";
function pushSize() {
  const h = host;
  // 和 settle() 同一条理由：隐藏标签（后台标签刚建出来还没激活）的盒子是
  // 0 宽，proposeDimensions 在那里会给出"2 列"这种**看起来成立**的尺寸。
  // 推给 PTY 就是让那个刚起来的会话白重画一屏 —— 正好是我们要消灭的那类
  // 多余 resize。激活时 setActive() → refit() 会补上真实尺寸。
  if (!h.clientWidth || !h.clientHeight) return;
  const p = fit.proposeDimensions();
  // 详细读数只回传日志；状态栏上留一格够用的就行。
  const amActive = activeTab === T;
  if (amActive) $("s-render").textContent = gfx.on ? "· WebGL" : "· DOM";
  // webgl=true 只说明 addon 挂上了，不代表它没被回收 —— 真在用的渲染器
  // 会往容器里插 canvas，所以这个读数要和 canvas 数量一起看（状态栏那格给不出
  // 这么多信息，只在日志里留）。
  // canvas 数量**光看个数判断不了**：xterm 一开始就有不止一个（还有测字宽用的），
  // 所以把每个的尺寸和 class 一起报出来 —— 「多出来的那一个是哪来的」只能这么问。
  const cvs = [...h.querySelectorAll("canvas")].map((c) => `${Math.round(c.clientWidth)}x${Math.round(c.clientHeight)}${c.className ? "." + c.className : ""}@${c.parentElement ? c.parentElement.tagName + "." + c.parentElement.className : "无父"}`).join(" ");
  sendCtrl({ type: "log", msg: `tab=${T.id} fit=${p ? p.cols + "x" + p.rows : "nil"} host=${h.clientWidth}x${h.clientHeight} term=${term.cols}x${term.rows} dpr=${devicePixelRatio} webgl=${gfx.on} canvas=${h.querySelectorAll("canvas").length} [${cvs}]` });
  if (!p || !p.cols || !p.rows) return;
  if (amActive) $("s-dims").textContent = `${p.cols}×${p.rows}`;
  const key = `${p.cols}x${p.rows}`;
  if (key === lastSizeSent) return;   // ← 就是这一行
  lastSizeSent = key;
  sendCtrl({ type: "resize", cols: p.cols, rows: p.rows });
}
// ⚠️ 「原生对比」按钮的监听**不在**这里。放在这里的话每建一个标签就会往
// 同一个按钮上再挂一个监听 —— 点一下 N 个标签一起开 Windows Terminal。
// 它是页面级（当前标签级）动作，见下面 P5 那段。

// ---------------------------------------------------------------------------
// 终端尺寸：**布局停稳之前，一个字节都不推给 PTY**
//
// 这是「吉祥物反复出现」的修法。对 PTY 来说一次 resize 就是「终端窗口变了」，
// CLI（Claude Code）收到就会整帧重画 —— 包括它的开场介绍框。所以推过去的尺寸
// 必须是真的、稳定的几何。以前这里是 `setTimeout(..., 50)`，布局还在动的时候
// 照样会跑，日志里留下了两个**根本不存在**的尺寸：
//   · fit=140x57 host=1142x920  —— 盒子量成了整个窗口，不是面板
//   · host=569x860              —— 918 高的窗口里，面板内高最大只有 834
// 这两次 CLI 都照着不存在的画布重画了一帧，介绍框就多一份。
//
// 做法照 Orca（src/renderer/src/constants/terminal.ts:19-28）：瞬时变化要让终端
// 和新布局落在同一帧，连续拖拽才走 ResizeObserver；共同点是**不拿一个还在动的
// 盒子去量**。这里落成两条：
//   1) 连续两帧量到同一个尺寸，才算"停稳"；
//   2) 停稳后还要过 boxOk()：宿主必须正好是它容器内缩 4px 的结果 —— 量到整窗

    // 我第一版漏了这一帧 —— 后果很具体：闸永远不开，用户紧接着点到别处时那次 blur

    requestAnimationFrame(() => {

function closeRename() {
  renameSeq++;

  renameUserWantsBlur = false;

function commitRename() {

  if (!tabEditing || renameSubmitted) return;

function cancelRename() {

function onRenameBlur() {

  // 就不该结束（Orca 原逻辑，见上面 (2) 与 :84-112）。
  const seq = renameSeq;

// 为什么不用 Wails 的绑定（Call.ByName）：绑定在服务端按「<包路径>.<结构体>.<方法>」
// 查名字，而那些名字要跑 codegen 生成带对象 id 的 JS 调用桩 —— 我们的构建现在是
// 纯 `go build`，不想为此引入构建步骤。这条流复用已有的控制帧形状，零新 API 面。
//
// ⚠️ 建标签是**请求/应答**，不是单向通知 —— 这是这套设计里最容易搞反的一处：
// Go 在运行期注册 `term:<id>` 这个 stream handler，而服务端是**在连接建立时**
// 才按名字查 handler，查不到直接 404（stream_server.go:247-256）。所以必须等 Go
// 把 id 和名字发回来，前端才能去连。顺序由这条应答保证，不靠时序运气。
const ctl = JSONStream("ctl");
let ctlReady = false;
const ctlPending = [];        // ctl 连上之前攒下的建标签请求
let spawnTabCalls = 0;        // 临时探针：spawnTab 被调了几次

function spawnTab(t) {
  /* 探针，**故意留着**：2026-10-15 见过一次"点一下 + 建出 7 个标签"（建 7 个、
     又关掉 6 个，全在无输入的情况下按 ~1s 的节奏发生）。它和那次
     `ReferenceError: Cannot access 'ready' before initialization` 同时出现，
     修掉那个 TDZ 之后再点 9 次都是"一次点击 = 一个标签"，**复现不出来了**。
     这条是唯一能抓住它回来的证人（Go 那边 `[ctl] 新标签` 只在往返成功后才打，
     页面这条在 Go 不回应时也留得下）。 */
  bootFact(`建标签 #${++spawnTabCalls} spec=${JSON.stringify(t.spec)}`);
  return new Promise((resolve) => {
    let settled = false;
    const done = (name) => { if (!settled) { settled = true; resolve(name); } };
    t.onSpawned = done;
    // 兜底：ctl 一直不回就**别把整页卡死** —— 模块顶层那句 await 会一直挂着，
    // 页面看起来就是"白屏"。宁可这个标签没有 PTY，也要把界面交出来。
    setTimeout(() => {
      if (!settled) {
        t.onSpawned = null;
        done("");
        sendCtrl({ type: "log", msg: `tab.new 超时（2s 没收到 tab.ok），标签 ${t.id || "?"} 先不连 PTY` });
      }
    }, 2000);
    if (!ctlReady) { ctlPending.push(t); return; }
    ctl.send({ type: "tab.new", spec: t.spec });
  });
}
ctl.onopen = () => {
  ctlReady = true;
  ctl.send({ type: "log", msg: `ctl 通道已连接（攒下的建标签请求 ${ctlPending.length} 个）` });
  // 补发启动期攒下的错误（那段"普通脚本"抓的，见文件头部）—— 那时还没有通道。
  for (const m of window.__bootErr) ctl.send({ type: "log", msg: "启动期错误: " + m });
  window.__bootErr.length = 0;
  // 通道建好之前攒下的**非错误**事实（见 bootFact）——同样补发，但不加"错误"前缀。
  for (const m of window.__facts) ctl.send({ type: "log", msg: m });
  window.__facts.length = 0;
  // 应答按发送顺序回来（同一条流），所以谁先发谁先拿到 id。
  for (const t of ctlPending.splice(0)) ctl.send({ type: "tab.new", spec: t.spec });
};
ctl.onmessage = (ev) => {
  const m = ev.data || {};
  // Go 推来的**观测**消息（hook / 会话登记表 / 转录）都走这条通道 ——
  // 它们和 tab.ok 是同一根流上的两类东西：一类是应答（tab.ok），
  // 一类是"它自己说它在干什么"（下面四种）。分发出去，各自归档。
  switch (m.type) {
    case "tab.ok": {
      const t = TAB_LIST.find((x) => x.id === 0 && x.onSpawned);
      if (!t) { ctl.send({ type: "log", msg: "tab.ok 没有对得上的标签，忽略" }); return; }
      /* C2：Go **拒绝**了这次启动（护栏见 main.go / resume.go）。它没有建标签，
         所以 tab=0、stream 空。
         ⚠️ 这里**只记不做收尾**：撤格子和弹提示都交给 createTab 在 `await
         spawnTab(T)` 之后统一做。原因很实在 —— createTab 在那个 await 后面还要
         建流（`Stream(streamName)`）、挂 addon、设 T.stream，在这里就把格子拆掉的话，
         那些代码会对着一个已经消失的格子继续跑，等于造出一个"看起来在跑、
         其实没有 PTY、流还连着一个不存在的名字"的幽灵格。 */
      if (m.err) {
        t.resumeRefused = { code: m.err, msg: m.msg || "" };
        const done = t.onSpawned;
        t.onSpawned = null;
        sendCtrl({ type: "log", msg: `接上被拒 code=${m.err} msg=${m.msg} spec=${JSON.stringify(t.spec)}` });
        done("");
        return;
      }
      t.id = m.tab;
      t.streamName = m.stream;
      const done = t.onSpawned;
      t.onSpawned = null;
      done(m.stream);
      return;
    }
    case "hook":  applyHook(m);  return;
    case "agent": applyAgent(m); return;
    case "acts":  applyActs(m);  return;
    case "files": applyFiles(m); return;
    case "state": applyLibrary(m.state); return;
  }
};
ctl.onerror = () => { ctlReady = false; };

// 页面级日志走这条通道。它比任何标签流命都长 —— 页面刚起来、一个标签都还没有
// 的时候也能落日志（C1 重构期间就是靠这一点看见"前端到底跑到哪一步了"）。
function sendCtrl(obj) {
  if (!ctlReady) return;
  try { ctl.send(obj); } catch (e) { jserr("sendCtrl", e); }
}

// 建标签早期（term.open 前后）想留一条事实时用它：那时标签自己的 sendCtrl
// 还没就绪（它挂在 await 之后），而页面级通道可能也还没连上 —— 没连上就先攒着。
// 当前唯一调用点是 renderGrid() 里那条网格形状探针 —— 它正好落在
// "**第一个**标签还在模块求值期间同步建出来"的那段里，那时 ctlReady 必然是 false。
// 教训：**在模块求值路径上，页面级 sendCtrl 是一条会静默吞掉消息的通路**，
// 它只适合放在事件回调（onopen 之后）里。
function bootFact(msg) {
  if (ctlReady) { try { ctl.send({ type: "log", msg }); return; } catch (e) {} }
  window.__facts.push(msg);
}

// ---------------------------------------------------------------------------
// 标签条
//
// **渲染 = 把已有的 .tab 元素按模型顺序重新 append**，不重建 DOM。
// 重建会有一个很难查的后果：重命名时 .nm 被换成了输入框，重建等于把用户
// 正在打的字连输入框一起删掉。标签元素由 createTab 建一次，归属它自己。
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// 网格形状（C4.5）—— 从 ceil(sqrt(N)) 换成**按容器实测推导**
//
// 老规则是「正方形」启发式：1→1、2→2、3~4→2、5~9→3。它的问题不在结果，
// 在**依据**：格子是 8×18 的竖长格（字宽 : 行高 ≈ 1:2.25），一个"每格接近
// 正方形"的网格，等于每格的**行数**只有列数的三分之一 —— 而 claude 的 TUI
// 是横着排版的，它先缺行、后缺列。所以"方形"从来不是这个问题的正确目标。
//
// ⚠️ 先说清楚**Orca 没有回答这个问题**，别以为这里有现成的答案可抄：
//   - `pane-fit-measurability.ts:8-11`：MIN_PANE_FIT_{WIDTH_PX,HEIGHT_PX,COLS,ROWS}
//     = 48/24/8/4，低于它**拒绝 fit**，注释理由是防止 "Fitting there pins the
//     PTY at ~2 cols" —— 它保证的是"不把不可信的尺寸推给 PTY"（= 我们的 boxOk()），
//     **不是**"每一格都好看"。
//   - `terminal-grid-size-for-box.ts:2`：MINIMUM_COLS = 2，直接抄 xterm FitAddon。
//   - `pane-divider-drag.ts:16`：拖动下限 MIN_PANE_SIZE = 50(px)，而且
//     `effectiveMinPaneSize = Math.min(50, totalSize/2)` —— 总宽不够两个 50 时
//     **自动让路**（否则算出负 flex）。
//   ⇒ Orca 把"切成多小"完全交给用户的手（它默认是手工分屏）。我们既然是
//     **自动**成网格，就必须自己定这条规则 —— 这段就是它。
//
// 列数：ceil(sqrt(N))。**这条一个字都没改** —— 1→1、2→2、3~4→2、5~9→3，
// 先并排、排满一行再下一行。
// ⚠️ 2026-10-15 我一度把它换成"按容器实测挑最平衡的摆法"，结果 N=2 排成了
// **上下叠**（1×2）—— 用户在它出现的那一刻就否了：并行就是先并排，像之前那样。
// 教训记在这儿别再走一遍：**"每格列数最多"不是个好目标**（叠起来每格 111 列、
// 并排 54 列，比列数它赢），而 claude 的介绍框宽度固定 ~65 字符，多出来的列
// 全是空的；可它错得不像"少两列"那么无害 —— 它把**并排**变成了**上下叠**，
// 那是产品形态，不是布局细节。布局这一层不许自己改。
//
// 这里原先还有两个 JS 常量（CELL_HEAD_H / GRID_GAP_PX），是给"每格能排下多少
// 列多少行"用的。那个读数算错过（见下），两个常量就一起删了 —— 间距的唯一
// 定义回到 CSS 的 `gap: var(--grid-gap)`，不再有一份必须"记得同步"的影子副本。 */

// ⚠️ 这里**故意没有**"一个格子里能排下多少列多少行"这种函数 —— 我写过一个，
// 拿它算出"每格 34 列"写进日志，而真值是 54。错因不是公式，是**调用时机**：
// renderGrid 跑的时候主区宽度还没被折成列数。
// 教训：**在"摆法"这一层只允许出现 N 的纯函数**（下面的 gridCols 就是），
// 凡是需要量容器的数，都放到布局稳定之后、由真正负责渲染的那个人去报。
function gridCols(n) { return Math.max(1, Math.ceil(Math.sqrt(n))); }

// 摆法：**只算列，不算别的**。rows 是 N 摊到列数上的结果，不是另选的参数。
//
// 这里**故意不量容器**：早先它顺手把"每格可用宽高"也算了（bw/bh）并写进日志，
// 结果是错的 —— renderGrid 里那一刻主区宽度还没落地（见上面那段注释），
// 量到的是变宽之前的中间态。既然这个数不可信，就别让它存在：
// 要每格多大，去读各格自己 fit 完报的 `[web tN] fit=WxH`。
function gridShape(n) {
  const cols = gridCols(n);
  return { cols, rows: Math.ceil(n / cols) };
}

// 网格重排。**只动容器上的一个变量**，格子元素由 createTab 建、归属它自己
// （重命名会把 .nm 换成输入框，重建 DOM 等于把用户正在打的字一起删掉）。
function renderGrid() {
  const n = TAB_LIST.length;
  const tb = $("termbody");
  const shape = gridShape(n);
  /* C5：独立页视图下 --gcols 必须是 1 —— 别的格虽然 display:none（不参与布局），
     但"可见的那一格占几列"仍然由 --gcols 决定：3 列的网格里只放一个 1 跨的
     格子，它只会拿到 1/3 宽。 */
  tb.style.setProperty("--gcols", String(soloTab ? 1 : shape.cols));
  // 压暗只对"多个格同时可见"成立（独立页上只有一个格，压暗它自己没道理）。
  tb.classList.toggle("multi", n > 1 && !soloTab);
  tb.classList.toggle("solo", !!soloTab);

  /* 最后一行的空格子**必须填掉**，而且这次的理由比 C4 时更硬：
     网格底色现在是 #3f3f46（隔离线那一层），留一个空槽就是**一块实心灰**，
     比 C4 时那块"看着像坏了"的 #151515 更刺眼。
     做法：最后一行的 k 格按比例吃掉整行的列（cols=3、k=2 → 2+1；
     k=1 → 整行）。余数给**最后一格**，和 C4 时"最后一格横跨整行"一致。
     （C4 那条只在 k=1 时生效；n=5、cols=3 时它什么都不做，然后留一块灰。） */
  const lastRow = n % shape.cols === 0 ? shape.cols : n % shape.cols;
  const each = lastRow > 0 ? Math.floor(shape.cols / lastRow) : shape.cols;
  TAB_LIST.forEach((t, i) => {
    const k = i - (n - lastRow);              // 本行第几格（0 起；负数=不在最后一行）
    let span = 1;
    if (!soloTab && n > 1 && lastRow < shape.cols && k >= 0) {
      span = k === lastRow - 1 ? shape.cols - each * (lastRow - 1) : each;
    }
    // 用行内样式而不是 class：class 没法带数值，而这里的跨度是算出来的。
    // 置空是必须的 —— 网格会自动把"上一轮的 span"继承下来（元素没换）。
    // ⚠️ 独立页视图下**所有**格子都要置空：被拎出去那格若留着上一轮的 span，
    // 回到网格时它会先按错的跨度渲染一帧（布局抖动，截图看得出来）。
    t.cellEl.style.gridColumn = span > 1 ? `span ${span}` : "";
    t.cellEl.classList.toggle("solo", t === soloTab);
  });

  const cnt = $("pn-cnt");
  if (cnt) cnt.textContent = String(n);
  // 群组那一屏的"座位"跟着网格模型走（多一格/少一格/换了当前格），所以在这里
  // 补一次。它是"一帧一次"的（scheduleGroup 自己挡），收起时才真的干活 ——
  // 启动路径上 createTab → renderGrid 会跑到这一句，那时 collapsed 还是 false，
  // 直接返回（这也是那批声明必须写在启动之前的原因，见 RSB_READY 那一块）。
  scheduleGroup();
  // C6a：这里原来还有一句 `applyPaneColsForCells()` —— 格数变了就把"每格多少列"
  // 这个用户偏好重新折成主区宽度。现在**没有这个动作了**：
  //   主区宽度只由"窗口 − 左栏 − 右栏"决定，格数变不改变它，只改变它怎么分
  //   （cols = ceil(sqrt(N))）。宽度一变，各格自己的 ResizeObserver 就醒了，
  //   各自 refit —— 不需要谁来"按 N 折一遍"。
  // 顺带，C5 那条"独立页视图下故意不碰主区宽度"的顾虑也一起消失：
  // 拎进拎出时本来就没人会去改主区宽度。
  paintGridStatus();
  /* 探针：**摆法是算出来的、屏幕上看不出它凭什么这么算**，所以回一条。
     ⚠️ 这条只报**renderGrid 自己能确定的三件事**：几格、摆法、容器多大。
     - **不报"每格多少列"**：这个数要等各格 fit 完才成立（C6a 之前还要等主区
       宽度落地），而且"每格"这个概念在 N=1 时根本没意义。每格真实的列×行由它
       自己 fit 完报的 `[web tN] tab=N fit=WxH` 给，那一条才是权威（实测过：
       N=2 容器 906 → 每格 54 列；N=1 容器 673 → 81 列。都对得上）。
     - **不报字格**：那条要么量的是"当前这一格"（renderGrid 跑的时候可能还没有
       当前格），要么落到 8×18 的估数上 —— 屏幕上显示的 18 跟真实的 16 不一样，
       等于往探针里塞了一个假的测量值。字宽/行高、DPI、字体这些"渲染是否正常"的
       事实在 `fontprobe` / `canvas dpr` 两条里各有一份真的，别在这儿重复。
     ⚠️ 容器走 rAF 再量：不是因为它现在量错（实测 673/906 都对），而是因为
     网格样式（--gcols / span）是**同一帧里**刚写上去的，等一帧再读永远比
     抢在布局中间读稳。摆法是 N 的纯函数，不用等，先取值带进闭包。
     ⚠️ 必须走 bootFact 而不是 sendCtrl：**第一个标签是在模块求值期间同步建出来的**
     （顶层 `await createTab(...)` 的第一个 await 之前那段），而 ctl 通道要等
     模块求值让出主线程之后才会 onopen —— 那一刻 ctlReady 还是 false，
     页面级 sendCtrl 会**静默 return**（`if (!ctlReady) return;`）。
     这正是这条日志第一次跑就消失的原因，也正是本文件里 bootFact 存在的原因
     （它自己那段注释说"现在没有调用点了" —— 现在又有了）。 */
  const shapecols = shape.cols, shaperows = shape.rows;
  const soloId = soloTab ? soloTab.id : 0;
  requestAnimationFrame(() => {
    const 摆法 = soloId ? `独立页(tab=${soloId})` : `${shapecols}×${shaperows}`;
    // C3 验收要按"结束这一格"的 ×（`.cellhead .x`），而它**每一格都在不同位置**、
    // 而且 N 一变就整体重排 —— 把 N=1 那次量的坐标拿去点 N=2 的格子就是目测。
    // 所以坐标跟着布局事实一起报：重排一次就有一行新的、可直接用的数。
    const 关格 = TAB_LIST.map((t, i) => {
      const el = t.tabEl && t.tabEl.querySelector(".x");
      if (!el) return `#${i + 1}=?`;
      const b = el.getBoundingClientRect();
      // 报**序号**而不是 `t.id`：第一帧布局时标签 id 还没从 ctl 回来（那时是 0），
      // 报出来就是 `t0` —— 一个会骗人的名字（我自己就被它绕了一下：
      // N=1 那行的 `t0` 是"还没拿到 id 的第一格"，不是"id 为 0 的格子"）。
      // 序号和网格里的位置一一对应，也就是"该点哪一颗"。
      return `#${i + 1}=${Math.round(b.left + b.width / 2)},${Math.round(b.top + b.height / 2)}`;
    }).join(" ");
    bootFact(`网格 N=${n} 摆法=${摆法} 容器=${Math.round(tb.clientWidth)}×${Math.round(tb.clientHeight)} 关格 ${关格}`);
  });
}

// ===========================================================================
// C5：独立页 —— 把一个 agent 从并行网格里"拎"到标签条上
// ---------------------------------------------------------------------------
// 语义（产品形态，用户定的）：
//   · 标签条 = **页面**。「并行」是第一张页、写死在 HTML 里、不可关；
//   · 把一个格子头往上拖到标签条 = 把这个 agent 拎成一张独立页；
//   · 关掉那张页 = 把这个 agent **还给网格** —— 不是杀掉它。
//   ∴ 页面标签上的 × 是"关页面"，网格里格子头上的 × 才是"结束这个 agent"。
//
// ⚠️ 拎出去**不是把 agent 从网格里摘走**：TAB_LIST 不动、PTY 不动、stream 不动，
//    动的只有 #termbody 上的一个类（机制见 CSS 里那段，出处是 Orca 的
//    expand-collapse.ts）。所以"还给网格"不需要任何恢复动作 —— 它本来就在那儿。
// ===========================================================================

// 一张页 = 一个标签元素，外观和「并行」同一套（所以 #tablist .tab 那几条直接
// 生效）。元素挂在标签对象上，和格子头一样**建一次就不重建**（重命名会把 .nm
// 换成输入框，重建等于把用户正在打的字连输入框一起删掉）。
function makePageEl(t) {
  if (t.pageEl) return t.pageEl;
  const el = document.createElement("div");
  el.className = "tab";
  el.innerHTML =
    `<span class="adot" data-state="idle" role="img" aria-label="空闲"></span>` +
    `<span class="tab-ico"></span>` +
    `<span class="nm ell"></span>` +
    `<span class="x" title="关闭页面（agent 回到网格，不会结束它）">×</span>`;
  t.pageEl = el;
  t.pageDotEl = el.querySelector(".adot");
  t.pageIcoEl = el.querySelector(".tab-ico");
  t.pageNmEl = el.querySelector(".nm");
  t.pageIcoEl.innerHTML = claudeIcon(12);

// 拎成独立页（点已存在的那张页也走这里 = 切过去）。
function showPage(t) {

     `if (panes.length <= 1) return false`：只有一个 agent 时"独立页"和网格
     是同一个东西，拎出去只是让标签条多一张纸，还多一处要维护的状态。 */
  if (TAB_LIST.length <= 1) {
    // 兜底：手势那条已经挡过一次（见 pointermove 里那段），这里是第二道闸 ——
    // 别的入口将来要是绕过手势直接调它，也不该能拎出去。
    sendCtrl({ type: "log", msg: `拒绝拎出 tab=${t.id}：并行里只有 1 格（Orca 同判据 panes.length<=1）` });
    return;

  makePageEl(t);
  renderPageTabs();
  renderGrid();

  t.refit();

  // `!soloTab` 的分支）—— 拎出去时特意不碰的宽度，在这里还回去。
  renderGrid();

// ── 拎页的手势：在格子头上按下 → 往上拖到标签条 → 松手 ──────────────────────

//   ① dragstart 没法从合成输入稳定驱动（本 spike 的验收全靠 z-drive 真手势）；
//   ② pointer 这条路上，那个"跟着指针走的幽灵片"是我们自己画的（DnD 那个
//      系统自带的拖影在 WebView2 里样式不受控，质感必然对不上）。
// 判据是"**往上、且纵向为主**、位移超过 6px"：往下拖今天没有语义（留给以后
// 换格子顺序），横向拖是选字 —— 两个都不能被这里吃掉。
const DRAG_MIN = 6;
let dragState = null;

// 幽灵片**复用标签的外观**（同一个 12px 图标、同一个 .nm 省略号、同一个圆角）：

  g.querySelector(".tab-ico").innerHTML = claudeIcon(12);

$("termbody").addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || dragState) return;
  // 关闭按钮和重命名输入框是它们自己的控件，不参与拎页。
  if (e.target.closest(".x") || e.target.closest(".tab-input")) return;
  const el = e.target.closest(".cellhead");
  if (!el) return;
  const t = TAB_LIST.find((x) => x.tabEl === el);
  if (!t) return;
  // 正在给这一格改名时不拎：改名的输入框长在这个头里面，被拎出去的头会
  // display:none，输入框跟着被藏起来，blur 还会往一个看不见的框上提交。
  // （点在输入框本身上面那条已经挡掉了，这条挡的是头两侧的空白。）
  if (tabEditing && renameTab === t) return;
  dragState = { t, x0: e.clientX, y0: e.clientY, on: false, ghost: null, head: el };
  // 捕获：指针拖到标签条上之后（早就不在这一格头顶了），move/up 仍然送回这里 ——
  // 少了这一条，抬手事件会落到别的元素上，拖拽永远收不了尾。

       说"不行"，那是在骗人 —— 拿掉了 d.on 的启动，就等于这个手势在这里压根
       不存在（和拖不动的东西手感一致）。判据见 showPage：Orca 同一条。 */
    if (TAB_LIST.length <= 1) {

   那时 `dragState` 会**一直是非空**，而 pointerdown 的第一行就是
   `if (dragState) return`，于是**之后所有拎页手势静默失效**。
   静默是关键：界面上没有任何东西坏掉，只是"拖不动了"，这种故障最难被归因。
   窗口失焦是"这一轮输入不会再回来"的可靠信号，就在这儿收尾。
   按**取消**处理（不是提交）：失焦那一刻不知道用户想不想放，猜错就等于

  d.ghost.remove();
  d.head.classList.remove("dragging");
  $("tabs").classList.remove("drop");
  sendCtrl({ type: "log", msg: `拎页取消 tab=${d.t.id}（窗口失焦，手势没收尾）` });

// 点「并行」= 回网格。点某张页 = 切过去；点它的 × = 关页面（agent 回网格）。
$("tab-parallel").addEventListener("click", () => backToGrid());
$("tablist").addEventListener("click", (e) => {
  const el = e.target.closest(".tab");

  const t = TAB_LIST.find((x) => x.pageEl === el);
  if (!t) return;
  if (dragJustEnded()) return;
  if (e.target.closest(".x")) { closePage(t); return; }
  showPage(t);
});

// 切换"当前格"。**唯一给模块级 `term` 赋值的地方。**
//
// 网格里所有格子**同时可见**，所以这里不再有"藏起来/显出来"这回事 ——
// 它只剩三件事：把 #termhost 这个 id 挪过来（文件里按 id 找宿主的代码要），
// 标记哪一格是当前格（左边那条竖条），以及把焦点交给它。
function setActive(t) {
  if (!t || activeTab === t) return;
  if (activeTab) {
    activeTab.host.removeAttribute("id");   // #termhost 永远只属于当前格
    activeTab.cellEl.classList.remove("cur");
    activeTab.tabEl.classList.remove("on");
  }
  activeTab = t;
  t.host.id = "termhost";
  t.cellEl.classList.add("cur");
  t.tabEl.classList.add("on");
  term = t.term;                            // ← 页面级那几十处读到的就是它
  renderAgentDot(t);
  renderTabTitle(t);
  paintConnStatus(t.ready);
  paintRenderStatus();
  if (t.lastSizeSent) $("s-dims").textContent = t.lastSizeSent.replace("x", "×");
  t.refit();
  t.focus();
  // 切到它 = 看过它（Orca 的 unread 就是"看过即销"）：把它那条「需要你」
  // 降级成「空闲」，并重画右栏那四个模块 —— 它们的主语是当前格，
  // 当前格换了，改动/流水/子代理三栏的内容整批跟着换。
  ackNote(t, "切格");
  // 切到一格就顺手把它的流水快照补齐（页面刷新后每格都是空的，见 askActsSnapshot）
  askActsSnapshot("成为当前格");
  scheduleLive();
  // 探针：**模型和布局是两件事**。像素只能告诉你"谁盖住了谁"，量不出格子有多大，
  // 所以格子的真实几何回传到日志。C4 验的就是"N 格同屏、各自拿到自己的尺寸"。
  const tb = $("termbody");
  sendCtrl({ type: "log", msg: `setActive tab=${t.id} 模型=${TAB_LIST.length} 列=${tb.style.getPropertyValue("--gcols")} 格=${[...tb.children].map((e) => Math.round(e.offsetWidth) + "x" + Math.round(e.offsetHeight)).join(",")}` });

// 关掉一个格子：关掉它的 stream，Go 那边 Receive 失败就 return，

     只记没收到 Stop 的那些：关掉一个已经跑完的格子，不是"关闭了里面的子代理"。
     ⚠️ 另一半也要记：hook 报过 Stop 的那些，**趁 LIVE 还在**记进 subDone ——
     下面几行就把这一格的 hook 模型删了，不记的话"我们看着它完成"这条当场蒸发，

$("termbody").addEventListener("click", (e) => {
  const el = e.target.closest(".cell");
  if (!el) return;
  const t = TAB_LIST.find((x) => x.cellEl === el);
  if (!t) return;
  if (e.target.closest(".x")) { closeTab(t); return; }
  // **点它 = 我看了它**：「需要你」那条（未读的铃铛）就在这里销掉。
  // 这一句必须在 setActive 之前/之外：setActive 在"点的就是当前格"时会直接
  // 返回，而"当前格刚跑完、我点它一下"恰恰是最常见的销账动作。
  setActive(t);
  ackNote(t, "点格");

  //   你刚点的这一格；来源签会同时变成「当前格」，写得出来就不算歧义。）

// 少了这一条，用鼠标点进终端打字时，状态栏/面板头显示的仍然是上一个格子 ——
// 而 #termhost 这个 id（"谁是当前格"）也会留在别人身上。
$("termbody").addEventListener("focusin", (e) => {
  const el = e.target.closest(".cell");
  if (!el) return;
  const t = TAB_LIST.find((x) => x.cellEl === el);
  if (t) setActive(t);
});

//
// 抽成具名函数是因为**两处**要点它：标签条那颗「+」，和收起后群组那一屏顶部
// 那排末尾那颗 —— 两处各写一遍，"回网格"和"切到新格"里漏一句的后果是看着
// 点了没反应（新格子藏在别的视图里），而这种漏很难在截图里看出来。
async function newParallelTab(why) {
  // C5：正在看某张独立页时点「+」—— 视图先回网格。新 agent 是加进**并行**里的
  // （这就是这个按钮的标题："新开一个并行 agent"），留在页面上会让人点了没反应
  // （新格子藏在 display:none 里）。回网格那一下顺手把主区宽度按新 N 折回来。
  if (soloTab) backToGrid();
  const t = await createTab(DEFAULT_SPAWN_SPEC);
  // 建格失败那条路（护栏拒绝）里 createTab 已经把这一格撤了（closeTab）——
  // 它照样返回了 T，别拿着一个不在 TAB_LIST 里的格去 setActive。
  if (!TAB_LIST.includes(t)) return;
  renderGroup();
  sendCtrl({ type: "log", msg: `新开并行 agent tab=${t.id}（${why || "点 +"}）现在 ${TAB_LIST.length} 格` });
  /* ⚠️ 从**群组**里点 + （此时是收起的）必须**进去**那一格，不能只 setActive：
     新格的 PTY 还没起 —— 前端的首帧尺寸就是 PTY 的启动闸（Go 侧 awaitInitialSize），
     而收起的群组里那一格是 0×0，报不出尺寸（实测：点完 + 过了 45s 日志里都没有
     `已启动`，展开的那一下 PTY 才起来）。不进去的话，屏上会出现一个"有行、没有
     PTY"的 agent，而用户点 + 本来就是要接着给它派活 —— 那必须有终端。
     展开着的格子（标签条那个 +）本来就有尺寸，照旧 setActive，不闪、不夺焦点。 */
  if (collapsed) goToTab(t, why || "群组那排 +");
  else setActive(t);
}
$("tab-add").addEventListener("click", () => newParallelTab("点标签条 +"));

// ---------------------------------------------------------------------------
// 「开场介绍框被画了几次」探针
//
// 用户报的现象：**往上滚的时候能看到两个吉祥物**。
// 首屏看不出来（第二个被顶进回滚缓冲了），所以必须直接数缓冲里的行 ——
// 这正是"截图看不见但确实存在"的那类问题。
//
// 判据用 "API Usage Billing"：它是介绍框里最有辨识度、又不会出现在别处的字符串。
//
// 出现 2 次有两个已知成因，都要防：
//   - CLI 真的把开场界面画了两遍 —— 多发了一次 resize（见 pushSize 的去重）；
//   - 字节流被破坏，同一段内容在屏幕上出现两次 —— Wails 的 Send 是**排队不拷贝**，
//     而读循环复用了 buf（见 main.go 里那段说明）。这个是 2026-10-15 找到的真因。
function countBanners(tag, t) {
  t = t || activeTab;
  if (!t) return;
  const b = t.term.buffer.active;
  let hits = 0;
  for (let i = 0; i < b.length; i++) {
    const line = b.getLine(i);
    if (line && line.translateToString(true).includes("API Usage Billing")) hits++;
  }
  sendCtrl({
    type: "log",
    msg: `介绍框检查[${tag}]: 回滚缓冲共 ${b.length} 行，开场介绍框出现 ${hits} 次（应为 1）`,
  });
}
setTimeout(() => countBanners("9s", activeTab), 9000);

// ---------------------------------------------------------------------------
// IME 候选框锚定：让它跟着 **Claude Code 的输入框**，而不是 xterm 的光标
//
// 【为什么需要】实测（2026-10-15，探针把缓冲区打出来了）：
//   操作系统在 `compositionstart` 那一刻读聚焦 textarea 的屏幕矩形，据此摆候选框。
//   xterm 把 textarea 摆在自己的 buffer 光标上 —— 而 Claude Code **把终端光标
//   停在自己画的状态行末尾**，不是输入框：
//       buffer 光标 = (75, 8)  行内容 "  ⏵⏵ auto mode on … ● high · /effort"
//       真正的输入框 = ( 0, 6)  行内容 "❯  "
//   → 候选框（连同预编辑串）横向偏 (75-2)×8 = 584px。这就是"偏差很大"。
//
// 【已排除的一条】Orca 的 terminal.css:56-59 把 `.xterm-helpers{left:0}` 当作
//   IME 偏移的修法，理由是 Blink 下 `left:auto` 会解析成非 0。**在我们这儿不成立**：
//   探针实测 computed left 恒为 `0px`。别再加那条。
//
// 【做法】骨架照搬 Orca 的 lib/pane-manager/terminal-ime-candidate-anchor.ts（MIT）：
//   在 compositionstart / compositionupdate 上，**在 xterm 自己的处理器之后**
//   （xterm 监听在 textarea 上，我们监听在 term.element 上，冒泡保证顺序）
//   把 textarea 与 .composition-view 重写到位。
//   与 Orca 的差异只有"输入框在哪"这一段 —— 它认 Cursor 的 `→ `，Claude Code 认 `❯ `。
// ---------------------------------------------------------------------------
const CC_IME_PROMPT = "❯";   // U+276F，Claude Code 输入框的提示符

// 「这个格子算不算空白」—— **别用 `getChars() === " "` 判**。
//
// 实测（探针把 col0..col3 原样打了出来）：Claude Code 的输入行是
//     col0 = "❯"  code=10095
//     col1 = " "  code=160     ← **U+00A0 不换行空格（NBSP），不是普通空格**
//     col2 = " "  code=32      ← 这个才是普通空格
// 它显然是用 NBSP 来保证空输入时提示符后面那个可见间隙不被终端裁掉。
// 只认 `" "` 的话这一格永远判不过，整段识别**静默失效、不报错** ——
// 这个坑花了两轮才挖出来，别退回去。
// 用 `String.trim()` 判：按 ECMAScript 规范它连 NBSP 一起吃掉。
function ccImeIsBlankCell(c) {
  if (!c || c.getWidth() === 0) return true;
  const ch = c.getChars();
  if (ch === "") return true;      // 空串 = 没写过字的空格格
  return ch.trim() === "";
}
// 提示符所在列 → 输入内容的起始列。**要求提示符后面跟一个空白格**，
// 与 Orca 判 `→ ` 同理：转录正文里偶发的同样字符不该被当成输入框。
function ccImeInputStartColumn(line, cols) {
  for (let col = 0; col < cols - 1; col++) {
    const c = line.getCell(col);
    if (!c || c.getWidth() <= 0) continue;
    if ((c.getChars() || " ") !== CC_IME_PROMPT) continue;
    const next = col + Math.max(c.getWidth(), 1);
    const nc = next < cols ? line.getCell(next) : undefined;
    if (nc && ccImeIsBlankCell(nc)) return next + Math.max(nc.getWidth(), 1);
  }
  return null;
}
// 一行里最后一个非空白格的末端列（用于"已经打了一些字"时贴到字后面）。
function ccImeLineEndColumn(line, start, cols) {
  for (let col = cols - 1; col >= start; col--) {
    const c = line.getCell(col);
    if (ccImeIsBlankCell(c)) continue;
    return col + Math.max(c.getWidth(), 1);
  }
  return null;
}
// 自下而上找输入框（转录在上、输入框在它下面，所以最低的那个才是）。
// 找不到就返回 null —— 此时**不干预**，维持 xterm 自己的行为，不比现在差。
function ccImeAnchor(buf, term) {
  for (let row = term.rows - 1; row >= 0; row--) {
    const line = buf.getLine(buf.baseY + row);
    if (!line) continue;
    const start = ccImeInputStartColumn(line, term.cols);
    if (start === null) continue;
    const rest = line.translateToString(true, start, term.cols);
    if (!rest.trim()) return { row, column: Math.min(start, term.cols - 1) };
    const end = ccImeLineEndColumn(line, start, term.cols);
    return { row, column: Math.min(end ?? start, term.cols - 1) };
  }
  return null;
}

// 每个标签**各装一份**。原来这是个 IIFE、在模块顶层跑一次 —— 那是在"只有一个
// 终端"的前提下才成立的：那时 `term` 一定已经存在。现在模块顶层跑的时候一个
// 标签都还没有，IIFE 会直接撞上 `if (!el …) return` 静默不装（而且不报错）。
// 所以它变成 createTab 里的一个调用：终端刚 open 完，元素齐全。
function installImeAnchor(t) {
  const term = t.term;                       // ← 遮蔽模块级那个视图：装的是**这个**标签
  const el = term.element;
  const screen = el && el.querySelector(".xterm-screen");
  const ta = term.textarea;
  if (!el || !screen || !ta) return;   // 终端还没 open 完：不装，也比装错强
  const compView = el.querySelector(".composition-view");

  let metrics = null;
  let deferred = null;

  const measure = () => {
    const r = screen.getBoundingClientRect();
    const cw = r.width / term.cols, ch = r.height / term.rows;
    if (!(cw > 0) || !(ch > 0)) return null;
    return { cw, ch, cols: term.cols, rows: term.rows };
  };
  // 只在值真的变了才写：xterm 每次事件都会重写这些内联样式，
  // 无脑写会平白让布局失效一次（Orca 的 writeStyle 同理）。
  const put = (node, prop, val) => { if (node && node.style[prop] !== val) node.style[prop] = val; };

  const apply = (anchor, m) => {
    const top = `${anchor.row * m.ch}px`;
    const rawLeft = anchor.column * m.cw;
    // 和设备宽度收口一致：xterm 在预编辑过长时会把框拉回屏内，
    // 我们按同样的规则夹一下，免得下一次它又拉回去、两边打架。
    const w = Number.parseFloat(ta.style.width);
    const left = Number.isFinite(w)
      ? Math.max(0, Math.min(rawLeft, m.cols * m.cw - w))
      : rawLeft;
    put(ta, "top", top);
    put(ta, "left", `${left}px`);
    // 预编辑的可见overlay也得跟着走，否则只有候选框对、画面上的拼音还在原处
    if (compView) {
      put(compView, "top", top);
      put(compView, "left", `${rawLeft}px`);
      put(compView, "height", `${m.ch}px`);
      put(compView, "lineHeight", `${m.ch}px`);
    }
  };

  const handler = () => {
    if (!ta.isConnected) return;
    if (!metrics || metrics.cols !== term.cols || metrics.rows !== term.rows) metrics = measure();
    if (!metrics) return;
    const anchor = ccImeAnchor(term.buffer.active, term);
    if (!anchor) return;    // 没认出来就完全不干预，保持 xterm 原有行为
    apply(anchor, metrics);
    // xterm 在每个 compositionupdate 之后还会用 setTimeout(0) 自己摆一次 textarea，
    // 所以补一次更晚的重写；一次组字里只保留一个待执行（Orca 的 deferredApply 同理）。
    if (deferred !== null) window.clearTimeout(deferred);
    deferred = window.setTimeout(() => {
      deferred = null;
      if (!ta.isConnected) return;
      if (!metrics) metrics = measure();
      if (!metrics) return;
      const a = ccImeAnchor(term.buffer.active, term);
      if (a) apply(a, metrics);
    }, 0);
  };

  el.addEventListener("compositionstart", handler);
  el.addEventListener("compositionupdate", handler);
}

//
// 3) 隔离复现（replayTest）—— 这个才是分水岭，值得记住方法

// 探针本身删掉了；保留这个**方法**：题面看不清时，用同一份输入喂一个干净实例，

// 4) IME 候选框探针（imeProbe，2026-10-15 修"候选框不跟光标"时用的）

//    「按 buffer 光标算它本该在哪」、`.xterm-helpers` 的 computed left、
//    光标行文本、提示符所在行列。三条结论（都写进 ccIme* 的注释了）：
//      a. `.xterm-helpers` 的 computed left **恒为 0px** —— Orca 那条
//         `.xterm-helpers{left:0}` 的 CSS 修法在我们这儿**不适用**（它的注释
//         针对的是 Electron/Blink 下 `left:auto` 会解析成非 0）。别照抄。
//      b. Claude Code **从不把终端光标放进输入框**：它把光标留在自己画的状态行
//         末尾（实测 (75,8)，那行是 "  ⏵⏵ auto mode on … ● high · /effort"），
//         而输入框在 (0,6)。这才是候选框偏 584px 的真因。
//      c. 输入框提示符 `❯` 后面那一格是 **U+00A0 不换行空格（code 160）**，
//         不是普通空格。只认 `getChars() === " "` 会**静默失效**。
//    另外：Win11 的候选框由 TextInputHost.exe 合成，**不是顶层窗口** ——
//    枚举窗口 diff 抓不到它，只能全屏截图看像素（`_tools\screen-grab.ps1`）。
//
// 5) 追"候选框跳到屏幕右上角"时的两个探针（2026-10-15）
//    a. imeScreenProbe：在 compositionstart/end 上回传 window.screenX/screenY、
//       `.xterm-screen` 与 textarea 的 rect、**textarea 的屏幕绝对坐标**、
//       ccImeAnchor 的结果、document.activeElement。
//    b. installFocusProbe：focusin/focusout（捕获相）上报 activeElement + relatedTarget。
//       加它的理由值得记：**如果 composition 压根没发生在我们元素上**，a 会一条都不打，
//       于是"没有日志"就同时可能是"没复现" —— 焦点探针把这个歧义消掉。
//    结论（三组 A/B，同一串合成输入）：
//      - 焦点在终端 textarea → 候选框贴输入行下方（候选框 y≈232 / 输入行 y≈202）✓
//      - 焦点在侧栏卡片 `<button class="card">` → 屏幕上**没有任何候选框**

//      "根本没有候选框"是两种不同状态，别把后者当后者去修。用户报的"右上角"
//      这一幕**没能复现**，也给不出站得住的机制 —— 别为它发明解释。
//    副产品（真 bug，已修）：点侧栏卡片会把焦点从终端拿走，之后敲中文一个键都进不来。
//      修法见下面 .card/.nav 那段 mousedown preventDefault。
//    工具留在 _tools：`screen-grab.ps1`（全屏 GDI 抓帧）、`ime-watch.ps1`（逐帧差分哨兵）。
//    哨兵值得记：候选框不是顶层窗口，枚举窗口 diff 抓不到它；差分哨兵 = 全屏抓帧 +
//    只统计"目标窗口矩形之外"的变化像素，命中就存整屏帧，**不用跟人约时间**。
//    这次它证明了一件事：用户那次敲字全程 0 命中 ⇒ 候选框一次都没出过应用窗口。
//    校准值（实测出来的，复用时直接用）：watchXmin=应用左边界（左边的窗口动画每帧

// ===========================================================================
// 自绘标题栏：窗口按钮 + 双击最大化
// ===========================================================================
// 两条 Windows 惯例，Wails 运行时**都没有**替我们做：
//   1) 双击标题栏 = 最大化/还原。运行时的 drag.ts 里只对 macOS 转发了
//      `wails:drag:doubleclick`（那里是系统偏好决定的"，双击=缩放还是最小化"），
//      Windows 分支没有 —— 得自己接。
//   2) 最大化之后，按钮字形要从"最大化"换成"向下还原"。运行时不会替我们跟踪。
// 剩下三件事（最小化 / 切换最大化 / 关闭）运行时都有现成方法，直接用。
// 字形是两段 SVG（#wc-ico-max / #wc-ico-restore）互斥显示，不再改字符 ——
// 因为字形已经不是一个文字码位了（原因见 .wc-glyph 的注释）。
//
// ⚠️ 用 class 切换，**不要用 `.hidden` 属性**。`hidden` 是 HTMLElement 上的
// IDL 属性，`<svg>` 是 SVGElement —— 赋值 `svgEl.hidden = true` 只是挂了个
// JS 扩展属性，**不会**反映到内容属性上，元素一点不变。（2026-10-15 实测：
// 点击最大化后窗口确实最大化了（日志里 PTY 从 96x49 变成 140x57），
// 但按钮字形纹丝不动，截图里还是一个方框。）内容属性形式的 `hidden` 在
// 初始 HTML 里是生效的，所以这个坑只在动态切换时才露头。
const icoMax = $("wc-ico-max"), icoRestore = $("wc-ico-restore");
function syncMaxButton() {
  Window.IsMaximised().then((m) => {
    icoMax.classList.toggle("off", m);
    icoRestore.classList.toggle("off", !m);
    const btn = $("wc-max");
    btn.title = m ? "向下还原" : "最大化";
    btn.setAttribute("aria-label", m ? "向下还原" : "最大化");
  });
}
$("wc-min").addEventListener("click", () => Window.Minimise());
$("wc-max").addEventListener("click", () => Window.ToggleMaximise().then(syncMaxButton));
$("wc-close").addEventListener("click", () => Window.Close());
// 走系统路径改变最大化状态的情况（Win+↑、拖到屏幕顶、任务栏右键）只有事件知道。
Events.On("windows:WindowMaximise", syncMaxButton);
Events.On("windows:WindowUnMaximise", syncMaxButton);
syncMaxButton();

// 双击标题栏切换最大化 —— 但只在**拖拽区**上生效。标签、按钮那些地方
// 已经显式 no-drag，双击它们不该动窗口。
$("titlebar").addEventListener("dblclick", (e) => {
  if (e.target.closest(".tab, .tab-add, .tabs-right, .window-controls, .icon-btn")) return;
  Window.ToggleMaximise().then(syncMaxButton);
});

// 它那两个纯函数（computeMaxRightSidebarPanelWidth / clampRightSidebarPanelWidth）

const RSB_MIN_W = 220;
const RSB_MIN_CENTER = 320;

   在 260 下折行折得厉害，而下段（对话流）**默认是折叠的**，不吃宽度红利 ——
   所以宽度预算往上段这边挪。仍是我们自己定的数（Orca 的 store 默认值在

   传进去的方式是 computeMaxRightSidebarPanelWidth(windowWidth, extraWidth)。

   写死的话折叠起来会多出一条空白，或者把头部切掉一截。 */
function histHeadH() {
  const b = $("rsb-hist").querySelector(".bhead");
  const h = b ? Math.round(b.getBoundingClientRect().height) : 0;
  return h > 0 ? h : 24;

/* 上段能留多少，**按盒子量**，不按"减掉头部高"那样的加减法推。

   扣错了项：列里真正不归下段的是模块条 + 边界那两条，而 histHeadH 是下段
   **内部**的头部（它本来就该算在下段里）。扣少了 ⇒ 上段实际只剩 158px，

   读它们不会自我反馈。） */

  const mods = $("rsb-mods").getBoundingClientRect();

  const h = rsbHistOpen ? clampHistH(rsbHistH || window.innerHeight * 0.35) : histHeadH();

  $("rsb-hist").classList.toggle("open", rsbHistOpen);

/* Ctrl+Shift+B 收/展右栏（对应 Orca 那条 sidebar.right.toggle 的动作）。

  // 它住在标签条右侧（.icon-btn，26×26），是 `.tabs-right` 的最后一个孩子 ——
  // 右栏开着时它就顶在中栏右沿上（那条几何见 .window-controls-titlebar-spacer）。
  $("p-collapse").innerHTML = lucide(collapsed ? LUCIDE_PANEL_LEFT_OPEN : LUCIDE_PANEL_LEFT_CLOSE, 15);
  $("p-collapse").title = collapsed ? "展开终端面板" : "收起终端面板";
}
renderCollapseBtn();

/* 收起/展开两态的读数**一次带全**：坐标、"divider 还在不在"、右栏那个宽度，
   都不靠目测。这个文件里"看着像对的"已经错过两次（C8 那个永久消失的 divider，
   和那颗标着 hidden 却画在屏上的 rsb-open）。 */
function collapseFacts() {
  const b = $("p-collapse").getBoundingClientRect();
  const g = $("group").getBoundingClientRect();
  const rsb = $("rsb"), op = $("rsb-open");
  return `收起键中心=${Math.round(b.left + b.width / 2)},${Math.round(b.top + b.height / 2)}` +
    ` 群组盒=${Math.round(g.width)}x${Math.round(g.height)}` +
    ` 标签列表=${getComputedStyle($("tablist")).display}` +
    ` 格数=${TAB_LIST.length} --rsb-w=${getComputedStyle(document.documentElement).getPropertyValue("--rsb-w").trim()}` +
    ` #rsb.class=[${rsb.className}] #rsb-open=${op.hidden ? "hidden" : "显形" + (collapsed ? "(灰)" : "")}` +
    ` #divider=${$("divider") ? "在" : "❌不在了"}`;
}

/* 收起 = 四件事一起切：终端面板藏、群组显、标签条让位、右栏收起。
   **不写内联 style，全走 #app 上那一个类** —— 内联那一版留下了"#divider 被顺手
   一起藏掉"和"divider 再也回不来"两个坑（见上面那段）。 */
function setTermCollapsed(on) {
  on = !!on;
  if (on === collapsed) return;
  collapsed = on;
  $("app").classList.toggle("term-collapsed", on);
  if (on) {
    rsbOpenBeforeCollapse = rsbOpen;
    setRsbOpen(false, "终端面板收起");
    askAllSnapshots("收起进群组");   // 非当前格的历史也要，见 askAllSnapshots
    renderGroup();
  } else {
    groupSeen.clear();
    askOpen.clear();    // "我亲手点开过这张卡"是这一屏里的临时态，不进下一轮看板
    setRsbOpen(rsbOpenBeforeCollapse, "终端面板展开");
    requestAnimationFrame(() => {
      if (!activeTab) return;
      // ⚠️ refit 这一句**是原来就有的**，保留：显示态 0 → N 的尺寸变化按理会被
      //    各格自己的 ResizeObserver 接住，但这条路上"按理"不够 —— 一次多余的
      //    量的代价，远小于"某一格尺寸不对"。
      activeTab.refit();
      // 展开后把焦点交回终端 —— 收起键住在标签条上（不在面板里），点完它面板才
      // 回来；不还给终端的话，用户展开完接着打字，字哪都不去。
      // 等价于 Orca 的 focusPanePreservingOverlays（pane-overlay-focus.ts）。
      activeTab.focus();
    });
  }
  renderCollapseBtn();
  rsbPaintOpen();
  sendCtrl({ type: "log", msg: `终端面板${on ? "收起" : "展开"} ${collapseFacts()}` });
}

/* 收起期间那颗「展开右栏」会被 setRsbOpen 显形，而这时候右栏是被**我们**强制
   关着的 —— 点它会当场打架。按本仓立过的规矩（**不可用的动作做灰、不做禁、
   不做隐**，见 MEMORY）：灰掉 + 说清原因 + 点击 no-op。
   留着它还有个好处：.tabs-right 的布局不动，收起键的位置不跳。 */
function rsbPaintOpen() {
  const b = $("rsb-open");
  if (!b) return;
  b.classList.toggle("mute", collapsed);
  b.title = collapsed ? "展开终端面板后可用" : "展开右栏 (Ctrl+Shift+B)";
}

$("p-collapse").addEventListener("click", () => setTermCollapsed(!collapsed));

/* ── 「群组」：一行一个 agent ────────────────────────────────────────────────
   两条不能破的规矩：
     ① **只挑，不写** —— 行里出现的每个字都来自流水（agent 自己说的原话、
        describeTool 写的那句、或者状态词）。"替它总结一句"会同时伪造内容、
        引入成本和隐私问题，而原话本来就在手上（C2 立过的规矩）。
     ② **只重画变了的那一段** —— 这块面每 400ms 就会收到新东西，整表重建会把
        选中态和滚动位置一起抹掉（展开的那段流就挂在这一行里）。
   ─────────────────────────────────────────────────────────────────────── */

// 一帧一次（和 scheduleLive 同一个套路）。启动路径上 renderAgentDot 就会碰到
// 这里，所以 collapsed / groupRaf 的声明必须在**启动之前**（见那一块）。
function scheduleGroup() {
  if (groupRaf || !collapsed) return;
  groupRaf = requestAnimationFrame(() => { groupRaf = 0; renderGroup(); });
}

/* attention-first 排序（照 Orca activity-thread-grouping.ts:19-32 那张表）：
   要你出手的排最前，闲着没事的排最后。写成**穷举**而不是"认不出就落最后" ——
   多一个态时缺一条会当场看见（undefined 排在最前，很扎眼），而"默认落最后"
   会让一个真需要你出手的态静默沉底。
   数值照抄 Orca（waiting 0 → blocked 1 → permission 2 → failed 3 →
   unconfirmed 4 → working 5 → … → interrupted 7 → done 9 → idle 10），
   我们是它那套的子集 + 一个它没有的态（off）。 */
const GROUP_RANK = {
  ask: 0,          // 在等你答（Orca 的 waiting/permission 是 0/2，我们合一）
  off: 1,          // 这一格的 stream 断了 —— 我们自己的态，Orca 没有
  failed: 2,       // 撞限额/鉴权失败（StopFailure）
  unread: 4,       // 说完了你还没看（Orca 的 unconfirmed）
  working: 5,      // 在干活
  interrupted: 7,  // 下面三态只有子代理那边会出，留着让这张表**是穷举的**
  done: 9,
  idle: 10,
};
const groupRankWarned = new Set();

/* 一行第 ② 行：**只出最新那一条**。
   优先级照 Orca（assistant 预览 → tool 预览 → 状态词），但我们一个字都不生成 ——
   只在已有的流水里**挑**，挑到哪条就显示它自己写的那句话。 */
function groupLatest(v) {
  const acts = (v && v.acts) || [];
  for (let i = acts.length - 1; i >= 0; i--) {
    const a = acts[i];
    if (a.kind === "thinking") continue;   // "思考…"没有信息量
    if (a.text) return a;
  }
  return null;
}

/* 可以出现在群组里的格：**有 id 的**。
   ⚠️ 建格期间 `T.id` 是 0（id 由 Go 的 tab.ok 发回来，前端不自己编号）——
   那一帧 TAB_LIST 里已经有一个 id=0 的成员。它没有可寻址的目标（点它 jumpToTab
   拿到 undefined，静默不跳），所以既不该占顶部条一枚 chip，也不该占一行。
   另外 spawnTab 超时那条兜底会**故意**把一个没有 PTY 的格留在 TAB_LIST 里
   （见 createTab），那种格更没有可点的地方。 */
function groupTabs() { return TAB_LIST.filter((t) => t.id > 0); }

function groupRows() {
  return groupTabs().map((t) => {
    const v = LIVE.get(t.id);
    const st = cellState(t);
    let rank = GROUP_RANK[st];
    if (rank === undefined) {
      // 多了一个态而忘了补表：**大声说一次**（按模块分键，不刷屏），然后当最低
      // 优先 —— 静默按 0 排到最前会让一整屏的顺序突然翻个个儿，更难查。
      if (!groupRankWarned.has(st)) {
        groupRankWarned.add(st);
        sendCtrl({ type: "log", msg: `⚠️ 群组排序表缺状态 ${st}（新增了态没补 GROUP_RANK？）` });
      }
      rank = 99;
    }
    return { t, v, st, rank, ask: pendingAsk(v), latest: groupLatest(v) };
  }).sort((a, b) => (a.rank - b.rank) || (a.t.id - b.t.id));
}

/* 顶部条：**每个 agent 一枚**（序号 + logo + 状态点）。
   顺序 = TAB_LIST（网格里的座位），**不按 attention 排** —— attention 是下面那份
   列表的活儿；条上这个位置表达的是"谁坐在哪"，跟着状态变来变去反而找不到人。
   点一枚 = 去那一格（和点气泡同一件事，走同一条路）。 */
function renderGroupHead(head) {
  const sig = groupTabs().map((t) => t.id).join(",") + "|" + (activeTab ? activeTab.id : 0);
  if (head.dataset.sig !== sig) {
    head.dataset.sig = sig;
    head.innerHTML = groupTabs().map((t) =>
      `<span class="gchip" data-gtab="${t.id}" title="${esc(currentTabTitle(t))}">` +
        `<span class="seq">${t.id}</span>` +
        `<span class="tab-ico">${claudeIcon(13)}</span>` +
        dotHTML(cellState(t)) +
      `</span>`).join("") +
      `<button id="group-add" title="新开一个并行 agent" aria-label="新开一个并行 agent">` +
        `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"` +
        ` stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>` +
      `</button>`;
  } else {
    // 座位没变，只有状态/当前格可能变了 —— 就地换那几个点，别整条重建
    //（重建会把这排的悬停和选中一起抹掉，而它每 400ms 就会收到新东西）。
    for (const el of head.querySelectorAll(".gchip")) {
      const t = liveTab(el.dataset.gtab | 0);
      if (t) paintDot(el.querySelector(".adot"), cellState(t));
    }
  }
  for (const el of head.querySelectorAll(".gchip")) {
    el.classList.toggle("on", liveTab(el.dataset.gtab | 0) === activeTab);
  }
}

/* 一行 = 三行卡（解剖照 Orca activity-thread-row.tsx:93-264）：
   ① 状态点 + 标题 ② 只出最新那一条 ③ 身份 + 时间。
   ⚠️ 三段**各判各的签名、各换各的**，不整行重建 —— 那张待办卡就挂在 g2 与 g3
      之间，整行重建会把它上面的选中态一起抹掉（它是能读、能选中复制的一份清单）。 */
function renderGroupList(list) {
  const rows = groupRows();

  if (!rows.length) {
    if (!list.querySelector(".gempty")) {
      list.innerHTML = `<div class="gempty hist-empty">这个工作区里还没有 agent。</div>`;
    }
    list.dataset.order = "";
    return;
  }
  const em = list.querySelector(".gempty");
  if (em) em.remove();

  // ① 行元素备齐（缺的建；关掉的格留下的行删掉）
  const keep = new Set();
  for (const r of rows) {
    keep.add(String(r.t.id));
    if (!list.querySelector(`.grow[data-gtab="${r.t.id}"]`)) {
      const el = document.createElement("div");
      el.className = "grow";
      el.dataset.gtab = r.t.id;
      el.innerHTML = `<div class="g1"></div><div class="g2"></div><div class="g3"></div>`;
      list.appendChild(el);
    }
  }
  for (const el of [...list.querySelectorAll(".grow")]) if (!keep.has(el.dataset.gtab)) el.remove();

  // ② 顺序（attention 会变）。**只在真的变了的时候搬** —— appendChild 是"搬"，
  //    每帧照搬一遍会让浏览器反复做布局。
  const order = rows.map((r) => r.t.id).join(",");
  if (list.dataset.order !== order) {
    list.dataset.order = order;
    for (const r of rows) list.appendChild(list.querySelector(`.grow[data-gtab="${r.t.id}"]`));
  }

  // ③ 内容
  for (const r of rows) {
    const el = list.querySelector(`.grow[data-gtab="${r.t.id}"]`);
    const t = r.t;
    const nm = realTabTitle(t);
    // 标题为空 → 退化成状态词，**不留空行**（Orca DashboardAgentRow.tsx:143-148 同判据）
    const stWord = DOT_LABEL[r.st] || r.st;
    const name = nm || stWord;

    const g1 = el.querySelector(".g1");
    const s1 = [r.st, name, t === activeTab ? "cur" : ""].join("\u0001");
    if (g1.dataset.sig !== s1) {
      g1.dataset.sig = s1;
      g1.innerHTML = dotHTML(r.st) + `<span class="nm" title="${esc(nm)}">${esc(name)}</span>`;
    }

    /* 第 ② 行：**只出最新那一条行动**。
       有待办的行**没有这一行** —— 那一行最该被看见的一句是"它要你答什么"，已经由
       下面那张卡的头一行说了（同一个事实在一行里说两遍，这个文件为它踩过一次：
       「空闲/空闲」）。末级回落是**状态词**：那一级只在"这一格什么都还没说"时才走到
       （"不留空行"，Orca DashboardAgentRow.tsx:143-148 同判据）。 */
    const line2 = r.ask ? ""
      : (r.latest && r.latest.text) || (r.v && r.v.note && r.v.note.text) || stWord;
    const g2 = el.querySelector(".g2");
    if (g2.dataset.sig !== line2) {
      g2.dataset.sig = line2;
      // 渲染**行内**标记，和右栏那条流同一套（同一份东西两处呈现不能一处渲染
      // 一处直出 —— 实测里它当场吐出了原文的 `**Blue**`）。用 mdInline 不用 md：
      // 这一行是单行省略的摘要，md() 会给围栏代码吐 <pre>，把这一行顶变形。
      // mdInline 收**已转义**的文本，所以 esc 在它外面（和 md() 里的顺序一致）。
      g2.innerHTML = line2 ? mdInline(esc(clamp(line2, 200))) : "";
    }

    const at = (r.ask && r.ask.at) || (r.latest && r.latest.at) || (r.v && r.v.at) || "";
    const g3 = el.querySelector(".g3");
    const s3 = [at, t === activeTab ? "cur" : ""].join("\u0001");
    if (g3.dataset.sig !== s3) {
      g3.dataset.sig = s3;
      g3.innerHTML = `<span class="tab-ico">${claudeIcon(12)}</span><span>格 ${t.id}</span>` +
        // 时间节点带 .tm + data-at：相对时间会随时间长歪，靠下面那个 60s 的定时
        // 刷新按 data-at 重算（和对话流里的时间节点是**同一个**机制，不是两套）。
        (at ? `<span>·</span>` +
          `<span class="tm" data-at="${esc(at)}" title="${esc(absTime(at))}">${esc(rel(at))}</span>`
          : "") +
        `<button class="go" data-go="${t.id}">进入 →</button>`;
    }

    /* ④ 待办卡 —— 这一行**唯一的动作区**（这一行其余的地方都是"进那一格"的落点）。
       它插在 g2 与 g3 之间，按签名增量换：每 400ms 整块重建一次会把这上面的选中态
       抹掉，而它是一份**用来读和选中复制的清单**（Orca 那条"回答后仍可选中原文"）。
       没有待办的行根本没有这张卡 —— 这也是"已答的提问从看板上退场"的实现：
       `pendingAsk` 一返回 null，卡就没了，留下的只有第 ② 行那句新动态。 */
    const slot = el.querySelector(":scope > .gask");
    if (!r.ask) {
      if (slot) slot.remove();
    } else {
      const sig = askBlockSig(r.ask);
      if (!slot || slot.dataset.sig !== sig) {
        const html = askHTML(r.ask, t, askOpen.has(r.ask.id));
        if (slot) slot.outerHTML = html; else g3.insertAdjacentHTML("beforebegin", html);
        const nu = el.querySelector(":scope > .gask");
        // ⚠️ 这一段里抛一个错，整个 renderGroupList 就断在这儿（这一页没有控制台，
        //    看到的现象是"群组不更新了"）—— 所以宁可少画一次也不赌它一定找得到。
        if (nu) nu.dataset.sig = sig;
      }
    }
  }
}

/* 待办卡的重画签名。原来是给"整条消息流"做增量对账的，现在只剩这一块要增量 ——
   ⚠️ 只按签名换、**不整块重建**：这张卡每 400ms 就会收到新东西，重建一次就把用户
   正在选的字和滚动位置一起抹掉，而它是一份**能读、能选中复制**的清单。 */
function askBlockSig(a) {
  const qs = a.qs || [];
  /* 多问/多选那几张屏上的进度（哪一问 / 哪几项勾着 / 到没到提交）**转录里没有**，
     只有屏上有 ⇒ 读到的读数必须进签名，否则屏变了这张卡不重画（勾选框不会动）。
     单问单选不加这一段：它答完转录就翻，屏读数对它没有任何用。 */
  const many = qs.length > 1 || !!(qs[0] && qs[0].multi);
  /* ⚠️ `answerPick`/`answerErr` 是**我们自己记的**（answerPick 只记被屏回执证过的、
     answerErr 是"你点了一下没走上"）—— 它们也长在这一块的画面上 ⇒ **必须进签名**。
     少了这一段就会踩到实测里那一幕：屏一变，700ms 那一轮先按"屏读"重画了一次
     （那会儿还没记下你答了什么），紧接着 watchScreenStep 记下答案又叫了一次重画 ——
     两次签名一模一样，增量重画在这里**直接跳过**，于是「（没读到）」一直挂在屏上
     （要等整张提问收尾、转录把 answers 落下来才被顶掉）。这是个"界面在说自己不知道
     一件它知道的事"，比没有这块显示更糟。 */
