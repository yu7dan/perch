  return "ask:" + (a.id || "") + ":" + (a.ok == null ? "pending" : "done") +
    ":" + JSON.stringify(a.answers || null) +
    ":" + JSON.stringify(answerPick.get(a.id) || null) +
    ":" + JSON.stringify(answerErr.get(a.id) || null) +
    (many ? ":scr:" + askScreenSig(askScreen.get(a.id)) : "");
}

/* ---------------------------------------------------------------------------
   待办卡**默认收着**（用户 2026-10-16 定的，我第一版默认摊开被否掉）。
   他给的理由是这一屏的存在理由本身："用户应该先确定哪个选择来自哪个 Agent" ——
   看板先要能一眼读完"谁在等你"，摊开的选项会把 agent 身份淹掉；真要答了，
   点一下「作答」就在**这一行里**摊开，不用换地方。

   中间删掉过一版"按量出来的高度决定收放"（短的摊开、长的收）：那是用户的原话，
   但实测之后他改成了一律收起 —— 所以那套阈值机器（ASK_WIN_H / measureAsk /
   量高度重排）跟着删了，别照"短的摊开"那条记忆把它加回来。
   ⚠️ 留下的只有**用户自己点开过**的那份记录：askOpen（按 ask id，不按格 ——
      一格前后会有好几张提问，按格记会让下一张凭空继承上一张的展开态）。
   --------------------------------------------------------------------------- */

// ===========================================================================
// 「点一下选项就答掉」（①）
//
// 转录里那条 AskUserQuestion 是**只读产出物** —— 没有回填答案的通路，所以"点一个
// 方案"只能换算成**往那一格的 PTY 写一个按键**（`t.stream.send`，不需要焦点、
// 不需要回车）。按键语义 2026-10-16 实测过（见记忆 claude-code-ask-picker-keys）：
//
//   · **数字键直选**：高亮在真实选项行上时按 k 立刻作答，与高亮在第几项无关
//     （实测 `3` → 答案是 Gamma，`busy → idle`）
//   · ⚠️ 高亮压在 `Type something.` 上时那一行是个**输入框** —— 送数字会被它当
//     打字吃掉（实测变成 `4. 2`），所以送键前必须读屏确认高亮不在合成行上；
//     挪开用 ↑（实测：从合成行往上一定落到真实选项行）
//   · 这个 CLI **不把 UI 画在屏幕底部** ⇒ 读屏要先找页脚、再往上取那一段
//   · **多问**：屏上一次只问一问（多一条步骤条 `← ☐ Color ☐ Size ✔ Submit →`），
//     页脚变成 `Tab/Arrow keys to navigate`，编号**每问内重新从 1 开始**；答完一问
//     **自动跳到下一问**，最后一问答完自动落到提交屏（那一屏**没有页脚**：
//     `Review your answers` + `❯ 1. Submit answers / 2. Cancel`）
//   · **多选**：选项带勾选框 `[ ]`/`[✔]`，数字键只**切勾选**（不前进、不提交），
//     列表里多一项没有编号的 `Submit`（夹在 Type 与 Chat 之间），走上去按回车才进提交屏
//   · **换问 = `←`/`→`**（页脚那句 `Tab/Arrow keys to navigate` 里的 Arrow keys）：
//     两向都**非破坏**（不碰任何答案，只把高亮带回第 1 项）；回到一个已答的问时，
//     屏上被选过的那一行后面带一个 `✔`（再答一次 = **覆盖**）。这是"进度条可点着跳问"
//     的依据（jumpToQuestion）—— ⚠️ 但高亮压在 `Type something.` 上时 `←`/`→` 是
//     **移动文本光标**，所以出发前先照上面那条把高亮挪回真实选项行
//
// 多问/多选带进来两件事，都必须处理：
//   ① **"现在问的是哪一问"只在屏上**（转录要等整张提问结束才落结果）⇒ 你点第 2 问的
//      一项时，屏上若正问第 1 问，那个数字会**答到第 1 问上去** —— 静默答错。
//   ② **提交屏上的 `1./2.` 是"提交/取消"**（实测按 `1` 就提交了）⇒ 那一屏上任何选项
//      都不许点；提交也不靠数字键（挪高亮 + 读屏确认 + 回车，见 pressSubmit）。
//
// 为什么这么小心：往活着的 agent 里写错键 = 静默做错事（选了用户没点的东西，把数字
// 打进输入框，或者把答案丢弃），比"不实现"坏得多。所以闸一条不省，任何一条不过就
// **什么都不送**，只在你点的那一行下面落一句实话。
// ===========================================================================

// askId → {k, text}：只留最近一条。既用来当场写进 DOM，也用来让"下一帧重画"
// 之后那句话还在（群组流是按签名重画的，那一行会整块重建）。
const answerErr = new Map();

// askId → 屏上读数（多问/多选才需要，见 syncAskScreens）。它进了 askBlockSig，
// 所以屏一变那一行就重画。
const askScreen = new Map();

/* askId → {第几问: 选中的 label}：**我们自己按过的**（单问单选那一类）。
   为什么要自己记：多问是"一问一屏"，按完一问屏就翻到下一问，那答案要等**整张提问**
   收尾才进转录 —— 中间这段时间"第 1 问选了 Gamma"在任何数据源里都查不到，而用户正要
   看着它往下答。只记**被屏回执证过**的那些（见 watchScreenStep），所以它不会凭猜测写。 */
const answerPick = new Map();

/* tabId → 正在跳向第几问（0 基）。**一次只许跳一个**：跳问是"发一个键、等屏确认、
   再发下一个"的一串动作，两串叠在一起就数不清屏上那一下是谁弄的（见 jumpToQuestion）。
   它只影响观感（进度条上那一格画成 jmp），不参与任何闸。 */
const jumpBusy = new Map();

/* 读那一格**屏上**的选择器现在长什么样 —— 这是"往它里面写键"唯一能依据的现场。
   页脚 `Enter to select` 是随选择器一起画的（比猜图形硬），拿它当锚；`N. 文本` 的 N
   与转录 options[] 的下标+1 一一对应（实测）。三种形状都要读得出来：
     · 单问单选（页脚 + 编号选项）
     · 多问（多一条步骤条；一问一屏，所以还要读出"现在问的是哪一问"）
     · 多选（选项带 `[ ]`/`[✔]`；列表里多一项没有编号的 `Submit`）
     · 提交屏（**没有页脚**，靠 `Review your answers`/`Submit answers` 认） */
function readPicker(t) {
  const b = t && t.term && t.term.buffer.active;
  if (!b) return null;
  const R = t.term.rows || 50;
  const lo0 = Math.max(0, b.viewportY), hi0 = Math.min(b.length - 1, lo0 + R - 1);
  const at = (i) => { const ln = b.getLine(i); return ln ? ln.translateToString(true).replace(/\s+$/, "") : ""; };

  let foot = -1, review = -1;
  for (let i = lo0; i <= hi0; i++) {
    const s = at(i);
    if (foot < 0 && s.indexOf("Enter to select") >= 0) foot = i;
    if (review < 0 && /Submit answers|Review your answers/.test(s)) review = i;
  }
  const submitScreen = review >= 0;
  if (!submitScreen && foot < 0) return null;         // 既不是选择器、也不是提交屏
  const to = submitScreen ? hi0 : foot;               // 提交屏一直取到屏底（那两行在下面）
  const from = Math.max(lo0, (submitScreen ? review : foot) - 20);

  const opts = {}, checks = {}, picked = {}, seen = {};
  let hi = 0, hiNum = 0, hiText = "", hiSubmit = false, hasSubmitRow = false;
  let steps = null, q = "", firstOpt = -1;
  for (let i = from; i <= to; i++) {
    const s = at(i);
    if (!s) continue;
    if (!steps) {                                     // 步骤条：≥2 格才算（一问一屏那种）
      // ⚠️ 标记（☐ 没问 / ☒ 答过 / ✔ 提交）要一起留下：群组那边**只画当前一问**，
      // "已经答了几问"全靠这条进度条说，光有 label 说不出来。
      const st = [], re = /([☐☒✔])\s*([^\s☐☒✔→←]+)/g;
      let m; while ((m = re.exec(s))) st.push({ m: m[1], label: m[2] });
      if (st.length >= 2 && /[←→]/.test(s)) steps = st;
    }
    if (/^(❯\s*)?\s*Submit\s*$/.test(s)) {             // 多选那个没有编号的 Submit 行
      hasSubmitRow = true;
      if (s.indexOf("❯") >= 0) { hiSubmit = true; hiNum = 0; hiText = "Submit"; }
      continue;
    }
    const m = s.match(/^\s*(❯\s*)?(\d+)\.\s+(\S.*)$/);
    if (!m) continue;
    const n = +m[2];
    if (firstOpt < 0) firstOpt = i;
    // 同一号只认**第一次**出现的那一行：选项的 description 画在它下一行，万一那句
    // 以 "2. " 开头，也不能把选项本身覆盖掉。
    if (!(n in seen)) {
      seen[n] = 1;
      let txt = m[3].trim();
      const cb = txt.match(/^\[( |✔)\]\s*(.*)$/);      // 多选：选项前面是勾选框
      if (cb) { checks[n] = cb[1] === "✔"; txt = cb[2].trim(); }
      // 已答的那一问回看时，被选中的那一行后面跟一个 `✔`（实测：从第 2 问按 ← 回到
      // 第 1 问，屏上是 `❯ 1. Alpha ✔`）—— 不剥掉它，label 比对就会差一个字符而全部
      // 对不上。剥下来的这个标记**有用**：它比我们自己记的那份更真（见 askHTML）。
      const pk = txt.match(/^(.*?)\s*✔\s*$/);
      if (pk) { txt = pk[1].trim(); picked[n] = true; }
      opts[n] = txt;
    }
    if (m[1]) { hi = n; hiNum = n; hiText = opts[n] || ""; hiSubmit = false; }
  }
  // 屏上**正在问的那一问**：编号选项上方最近的一行（跳过空行和步骤条）。
  // 多问时这就是"数字键此刻会答到哪一问去"的答案，见 answerFromGroup 的闸⑤。
  for (let i = firstOpt - 1; i >= Math.max(lo0, firstOpt - 6); i--) {
    const s = at(i);
    if (!s || (steps && steps.some((w) => s.indexOf(w.label) >= 0))) continue;
    q = s.trim(); break;
  }
  const nums = Object.keys(opts).map(Number);
  return {
    from, to, submitScreen, steps, q, hasSubmitRow, opts, checks, picked,
    hi, hiNum, hiText, hiSubmit,
    max: nums.length ? Math.max.apply(null, nums) : 0,
  };
}

// 屏上那一行文字与转录里那个 label 是不是同一项。两边都会截断（屏上是单行、
// 转录那边 Go 侧也截过），所以按"前 12 个非空白字符"比 —— 它挡的是"屏上和转录
// 是两个问题"这种彻底对不上的情况，不是逐字节校对。
const normLabel = (s) => String(s || "").replace(/\s+/g, "").slice(0, 12);
const labelSame = (a, b) => normLabel(a) === normLabel(b);

/* 多问/多选把"只有屏上才知道"的中间态带进来了（现在问的是哪一问 / 哪几项勾着 /
   是不是已经停在提交屏）。转录那条腿要等**整张提问**结束才落结果，中间态它一概没有
   ⇒ 只能读屏。⚠️ 只在"多问或多选"时读：单问单选那条老路不需要（答完转录就翻），
   所以这个表不给最常见的那条路加任何东西。 */
function screenModel(p) {
  if (!p) return null;
  // steps 压成 [["☐","Color"],…]：进度条上"答了几问"变了，那一行就得重画
  return { q: p.q, checks: p.checks || {}, picked: p.picked || {},
           submitRow: !!p.hasSubmitRow, review: !!p.submitScreen,
           steps: (p.steps || []).map((s) => [s.m, s.label]) };
}
const askScreenSig = (m) =>
  (m ? JSON.stringify([m.q, m.checks, m.picked, m.submitRow, m.review, m.steps]) : "");

/* 按 ~700ms 把那种提问的屏读一遍，变了就让那一行重画（这个签名进了 askBlockSig）。
   只在**群组开着**时跑 —— 群组没开时那一行根本不存在。 */
function syncAskScreens() {
  if (!collapsed) return;
  for (const t of TAB_LIST) {
    const v = LIVE.get(t.id);
    const a = v && (v.acts || []).find((x) => x.kind === "tool" && x.tool === "AskUserQuestion" && x.ok == null);
    const qs = (a && a.qs) || [];
    if (!(a && (qs.length > 1 || (qs[0] && qs[0].multi)))) continue;   // 只伺候多问/多选
    const m = screenModel(readPicker(t));
    if (askScreenSig(m) !== askScreenSig(askScreen.get(a.id))) {
      askScreen.set(a.id, m);
      // 这条日志是"多问/多选"这一层的自证读数：它同时说明了"屏读到的是哪一问、
      // 哪几项勾着、有没有到提交那一步"（转录里都没有这些）。
      sendCtrl({ type: "log", msg: `答题 屏读 tab=${t.id} 问=「${String((m && m.q) || "").slice(0, 20)}」` +
        ` 进度=${(m && m.steps || []).map((x) => x.join("")).join(" ") || "无"} 勾=${JSON.stringify((m && m.checks) || {})}` +
        ` 提交行=${!!(m && m.submitRow)} 提交屏=${!!(m && m.review)}` });
      scheduleGroup();
    }
  }
  // 那条提问不再挂着了 ⇒ 读数清掉（不清的话下次会带着旧勾选/旧进度画出来）
  if (askScreen.size || answerPick.size) {
    const live = new Set();
    for (const t of TAB_LIST) {
      const v = LIVE.get(t.id);
      for (const x of (v && v.acts) || []) if (x.tool === "AskUserQuestion" && x.ok == null) live.add(x.id);
    }
    for (const id of Array.from(askScreen.keys())) if (!live.has(id)) askScreen.delete(id);
    for (const id of Array.from(answerPick.keys())) if (!live.has(id)) answerPick.delete(id);
  }
}
setInterval(syncAskScreens, 700);

// 把"没按成 / 结果不明"写在你点的那一行下面（同一格上只留最近一条）。
// qi = 第几问（多问才用得上）；错了的那一句**必须落得下去**：贴到某个选项行上
// 对得上就贴那一行，对不上（比如"提交"那一步没过闸）就贴到页脚上方。
function answerNote(el, askId, k, text, qi) {
  if (askId) answerErr.set(askId, { k, qi: qi | 0, text });
  const box = el.closest ? el.closest(".gask") : null;
  if (box) for (const old of Array.from(box.querySelectorAll(".qerr"))) old.remove();
  const inOpt = !!(el.classList && el.classList.contains("gopt"));
  const host = inOpt ? el : (box && box.querySelector(".gf")) || el;
  host.insertAdjacentHTML(inOpt ? "beforeend" : "beforebegin", `<div class="qerr">${esc(text)}</div>`);
}

/* 高亮挪到真实选项行上（只在它压在合成行上时才需要动）。
   `done("")` = 可以按了；`done(why)` = 没动成、别按。 */
function stepHighlight(t, k, n, tries, done) {
  const p = readPicker(t);
  if (!p) return done("选择器不见了，没按");
  const txt = p.opts[p.hi] || "";
  // 只有"确认高亮落在 1..N 的真实选项行上"才算安全。合成行（N+1 `Type something.`
  // 是输入框、N+2 `Chat about this`）和"❯ 根本读不到"都算没确认。
  const safe = p.hi >= 1 && p.hi <= n && !/^(Type something\.|Chat about this)$/.test(txt);
  if (safe) return done("");
  if (tries >= 3) return done(`高亮挪不开（停在第 ${p.hi} 行「${txt.slice(0, 16)}」），没敢按`);
  t.stream.send(enc.encode("\x1b[A"));       // ↑
  // 这一步要留痕：它是"本该打进去的字没被打进去"的唯一证据（没这条日志时，
  // 一次成功的作答分不出"高亮本来就在真实选项行上"和"挪开了才成功"）。
  sendCtrl({ type: "log", msg: `答题 高亮挪开 tab=${t.id} 原在第${p.hi}行「${txt.slice(0, 16)}」` });
  setTimeout(() => stepHighlight(t, k, n, tries + 1, done), 160);
}

/* 按下去之后**等回声**：转录里那条 tool_use 拿到结果才算成。
   ⚠️ 等不到就**只说不重试** —— 重试可能重复作答（一次点击变成两票）。
   单问单选走这条（一击作答，转录当场翻）。多问/多选**不走这条**：转录要等整张
   提问收尾才落结果，中间那几步它在屏上，见 watchScreenStep。 */
function watchAnswerEcho(t, askId, el, k, qi) {
  const t0 = Date.now();
  const tick = () => {
    const v = LIVE.get(t.id);
    const it = v && (v.acts || []).find((x) => x.id === askId);
    if (it && it.ok != null) {
      sendCtrl({ type: "log", msg: `答题 回声 tab=${t.id} 按=${k} 有结果 用时=${Date.now() - t0}ms` });
      return;
    }
    if (Date.now() - t0 < 2500) return void setTimeout(tick, 250);
    answerNote(el, askId, k, `已经替你在这一格里按下 ${k}，但 2.5 秒里没等到结果 → 去这一格看看`, qi);
    sendCtrl({ type: "log", msg: `答题 回声 tab=${t.id} 按=${k} 没等到结果（未重试）` });
  };
  setTimeout(tick, 300);
}

/* 多问/多选按下去之后**等屏变**（转录那条腿在这几步上还没结果，见上面那段）：
   判据取"这次读到的屏 ≠ 按之前读到的屏" —— 问答完自动跳到下一问（问的那一行变）、
   多选切了勾（勾选态变）、进了提交屏（多了 review）三种都算数。屏一变就把读数写进
   askScreen 并立刻重画那一行（不等那 700ms 那一轮）。
   ⚠️ 同样**只说不重试**。屏没变还有一种可能是"这一步本来就没有屏变化"（比如数字落在
   已经勾上的那一项上），所以那句话写的是"屏上没变化"，不写成"没按成"。 */
function watchScreenStep(t, askId, el, k, before, qi, info) {
  const b0 = askScreenSig(before);
  const t0 = Date.now();
  const tick = () => {
    const v = LIVE.get(t.id);
    const it = v && (v.acts || []).find((x) => x.id === askId);
    if (it && it.ok != null) {          // 整张提问当场收尾了（最后一问/提交）也算成
      sendCtrl({ type: "log", msg: `答题 屏回执 tab=${t.id} 按=${k} 提问已收尾 用时=${Date.now() - t0}ms` });
      return;
    }
    const m = screenModel(readPicker(t));
    if (askScreenSig(m) !== b0) {
      askScreen.set(askId, m);
      /* 屏变 = 这一下确实落到了那一格上 ⇒ 把"这一问答的是什么"记下来（只记单问单选：
         多选的勾还能被点掉，它的现状要看屏上的勾选态，不记）。⛔ 没看到屏变就**不记** ——
         记了就是在替界面编一个它没看见的答案。 */
      if (info && !info.multi && info.label) {
        const pk = answerPick.get(askId) || {};
        pk[qi | 0] = info.label;
        answerPick.set(askId, pk);
      }
      scheduleGroup();
      sendCtrl({ type: "log", msg: `答题 屏回执 tab=${t.id} 按=${k} 变=问「${String((m && m.q) || "").slice(0, 16)}」` +
        ` 进度=${(m && m.steps || []).map((x) => x.join("")).join(" ") || "无"}` +
        ` 勾=${JSON.stringify((m && m.checks) || {})} 提交行=${!!(m && m.submitRow)} 提交屏=${!!(m && m.review)}` +
        ` 用时=${Date.now() - t0}ms` });
      return;
    }
    if (Date.now() - t0 < 2000) return void setTimeout(tick, 250);
    answerNote(el, askId, k, `已经替你在这一格里按下 ${k}，但那一格的屏上没变化 → 去这一格看看`, qi);
    sendCtrl({ type: "log", msg: `答题 屏回执 tab=${t.id} 按=${k} 屏上没变化（未重试）` });
  };
  setTimeout(tick, 250);
}

/* 「跳到这一问」—— 用户点了进度条上的一格。终端里换问的键实测是 `←`/`→`：
   两向都**非破坏**（不碰任何答案，只把高亮带回第 1 项），回看一个已答的问时屏上还会
   给那一行画个 `✔`（再答一次 = 覆盖）。所以这条路比"作答"安全得多 —— 最坏情况是
   高亮挪了一格，挪回来就行，不会静默做错事。

   规矩还是那两条（和作答同一套）：
     · **一步一步走，每一步都读屏**：每发一个键只准走到**相邻那一问**（导航是顺序的），
       预期结果就是"屏上那句问题变成转录里下一问的原文" —— 这一步是可验证的，比"发 N 个
       键然后祈祷"硬得多。走到别的问上、或者屏压根没变 = 立刻停手说实话。
     · **只说不重试**：停了就是停了，绝不接着补键（补一个键 = 多跳一问，跳到哪儿说不准）。

   出发前先把高亮从合成行上挪开：`Type something.` 那一行是输入框，`←`/`→` 在它上面是
   **移动文本光标**而不是换问（复用 stepHighlight 那套 —— 它只在压在合成行上时才动）。 */
function jumpToQuestion(t, el) {
  const qi = el.dataset.jstep | 0;
  const box = el.closest ? el.closest(".gask") : null;
  const askId = (box && box.dataset.ai) || "";
  const v = LIVE.get(t.id);
  const it = v && (v.acts || []).find((x) => x.id === askId);
  // 闸①：那条提问还挂着（和作答同一道门）—— 它一有结果，"现在问第几问"就不存在了
  if (!it || it.ok != null) return answerNote(el, askId, 0, "这条提问已经有结果了，没跳", 0);
  if (!t.stream || !t.ready) return answerNote(el, askId, 0, "那一格的终端没连着，没跳", 0);
  if (jumpBusy.has(t.id)) return;                     // 正在跳，忽略这一下
  const qs = it.qs || [];
  if (qs.length < 2 || !qs[qi]) return answerNote(el, askId, 0, "这一问已经不在转录里了，没跳", 0);
  const p = readPicker(t);
  if (!p) return answerNote(el, askId, 0, "那一格屏上没有选择器了，没跳", 0);
  // 闸②：提交屏上没有"问"可跳（那一屏只剩提交/取消两行）
  if (p.submitScreen) return answerNote(el, askId, 0, "那一格已经走到提交那一步了，没跳", 0);
  /* 闸③：屏上正问的是哪一问 —— 跳问要靠它算方向。认不出来就**不猜**：
     宁可一个字节都不送，也不按"我以为在第 1 问"这个假设去走。 */
  const cur = qs.findIndex((q) => labelSame(p.q, q.q));
  if (cur < 0)
    return answerNote(el, askId, 0,
      `认不出那一格现在问的是哪一问（屏上「${String(p.q || "").slice(0, 16)}」），没跳`, 0);
  if (cur === qi) return;                             // 就是这一问 —— 它本来也没有动作
  jumpBusy.set(t.id, qi);
  scheduleGroup();                                    // 先把那一格画成 jmp（观感）
  const n = (qs[cur].opts || []).length;
  // 这条日志是这一整块的现场读数：方向、几格、屏上原话、高亮在第几行。
  // `应用光标态`也带上 —— ←/→ 的字节序列在两种模式下不一样（见 walkToQuestion）
  sendCtrl({ type: "log", msg: `答题 跳问 tab=${t.id} 从第${cur + 1}问→第${qi + 1}问` +
    `（${qi > cur ? "→" : "←"}×${Math.abs(qi - cur)}）屏上「${String(p.q || "").slice(0, 16)}」` +
    ` 高亮第${p.hiNum || p.hi}行 应用光标态=${!!(t.term.modes && t.term.modes.applicationCursorKeysMode)}` });
  stepHighlight(t, 0, n, 0, (why) => {
    if (why) { jumpBusy.delete(t.id); scheduleGroup(); return answerNote(el, askId, 0, why, 0); }
    walkToQuestion(t, askId, el, qs, cur, qi, 0, Date.now());
  });
}

/* 一步一步走过去：发一个 `←`/`→`、等屏上那句问题变成**下一问的原文**，再走下一步。
   三种情况都停手：走到别的问上（导航不是顺序的 —— 我没量过那种情况，所以不猜）、
   屏在 1.5 秒里没变（键没进去 / 那一格不在听）、屏上读不到选择器了。 */
function walkToQuestion(t, askId, el, qs, cur, target, sent, t0) {
  const dir = target > cur ? 1 : -1;
  const next = cur + dir;
  const want = qs[next] || {};
  const p = readPicker(t);
  const stop = (text, log) => {
    jumpBusy.delete(t.id); scheduleGroup();
    if (log) sendCtrl({ type: "log", msg: log });
    answerNote(el, askId, 0, text, 0);
  };
  if (!p || p.submitScreen)
    return stop("那一格的屏读不到选择器了（可能已经到提交那一步），没往下走", "");
  if (labelSame(p.q, want.q))                        // 上一个键已经把它送到了（读得晚了一拍）
    return walkArrived(t, askId, el, qs, next, target, sent, t0);
  if (!labelSame(p.q, (qs[cur] || {}).q))
    return stop(`跳到这一问没走上（那一格现在问的是「${String(p.q || "").slice(0, 16)}」）→ 去这一格看看`,
      `答题 跳问 tab=${t.id} 停手：屏上是「${String(p.q || "").slice(0, 16)}」` +
      `，既不是出发那一问也不是下一问（走了 ${sent} 步）`);
  if (sent > qs.length + 1)                          // 理论上到不了（步数比问数还多）
    return stop("跳到这一问没走上（走了太多步）→ 去这一格看看", "");
  /* ⚠️ `\x1b[C`/`\x1b[D` 是**普通光标模式**下的 ←/→。这一格若是应用光标模式（DECCKM）
     就得换成 `\x1bOC`/`\x1bOD` —— 上一行日志里的"应用光标态"就是在说这件事。
     不在下面凭记忆写两个分支：本项目里送 ↑/↓ 用的也是普通序列（`\x1b[A`/`\x1b[B`），
     实测生效过，说明这一屏不是应用光标模式。 */
  t.stream.send(enc.encode(dir > 0 ? "\x1b[C" : "\x1b[D"));
  sendCtrl({ type: "log", msg: `答题 跳问 tab=${t.id} 第${sent + 1}步 ${dir > 0 ? "→" : "←"}` +
    ` 现第${cur + 1}问 预期变「${String(want.q || "").slice(0, 16)}」` });
  const t1 = Date.now();
  const tick = () => {
    const q = readPicker(t);
    if (q && !q.submitScreen && labelSame(q.q, want.q))
      return walkArrived(t, askId, el, qs, next, target, sent + 1, t0);
    if (Date.now() - t1 < 1500) return void setTimeout(tick, 120);
    /* 屏没变 ⇒ 停手，**不重试**：再送一个键就是跳两格。唯一实测过的"←/→ 不换问"的
       情况是高亮压在 `Type something.` 上（那时它是移动文本光标），那一步已经被
       stepHighlight 挡在出发之前了。 */
    stop("跳到这一问没走上（那一格的屏在 1.5 秒里没变）→ 去这一格看看",
      `答题 跳问 tab=${t.id} 停手：第${sent + 1}步按下去了，屏上没变化` +
      `（现「${String((q && q.q) || "").slice(0, 16)}」）用时=${Date.now() - t0}ms`);
  };
  setTimeout(tick, 150);
}

// 走完一步之后：到目标了就收工，没到就接着走（目标可能隔了好几问）
function walkArrived(t, askId, el, qs, at, target, sent, t0) {
  if (at !== target) return walkToQuestion(t, askId, el, qs, at, target, sent, t0);
  const m = screenModel(readPicker(t));
  if (m) askScreen.set(askId, m);      // 刚认过的屏立刻用上，不等那 700ms 那一轮
  jumpBusy.delete(t.id);
  scheduleGroup();
  sendCtrl({ type: "log", msg: `答题 跳问 tab=${t.id} 到了第${target + 1}问 走=${sent}步` +
    ` 屏上「${String((m && m.q) || "").slice(0, 16)}」` +
    ` 进度=${(m && m.steps || []).map((x) => x.join("")).join(" ") || "无"} 用时=${Date.now() - t0}ms` });
}

/* 点了一个选项。闸全过才写那一个字符（多问/多选各多一道，见闸⑤⑥）。 */
function answerFromGroup(t, el) {
  const k = el.dataset.aopt | 0;
  const qi = el.dataset.qidx | 0;              // 第几问（0 基）—— 单问恒为 0
  const box = el.closest(".gask");
  if (!k || !box) return;
  const askId = box.dataset.ai || "";
  const v = LIVE.get(t.id);
  const it = v && (v.acts || []).find((x) => x.id === askId);
  /* 闸①：那条提问**还挂着**（转录说它还没结果）—— 结构化判据，比屏幕硬。
     这一条同时把"换了会话"覆盖掉：tracer 换代（/clear、resume）时 acts 是
     `replace` 整份换掉的，这条 ask 会跟着消失，所以不需要另记一份 sessionId 来比。
     ⚠️ 它管不到"这张提问里的**哪一问**" —— 那件事转录里没有，只在屏上（见闸⑤）。 */
  if (!it || it.ok != null) return answerNote(el, askId, k, "这条提问已经有结果了，没按", qi);
  const qs = it.qs || [];
  const q = qs[qi];
  if (!q) return answerNote(el, askId, k, "这一问已经不在转录里了，没按", qi);
  const multi = !!q.multi, many = qs.length > 1 || multi;
  const want = (q.opts || [])[k - 1];
  if (!want || !want.label) return answerNote(el, askId, k, "这一项已经不在转录里了，没按", qi);
  // 闸②：那一格还活着、PTY 还连着（写进去没地方去，就是白写）
  if (!t.stream || !t.ready) return answerNote(el, askId, k, "那一格的终端没连着，没按", qi);
  /* 闸③：**屏上确实是这个问题**。转录与屏上是两个来源，只信一个就可能把键写到
     别的地方去（比如那一格已经走到下一个问题了）。判据取"不容易碰巧成立"的两样：
     屏上选项数（减掉合成的两项）与转录一致，且第 k 行文字与转录那个 label 对得上。 */
  const p = readPicker(t);
  if (!p) return answerNote(el, askId, k, "那一格屏上没有选择器了，没按", qi);
  /* 闸⑥：**提交屏上没有选项可点**。那一屏只剩两行（`1. Submit answers` / `2. Cancel`），
     数字在那儿是"提交/取消"，送一个选项编号过去 = 丢掉整张答案或者取消掉。 */
  if (many && p.submitScreen)
    return answerNote(el, askId, k, "那一格已经走到提交那一步了 —— 这一屏上的数字是「提交/取消」，点不动选项，按行里的「提交」", qi);
  /* 闸⑤（多问）：屏上现在问的必须是**这一问**。多问是一问一屏、编号每问从 1 重来 ——
     你点第 2 问的第 3 项时屏上若正问第 1 问，那个 `3` 会**答到第 1 问上去**，静默答错。
     单问（含"只有一问的多选"）没有这层歧义，不设这道闸。 */
  if (qs.length > 1) {
    const sm = askScreen.get(askId);
    if (!sm || !labelSame(sm.q, q.q))
      return answerNote(el, askId, k,
        sm ? `那一格现在问的是「${String(sm.q || "").slice(0, 16)}」，不是这一问，没按`
           : "还没读到那一格的屏，没按", qi);
  }
  const n = (q.opts || []).length;
  if (p.max !== n + 2)
    return answerNote(el, askId, k, `屏上选项数对不上（屏上 ${Math.max(0, p.max - 2)} 项 / 转录 ${n} 项），没按`, qi);
  if (!labelSame(p.opts[k], want.label))
    return answerNote(el, askId, k, `屏上第 ${k} 行与转录对不上（屏上「${(p.opts[k] || "").slice(0, 16)}」），没按`, qi);
  // 闸④：高亮别压在合成行上（见文件头那段：那一行是输入框，会把数字当打字吃掉）
  stepHighlight(t, k, n, 0, (why) => {
    if (why) return answerNote(el, askId, k, why, qi);
    // 多问/多选按下去之后屏会变，判据换成"屏变没变"（见 watchScreenStep），
    // 所以先把按之前那一屏读下来。
    const before = many ? screenModel(readPicker(t)) : null;
    t.stream.send(enc.encode(String(k)));
    sendCtrl({ type: "log", msg: `答题 按=${k} tab=${t.id}「${want.label.slice(0, 24)}」问=「${String(q.q || "").slice(0, 24)}」` +
      (multi ? "（多选：只切勾选，不前进）" : "") });
    if (many) watchScreenStep(t, askId, el, k, before, qi, { label: want.label, multi });
    else watchAnswerEcho(t, askId, el, k, qi);
  });
}

/* 多问/多选那一步「提交」—— 用户点了行里那颗键。三条：
     · 已经在提交屏上（多问答完自动停在那一屏 / 多选刚回车进来）⇒ 直接按
     · 多选、屏上还有那一项没编号的 `Submit` ⇒ 高亮走过去、回车进提交屏，再按
     · 多问、还没到提交屏 ⇒ **一个字节都不送**（那几问没答完，提交这一步还不存在） */
function submitFromGroup(t, el) {
  const box = el.closest(".gask");
  const askId = (box && box.dataset.ai) || "";
  const v = LIVE.get(t.id);
  const it = v && (v.acts || []).find((x) => x.id === askId);
  if (!it || it.ok != null) return answerNote(el, askId, 0, "这条提问已经有结果了，没按", 0);
  if (!t.stream || !t.ready) return answerNote(el, askId, 0, "那一格的终端没连着，没按", 0);
  const qs = it.qs || [];
  const multi = qs.some((x) => x && x.multi);
  const p = readPicker(t);
  if (!p) return answerNote(el, askId, 0, "那一格屏上没有选择器了，没按", 0);
  if (p.submitScreen) return pressSubmit(t, askId, el, p);
  if (!multi) return answerNote(el, askId, 0, "这一屏上还没有提交那一步（把这几问答完，它自己会停在提交那一步）", 0);
  gotoSubmitRow(t, askId, el, 0);
}

/* 多选：把高亮走到那一项**没有编号的 `Submit`** 上，再回车进提交屏（实测的走法
   `1→2→…→Type something→Submit→Chat about this`，所以一路 ↓ 会先撞上 Submit）。
   ⚠️ ↓ 到最下面会**夹住**，那时改按 ↑ 换条路找 —— ↑/↓ 只是移动，按错也不会作答。 */
function gotoSubmitRow(t, askId, el, tries) {
  const p = readPicker(t);
  if (!p) return answerNote(el, askId, 0, "那一格的屏读不到了，没按", 0);
  if (p.submitScreen) return pressSubmit(t, askId, el, p);
  if (p.hiSubmit) {
    t.stream.send(enc.encode("\r"));         // 回车 = 进提交屏
    sendCtrl({ type: "log", msg: `答题 提交 tab=${t.id} 高亮已在 Submit 行，送回車` });
    return waitSubmitScreen(t, askId, el, 0);
  }
  if (tries >= 8) return answerNote(el, askId, 0, `高亮走不到「Submit」那一行（停在第 ${p.hi} 行），没按`, 0);
  // 每一步都要留痕：这一路是往活着的 agent 里敲的键，事后必须能数出来敲了哪几下
  // （没有这条日志时，"高亮本来就在 Submit 上"和"走了四步才到"读起来一模一样）
  sendCtrl({ type: "log", msg: `答题 提交 tab=${t.id} 挪高亮 第${tries + 1}步 现第${p.hi}行` +
    `（${p.hi >= p.max ? "已在末行，↑" : "↓"}）` });
  t.stream.send(enc.encode(p.hi >= p.max ? "\x1b[A" : "\x1b[B"));
  setTimeout(() => gotoSubmitRow(t, askId, el, tries + 1), 180);
}

/* 回车之后等提交屏出现。那一屏是**屏上的事实**（`Review your answers`），读一眼就知道；
   读不到就停在这儿说实话，绝不往下猜着送键。 */
function waitSubmitScreen(t, askId, el, tries) {
  const p = readPicker(t);
  if (p && p.submitScreen) return pressSubmit(t, askId, el, p);
  if (tries >= 10) return answerNote(el, askId, 0, "回车之后那一格没走到提交屏 → 去这一格看看", 0);
  setTimeout(() => waitSubmitScreen(t, askId, el, tries + 1), 200);
}

/* 按提交。**每一步都先读屏**：认得出"第 1 行是提交"才送那一个 `1`（实测数字键在提交屏
   上是直接生效的）；认不出来就什么都不送 —— 那一屏只剩"提交/取消"两行，送错一个数字
   就是丢掉整张答案或者把手填的答案取消掉。 */
function pressSubmit(t, askId, el, p) {
  p = p || readPicker(t);
  if (!p || !p.submitScreen) return answerNote(el, askId, 0, "那一格已经不在提交屏上了，没按", 0);
  const sub = Object.keys(p.opts).map(Number).find((x) => /^Submit/.test(p.opts[x] || ""));
  if (sub !== 1)
    return answerNote(el, askId, 0, `提交屏上没认出一行是「提交」（第 1 行是「${(p.opts[1] || "").slice(0, 16)}」），没按`, 0);
  t.stream.send(enc.encode("1"));
  sendCtrl({ type: "log", msg: `答题 提交 tab=${t.id} 提交屏第1行「${(p.opts[1] || "").slice(0, 20)}」送=1` });
  watchAnswerEcho(t, askId, el, 1, 0);      // 这一步的判据回到转录：整张提问当场收尾
}

/* 转录里落下来的答案长什么样：单选是那一项 label 原样，多选是 `"Red, Blue"`
   （逗号+空格连起来，实测格式）。已答之后要照它把标记画回去，所以在这里拆开。 */
function answerLabels(v, multi) {
  const s = String(v == null ? "" : v);
  const out = new Set();
  if (!s) return out;
  if (multi) { for (const p of s.split(/,\s*/)) if (p) out.add(p); }
  else out.add(s);
  return out;
}

/* 能点吗？—— 这是**渲染那一刻**就判得出来的部分（剩下那些闸要读屏，见上面）。
   多问/多选现在也做了，但"哪一问此刻是活的、到没到提交那一步"只在屏上，这一层答不了
   ⇒ 这里只管"这一块能不能有活的东西"，逐行的死活交给 askHTML 的 `cur`/`atReview`。 */
function askClickable(a, t) {
  const qs = a.qs || [];
  if (a.ok != null) return { on: false, why: "" };         // 已回答：什么都不必说
  if (!qs.length) return { on: false, why: "" };           // 没有结构化选项，只有原文
  if (!t || !t.stream || !t.ready) return { on: false, why: "那一格的终端没连着" };
  return { on: true, why: "" };
}

/* 「它在等你答」——两态同一行（照 Orca 的 AwaitingInputRow）：等待态和已答态长在
   同一个位置，答完之后那句话还在，还能选中复制（不是答完就消失）。

   **多问/多选也是一次只画一屏**（照终端：它也一次只问一屏，屏上那条
   `← ☐ Color ☒ Size ✔ Submit →` 就是进度）。几问几选一次性全摊开是不行的 ——
   问题一多、选项一多、preview 一多，这一行会长到没法读（用户 2026-10-16 指出的），
   而终端那边本来就是一问一屏。所以这里：**进度条 + 只画屏上正问的那一问**。
   已答之后（`done`）：一问一行「问 → 答」（要看的是结果不是选项），原文与选项收进
   一个 <details> —— 仍在、仍能选中复制，只是不再占高度。

   多选在选项前画勾选框（**勾选态按屏同步**，见 syncAskScreens）；行尾那颗「提交」
   的"能不能按"由**屏上的进度**定，不由转录定。

   `open` = 用户亲手点开过这一张（见 askOpen）。**默认收着**（`.hd`，只出表头那一行
   `在等你答 · 问题原文` + 一颗「作答」），他点开过的那张才摊开（`.usr`，正身可见）。 */
function askHTML(a, t, open) {
  const qs = a.qs || [];
  const done = a.ok != null;
  const ans = a.answers || {};
  const clk = askClickable(a, t);
  const many = qs.length > 1 || !!(qs[0] && qs[0].multi);
  const multi = qs.some((q) => q && q.multi);
  // 屏上读数（正问哪一问 / 哪几项勾着 / 进度条 / 到没到提交）—— 转录里这些一概没有
  const sm = many ? (askScreen.get(a.id) || null) : null;
  const atReview = !!(sm && sm.review);
  const picks = answerPick.get(a.id) || {};   // 我替它按过的（单问单选），只用来显示
  const err = answerErr.get(a.id) || null;
  let shown = false;              // 那句话落进某个选项行了没（没落就落到块尾，见下）
  const valOf = (q, qi) => (done ? ans[q.q] : picks[qi]);

  /* 一问的正文：问题 + 选项。mode 三种 ——
       "cur"   此刻点得动（带 data-aopt，真正的闸在 answerFromGroup）
       "off"   点不动：做灰 + title 说为什么（⛔ 不做禁：禁了 title 不弹）
       "plain" 只读的原文（已答之后展开看用：**不着灰**，那是记录不是清单） */
  const qBlock = (q, qi, mode, why) => {
    const picked = done ? answerLabels(ans[q.q], !!q.multi) : null;
    /* 屏上正问的**是这一问**时，用屏上那个 `✔` 当准（终端里回看已答的一问就画它）——
       它比我们自己记的那份更真：用户在终端里回去改过答案，我们的记录就旧了。 */
    const smN = (sm && sm.q && labelSame(sm.q, q.q))
      ? Object.keys(sm.picked || {}).map(Number).find((n) => sm.picked[n]) : undefined;
    let h = `<div class="qt${mode === "off" ? " off" : ""}">${md(q.q || "")}</div>`;
    (q.opts || []).forEach((o, i) => {
      // 你选的那一项：加一个实心标记（不用色块 —— 一个色只讲一件事）
      const mark = done ? picked.has(o.label || "")
        : (q.multi ? !!(sm && sm.checks[i + 1])
          : (smN ? smN === i + 1 : !!(valOf(q, qi) && valOf(q, qi) === o.label)));
      const cls = "gopt" + (q.multi ? " multi" : "") + (mark ? " picked" : "") +
        (mode === "cur" ? " act" : (mode === "off" ? " off" : ""));
      // 点得动的那一行才带 data-aopt（"按第几个键"）+ data-qidx（"第几问"）；
      // 灰的那一行把为什么写在 title 上（本仓库的规矩：不可用的动作做灰、不做禁 ——
      // 禁了 title 不弹）。
      const attrs = mode === "cur"
        ? ` data-aopt="${i + 1}" data-qidx="${qi}" title="替你按 ${i + 1}（在这一格里等同选这一项${q.multi ? "，多选：点上/点掉" : ""}）"`
        : (mode === "off" && why ? ` title="${esc(why)}"` : "");
      const hit = !!err && err.k === i + 1 && (err.qi | 0) === qi;
      if (hit) shown = true;
      h += `<div class="${cls}"${attrs}>` +
        // 勾选框画在 label **里面**（.lb 是块级，放外面会另起一行）
        `<div class="lb">${q.multi ? `<span class="gcb">${mark ? "✔" : ""}</span>` : ""}${esc(o.label || "")}</div>` +
        (o.desc ? `<div class="ds">${esc(o.desc)}</div>` : "") +
        // preview 是**多行**的预排块（✓/✗ 对齐列表），所以用 <pre> 原样吐 ——
        // 它在 Go 那边是 cutRunes 截的（保留换行），这里再用 pre 保住版面。
        (o.prev ? `<pre>${esc(o.prev)}</pre>` : "") +
        (hit ? `<div class="qerr">${esc(err.text)}</div>` : "") +
      `</div>`;
    });
    return h;
  };

  /* 终端里那一问的清单其实有 **N+2 项**：转录给的 N 个真选项之外，还有两项**合成的** ——
     `N+1. Type something.`（自己写，那一行在终端里是个输入框）和 `N+2. Chat about this.`
     （接一句话给 agent）。它们**不在转录的 options[] 里**，但用户在终端里看得见 ——
     群里不画它们就是"界面替你删掉了两个可选项"（用户 2026-10-16 指出的）。
     ⚠️ 它们在这一格里**点不成**：送 `N+1` 这个编号的语义没实测过（高亮压在 Type 上时
     那一行会把字符当打字吃掉），所以不猜。做灰 + 点它 = 进那一格自己写
     （不可用的动作做灰、不做禁、不做隐）。 */
  const SYNTH = [["自己写一个答案", "Type something."], ["顺便说一句", "Chat about this."]];
  const synthHTML = (qi) => SYNTH.map(([t, en], j) => {
    const n = ((qs[qi] || {}).opts || []).length + 1 + j;
    return `<div class="gopt syn" data-go="1" title="终端里这一问还有第 ${n} 项：${en}` +
      ` —— 它只能在那格上敲（自己写答案 / 接一句话），点这里进那一格">` +
      `<div class="lb">${esc(t)}<span class="en">${esc(en)}</span>` +
      `<span class="hint">→ 去这一格写</span></div></div>`;
  }).join("");

  // 屏上正问的是第几问（读不到屏，或屏上那句对不上，就退成"第一个还没答的"，再退成第一问）
  const curIdx = () => {
    if (sm && sm.q) {
      const i = qs.findIndex((q) => labelSame(sm.q, q.q));
      if (i >= 0) return i;
    }
    const j = qs.findIndex((q, qi) => !valOf(q, qi));
    return j >= 0 ? j : 0;
  };
  const curQ = curIdx(), cur = qs[curQ] || null;
  const curWhy = clk.why ||
    (atReview ? "那一格已经走到提交那一步了（这一屏上的数字是「提交/取消」）" : "");
  const canClick = !done && clk.on && !atReview;
  /* "有结果"和"答上了"是两件事（实测）：在提交屏上选「2. Cancel」= 拒答并**打断整个
     回合**，转录里落的是 `toolUseResult:"User rejected tool use"` + 一条
     `[Request interrupted by user for tool use]`，**一个答案都没有**。那时写"已回答"
     就是界面在撒谎（同"答了 No 不算完成"那条产品规则）。 */
  const declined = done && !Object.keys(ans).length;
  const dNote = declined
    ? `<div class="gnote">它没被答掉 —— 那一轮被打断了（或者是在那一格里拒绝作答）</div>` : "";
  // 一问一行的「问 → 答」
  /* 「（没答）」和「（没读到）」是两件事：进度条上那一格的标记说了这一问答过没有
     （☐ 没答 / ☒ 答过）—— **分得出来就不能混着说**。实测里在提交屏上就见过这个形状：
     只答了第 3 问，屏上明写 `☐Color ☐Size ☒Speed`，前两问却在写"没读到"。
     进度条读不到时才退回「（没读到）」—— 那才是"我不知道"。 */
  const notAsked = (qi) => {
    const st = sm && sm.steps && sm.steps[qi];
    return !!st && st[0] === "☐";
  };
  const qaRows = () => qs.map((q, qi) => {
    const v = valOf(q, qi);
    /* 已答（done）时那一格的答案**来自转录**：`answers` 是按问题原文做键的，而 Go 侧
       对 question 不截断（transcript.go:829 只 TrimSpace）⇒ 转录里没有这一问的键 =
       它**没被答**，不是"我们没读到"。两句话混用就是在替界面认一个它并不缺的知识
       （实测就是：只答了第 3 问，前两问明明没答，却在写"没读到"）。 */
    const miss = (done || notAsked(qi)) ? "（没答）" : "（没读到）";
    return `<div class="qa"><span class="qi">${esc(q.q || "")}</span>` +
      `<span class="qv">${v ? md(v) : miss}</span></div>`;
  }).join("");

  let body = "";
  if (done && many) {
    // 多问答完：一问一行「问 → 答」（要看的是结果），原文与选项收进 <details>
    body = dNote + qaRows() +
      `<details class="grec"><summary>看原文与选项（${qs.length} 问）</summary>` +
      qs.map((q, qi) => qBlock(q, qi, "plain", "")).join("") + `</details>`;
  } else if (done) {
    // 一问答完：块本来就小，就照旧（问题 + 选项，选中的那项带 ✓）—— 收起来反而要把
    // "当时还有哪些别的选项"藏掉
    body = (cur ? qBlock(cur, 0, "plain", "") : "") + dNote;
  } else if (many) {
    /* 进度条：照屏上那条 `← ☐ Color ☒ Size ✔ Submit →`。每一格还能**点着跳问** ——
       终端里换问的键实测是 `←`/`→`（两向都非破坏），见 jumpToQuestion。 */
    const steps = (sm && sm.steps) || null;
    // 正在跳向哪一问（跳的过程中那一格画成 jmp）—— 只影响观感，闸在 jumpToQuestion 里
    const jmpTo = jumpBusy.get(t.id);
    if (steps && steps.length) {
      // Submit 那一格是**动作**，行尾那颗「提交」已经在说它了，不在这儿重复一遍
      const items = steps.filter(([, label]) => !/^(Submit|提交)$/.test(label));
      /* ⚠️ 进度条上写的是**表头**（`Color`），不是问题原文（`Pick one color`）——
         拿它跟屏上那句问题对不上。顺序是一一对应的（几个问题就几格，Submit 在最后
         已被滤掉），所以"现在问到第几问"直接用下标，不按文字比。 */
      body += `<div class="gsteps">` + items.map(([m, label], i) => {
        const isCur = i === curQ;
        const v = picks[i];
        /* 当前那一问没有动作可做（它就是屏上那一屏）⇒ 不给 data-jstep；
           其余每一格挂 data-jstep="第几问"（0 基），点它 = 在终端里按 ←/→ 走过去。 */
        const jump = canClick && !isCur;
        return `<span class="gstep${isCur ? " cur" : ""}${m !== "☐" ? " ok" : ""}` +
          `${jump ? " go" : ""}${jmpTo === i ? " jmp" : ""}"` +
          (jump ? ` data-jstep="${i}"` : "") + ` title="` +
          esc(isCur ? "正在问这一问"
            : (jump ? `跳到这一问（在那一格里按 ←/→ 走过去${v ? `；它已经答过：${v}，走过去可以让它重答` : ""}）`
                    : v ? `已经答过：${v}` : m !== "☐" ? "已经答过" : "还没问到这里")) +
          `">${esc(m)} ${esc(label)}</span>`;
      }).join("") + `</div>`;
    } else {
      body += `<div class="gnote">还没读到那一格的屏（它一问一屏，这里跟着那一格刷新）</div>`;
    }
    body += atReview
      ? `<div class="qt">已经在提交那一步了</div>` + qaRows()
      // 提交屏上没有那两项合成项（那儿只有"提交/取消"两行），别在那儿画
      : (cur ? qBlock(cur, curQ, canClick ? "cur" : "off", curWhy) + synthHTML(curQ) : "");
  } else {
    body = cur ? qBlock(cur, 0, canClick ? "cur" : "off", curWhy) + synthHTML(0)
               : `<div class="qt">${esc(a.text || "它有一件事要问你")}</div>`;
  }
  if (!body) body = `<div class="qt">${esc(a.text || "它有一件事要问你")}</div>`;
  // 行尾那颗「提交」：多问/多选才有这一步。能不能按由**屏上的进度**定 ——
  // 到提交屏了（多问答完自己停在那儿 / 多选刚回车进来）就能按；不能按就做灰 + title。
  let subBtn = "";
  if (!done && many) {
    const usable = !!sm && (atReview || (multi && sm.submitRow));
    const why = usable ? "" :
      !sm ? "还没读到那一格的屏（多问/多选要跟着屏上的进度走）"
        : multi ? "那一屏上还没有「Submit」那一行"
        : "这几问还没答完（答完它自己会停在提交那一步）";
    subBtn = `<button class="go sub${usable ? "" : " mute"}"` +
      (usable ? ` data-submit-ask="${esc(a.id || "")}"` : (why ? ` title="${esc(why)}"` : "")) +
      `>提交</button>`;
  }
  /* 收起来的那一态（`.hd`）：表头必须**带着问题原文** —— 否则整张卡只剩
     "在等你答"一行，看不出它在问什么。取屏上正问的那一问（读不到就退成第一问）。 */
  const hodQ = (cur && cur.q) || (qs[0] && qs[0].q) || a.text || "";
  return `<div class="gask${done ? " done" : ""}${open ? " usr" : " hd"}" data-ai="${esc(a.id || "")}">` +
    `<div class="qh"><span>${done ? (declined ? "没被答掉" : "已回答") : "在等你答"}</span>` +
      (many ? `<span>· ${qs.length} 问${multi ? "，多选" : ""}</span>` : "") +
      // 摊开的时候问题在正身里（.qt），收起来的时候搬到这儿 —— 同一个事实只画一处
      `<span class="hdq">· ${esc(clamp(hodQ, 90))}</span>` +
      /* 「作答 ▾」/「收起 ▴」：**纯本地**的一颗键（不碰终端），所以不守"有选中文本
         时不动作"那条（那条是给"往活着的 agent 里写键"用的）。CSS 决定它什么时候
         露面：收着（.hd）或用户自己摊开的（.usr）才露。 */
      (!done ? `<button class="open" data-ask-open="${esc(a.id || "")}"` +
        ` title="这一块摊开来有点高，先收着 —— 点它摊开（不碰终端）">` +
        `<span class="t-exp">作答 ▾</span><span class="t-col">收起 ▴</span></button>` : "") +
    `</div>` +
    `<div class="qb">${body}</div>` +
    // 对不上任何选项行的那句话（比如"提交"那一步没过闸）落到**块尾** —— 不落的话
    // 它根本不会出现（页面重画后也读不回来）。
    (err && !shown ? `<div class="qerr">${esc(err.text)}</div>` : "") +
    `<div class="gf"><span>${esc(rel(a.at))}</span>` +
      // 这颗键**两态都在**（那件事"去那一格"始终有效），只是换一句话说它为什么
      // 值得去 —— 答完之后还写着"去回答"就是界面在撒谎。
      subBtn +
      `<button class="go" data-go-ask="${esc(a.id || "")}">` +
        (done ? "去这一格 →" : "去这一格回答 →") +
      `</button>` +
    `</div></div>`;
}

/* 「作答 ▾ / 收起 ▴」：就地摊开/收起那一张待办卡。
   ⚠️ 这一颗键**不碰终端**（它只是把已经画好的那一块亮出来），所以不守"有选中文本
      时不动作"那条 —— 那条是给"往活着的 agent 里写键"用的（见 answerFromGroup）。
   展开态**按 ask id 记**（`askOpen`），不按格：一格前后会有好几张提问，按格记会让
   下一张凭空继承上一张的展开态。 */
function toggleAskOpen(t, card) {
  if (!card) return;
  const id = card.dataset.ai || "";
  const wantOpen = card.classList.contains("hd");    // 现在是收着的 ⇒ 点它 = 摊开
  card.classList.toggle("hd", !wantOpen);
  card.classList.toggle("usr", wantOpen);
  if (wantOpen) askOpen.add(id); else askOpen.delete(id);
  uiFact("group", groupFacts());
  sendCtrl({ type: "log", msg: `群组 待办卡${wantOpen ? "摊开" : "收起"}（用户点的）` +
    ` 格=${t.id} ask=${id}` });
}

/* 「去那一格」= 收起展开 + 回网格（在看独立页时）+ 切到它 + 闪两下。
   ⚠️ 顺序不能反：先 setTermCollapsed(false) 再 jumpToTab —— 在 display:none 的
      盒子上 focus() 不生效（setActive 会把焦点交给终端）。 */
function goToTab(t, why) {
  if (!t) return;
  sendCtrl({ type: "log", msg: `群组 → 进格 ${t.id}（${why}）` });
  setTermCollapsed(false);
  jumpToTab(t, why);   // 它自己会处理 soloTab，并闪两下
}

function renderGroup() {
  if (!collapsed) return;
  const head = $("group-head"), list = $("group-list");
  if (!head || !list) return;
  renderGroupHead(head);
  renderGroupList(list);
  uiFact("group", groupFacts());
}

// 群组那一屏的读数（只在变了的时候进日志，见 uiFact）
function groupFacts() {
  const rows = groupRows();
  const first = rows[0];
  const asked = rows.filter((r) => r.ask).length;
  const hd = $("group-list") ? $("group-list").querySelectorAll(".gask.hd").length : 0;
  return `行=${rows.length}` +
    (first ? ` 排首=格${first.t.id}/${first.st}${first.ask ? "(挂着问题)" : ""}` : "") +
    // 待办卡是这一屏**唯一**会长高的东西 ⇒ 它几张、几张收着，是这块面最重要的读数
    ` 待办=${asked}收着=${hd} 口开=${askOpen.size}` +
    ` 格宽=${Math.round($("group").getBoundingClientRect().width)}`;
}

// 三处点击：顶部条一枚 = 去那一格；待办卡里那些动作 = 就地做；行本身 = 去那一格。
$("group").addEventListener("click", (e) => {
  const chip = e.target.closest(".gchip");
  if (chip) { goToTab(liveTab(chip.dataset.gtab | 0), "点顶部条"); return; }
  if (e.target.closest("#group-add")) { newParallelTab("群组那排 +"); return; }
  const row = e.target.closest(".grow");
  if (!row) return;
  const t = liveTab(row.dataset.gtab | 0);
  if (!t) return;
  // 「进入 →」和「去这一格回答 →」都是同一个动作
  if (e.target.closest("[data-go],[data-go-ask]")) { goToTab(t, "点动作"); return; }
  /* 「点选项作答」：点的是选项行本身 ⇒ 往那一格的 PTY 写一个键（见 answerFromGroup）。
     ⚠️ 和下面点气泡同一条规矩：**有选中文本时不动作** —— 这份清单是用来读和选字
        复制的（Orca 那条"回答之后仍能选中原文"），一点就替人作答等于把"读"变成"改"。 */
  const opt = e.target.closest(".gopt");
  if (opt) {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim()) return;
    answerFromGroup(t, opt);
    return;
  }
  /* 多问/多选那一步「提交」（见 submitFromGroup）。同一条规矩：**有选中文本时不动作**。 */
  const sub = e.target.closest("[data-submit-ask]");
  if (sub) {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim()) return;
    submitFromGroup(t, sub);
    return;
  }
  /* 进度条上的一格 = 跳到那一问（见 jumpToQuestion）。终端里换问的键实测是 ←/→，
     两向都非破坏；这一步和"作答"一样是**往活着的 agent 里写键**，所以也守
     "有选中文本时不动作"这条（进度条本身也是能选中复制的）。 */
  const st = e.target.closest("[data-jstep]");
  if (st) {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim()) return;
    jumpToQuestion(t, st);
    return;
  }
  /* 「作答 ▾ / 收起 ▴」= 就地摊开这张卡（见 toggleAskOpen）。
     ⚠️ 它**不碰终端**，所以上面那三条"有选中文本时不动作"对它不适用。 */
  if (e.target.closest("[data-ask-open]")) { toggleAskOpen(t, e.target.closest(".gask")); return; }
  /* 卡里的其余落点（表头、问题原文、选项说明、时间）= **什么都不做**。
     这张卡是"读 + 动手"的地方：点它一下不该跳到别的格（清单要能选字复制，一点就
     跳走等于"读不了"），而卡里真正的动作各自带 data-*，已经在上面接住了。 */
  if (e.target.closest(".gask")) return;
  /* 剩下的落点（行头那三行本身）= **进那一格**。这一屏是看板：点一行就是"看这一格"
     （用户的原话："点击气泡进入具体 agent 的终端面板"）—— 原来那句"就地展开一段流"
     已经没有了（见 #group-list 上面那段）。 */
  goToTab(t, "点这一行");
});

// ===========================================================================
// 壳层数据
// ===========================================================================
let STATE = null;
let selected = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 会话名 = 用户起的名字 ?? agent 自己写的标题（Orca 的 `customTitle ?? title`）。
// 用户起的名字来自后端（titles.json，键是 sessionId）—— 它是**会话的属性**，
// 不是这一屏标签/面板的属性，所以列表、历史流面板、标签三处都读同一个来源。
function sessionTitle(s) {
  return (STATE && STATE.titles && STATE.titles[s.id]) || s.title || s.id.slice(0, 8);
}

// 极简 markdown。只处理对话流里真正高频的四种：围栏代码、行内代码、粗体、斜体。
//
// 刻意不引第三方库：这是**会话回放**，不是文档编辑器。渲染错一处的代价
// （把 `a * b` 吃成斜体、把路径里的下划线吃成强调）比不渲染大得多，
// 所以规则收得极紧 —— 强调符号内侧不允许有空格，且不跨行。
function mdInline(s) {
  return s
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*(?=\S)([^*\n]*?\S)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(（])\*(?=\S)([^*\n]*?\S)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const text = esc(src);
  // 先按围栏切开，代码块整段跳过行内替换 ——
  // 否则代码里的 `*` 会被当成强调，`a**b` 会被吃成粗体。
  return text.split("```").map((seg, i) => (i % 2
    ? `<pre class="code"><code>${seg.replace(/^[^\n]*\n/, "")}</code></pre>`
    : mdInline(seg))).join("");
}

function rel(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return `${Math.floor(s / 60)}分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)}小时前`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}天前`;
  return new Date(t).toLocaleDateString("zh-CN");
}
/* hover 出来的**绝对**时间（相对时间是给它旁边那行的，绝对时间挂在 title 上 ——
   两者都要有：一个回答"多久以前"，一个回答"到底是几点"）。
   ISO 串本身也算绝对，但那是给机器读的；人扫一眼要的是 `10-16 11:45`。 */
function absTime(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return iso || "";
  const d = new Date(t);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
    `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
const base = (p) => String(p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || "";

// 卡片上只留目录名（最后一级）：240px 的列宽里，「workspace\ai工作台」这种
// 两级写法会把同一行的分支和权限 chip 挤出可视区。全路径在 title 里悬停看。
function shortPath(p) {
  const parts = String(p || "").split(/[\\/]/).filter(Boolean);
  return parts[parts.length - 1] || p;
}

function renderShell() {
  if (!STATE) return;
  const nMain = (STATE.sessions || []).filter((s) => !s.sidechain).length;
  $("n-ws").textContent = STATE.workspaces?.length ?? 0;
  $("n-ss").textContent = nMain;
  $("g-ws").textContent = STATE.workspaces?.length ?? 0;
  $("g-ss").textContent = nMain;
  $("s-store").textContent = STATE.stateDir || "";
  $("s-store").title = STATE.stateDir || "";
  // cwd 从后端来，不再在 HTML 里写死 —— 那个字符串原来在 Go（spikeCwd）
  // 和 HTML（#p-path 的初始文本）各有一份，而 HTML 那份从来没被更新过。
  $("s-cwd").textContent = STATE.cwd || "";
  $("s-cwd").title = STATE.cwd || "";

  const ws = STATE.workspaces || [];
  $("ws-list").innerHTML = ws.length ? ws.map((w) => `
    <div class="ws" title="${esc(w.path)}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.7"><path d="M3 7h6l2 2h10v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
      <span class="nm ell">${esc(w.name)}</span>
      <span class="ct">${w.sessions || 0} 会话</span>
    </div>`).join("")
    : `<div class="empty">未发现工作区目录。<br><code>${esc(workspaceRootHint)}</code></div>`;

  // ⚠️ 这里**不再**自动选中第一个会话。以前启动时下段必须有个主语，所以只好
  // 挑一张卡片点亮；现在下段默认跟着当前格实时走，挑一张卡片反而是错的 ——
  // 那会让左栏一开始就亮着一张卡，而下段讲的是那一格的**静态历史**，
  // 用户看到的"实时"从第一秒起就是假的。
  renderLists("");
  // 左栏第一张卡的命中区：要验证"点卡片 = 下段切到会话库"就得知道它落在哪。
  // 那个位置是**搜索框 + 分组标题 + 工作区列表**一路堆出来的，估没有意义
  // （分割条那次的教训：我在 y=567 拖，真实的边界在 552..562，落进了头部）。
  {
    const c = document.querySelector("#list .card");
    const r = c ? c.getBoundingClientRect() : null;
    bootFact(r
      ? `左栏首卡 ${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}x${Math.round(r.height)} 共${document.querySelectorAll("#list .card").length}张`
      : "左栏没有卡片（一个会话都没扫到）");
    // C2：动作按钮的**命中区**。这东西估没有意义 —— 我第一次凭截图目测 ⋯ 的位置
    // 就点在了卡片本体上（浏览器弹的是卡片的 title，不是按钮的"更多动作"，
    // 那就是"没点中"的实证）。量出来，别目测。
    const btn = (sel) => {
      const el = c && c.querySelector(sel);
      if (!el) return sel + "=无";
      const b = el.getBoundingClientRect();
      return `${sel} 中心=${Math.round(b.left + b.width / 2)},${Math.round(b.top + b.height / 2)} ${Math.round(b.width)}x${Math.round(b.height)}`;
    };
    bootFact(`首卡按钮 ${btn("[data-act=menu]")} · ${btn("[data-act=resume]")}`);
  }
  // C3 验收要驱动标签栏（新开一格 / 关掉一格），这两处的命中区同理 —— **量**出来的。
  // 关闭键 `.tab .x` 尤其不能目测：它平时是 `color:transparent`（看不见），
  // 但它**在布局里**、16x16 固定尺寸，所以位置是确定的、只是从截图上看不见。
  {
    const box = (el) => {
      if (!el) return "无";
      const b = el.getBoundingClientRect();
      return `${Math.round(b.left)},${Math.round(b.top)} ${Math.round(b.width)}x${Math.round(b.height)} 中心=${Math.round(b.left + b.width / 2)},${Math.round(b.top + b.height / 2)}`;
    };
    // 这里只报**标签条**上的两个落点（它不随网格重排动）。网格里每格的 × 坐标
    // 由 renderGrid 那条布局日志逐格报 —— ⚠️ 别在这写 `.cellhead .x`：
    // 它在 N=1 和 N=2 时位置完全不同，一个"启动时量的数"只会骗到后面的人。
    // （我第一次还探成了 `#tablist .tab` = 「并行」那张页标签，它根本没有 ×，
    //   报回来是 `关=无`。格子头上的 × 才是"结束这个 agent"，见 :2963 那段。）
    bootFact(`标签条 加号=${box($("tab-add"))} 并行页=${box($("tab-parallel"))}`);
    /* C7：工作区顶部那一组按钮的**实测几何**。这一组的位置就是这次改动的主题
       （用户原话"现在这个位置肯定不合适"），而"靠没靠右、离右栏边界多远"在截图里
       只能目测 —— 上一版那颗「原生对比」胶囊就是目测不出它偏了、也看不出它有多响。
       报的是每个子元素的 id（或 title）+ 盒子的左右边 + 有没有被 hidden 挡住。 */
    const tr = document.querySelector(".tabs-right");
    if (tr) {
      const b = tr.getBoundingClientRect();
      const kids = Array.from(tr.children).map((el) => {
        const r = el.getBoundingClientRect();
        return `${el.id || el.title || el.tagName}(${Math.round(r.width)} @${Math.round(r.left)}-${Math.round(r.right)}${el.hidden ? " hidden" : ""})`;
      }).join(" ");
      bootFact(`顶部按钮组 左=${Math.round(b.left)} 右=${Math.round(b.right)} 宽=${Math.round(b.width)} 子=${kids || "无"}`);
    }
  }
  renderFlow("启动");
  // 这里才是"页面真的要开始画了"那一刻：主动把当前格的完整流水要过来。
  // （setActive 那一次可能因为模块求值顺序被跳过，见 askActsSnapshot 的注释。）
  askActsSnapshot("壳层就绪");
}

// 主会话和子代理分两组渲染。搜索同时过滤两边。
function renderLists(key) {
  const all = STATE?.sessions || [];
  // 搜索也要命中用户起的名字 —— 否则"我明明给它起过名字"搜不到，很伤。
  const hit = !key ? all : all.filter((s) =>
    `${sessionTitle(s)} ${s.title} ${s.cwd} ${s.preview} ${s.slug} ${s.agentName}`.toLowerCase().includes(key));
  const main = hit.filter((s) => !s.sidechain);
  const side = hit.filter((s) => s.sidechain);

  $("ss-list").innerHTML = main.length ? main.map(cardHTML).join("")
    : `<div class="empty">${key ? "没有匹配的会话。" : "会话库是空的 —— 索引器读的是<br><code>" + esc((STATE.stateDir || "") + "\\projects") + "</code>"}</div>`;

  // 子代理（C6a 起住在右栏那个模块里）。计数从"左栏那一组的标题"搬到
  // 右栏模块头里的胶囊 —— 组标题没了，但"有几个"这件事不能跟着丢。
  $("rsb-side-cnt").textContent = side.length;
  /* 这一段是"会话库里的"（历史），上面还有一段"本格在跑的"（实时）——
     两段都叫子代理，所以各自得有一句话说明自己是从哪来的。
     C7：排序改成**进行中的排最前**（Orca 的活动流就是这么排的："running agents
     stay pinned at the top so you can spot the ones still working"，
     activity-thread-grouping.ts:19-32 那张 attention-first 的排名表）。
     Go 那边已经按"最后一条事件时间"倒序给过了，所以这里只做一次**稳定**的分组，
     组内顺序不动（Array.prototype.sort 在现代引擎里是稳定的）。 */
  const sideSt = new Map(side.map((x) => [x.id, subStateOf(x)]));
  side.sort((a, b) => (sideSt.get(a.id) === "run" ? 0 : 1) - (sideSt.get(b.id) === "run" ? 0 : 1));
  const sideRun = Array.from(sideSt.values()).filter((v) => v === "run").length;
  $("side-cap").textContent = `会话库里的子代理 · ${side.length}` +
    (sideRun ? `（${sideRun} 个在跑）` : "");
  $("side-list").innerHTML = side.map(cardHTML).join("");

  // 勾选态和点击：**两个列表一起**（主会话在左栏、子代理在右栏）。
  // 用全局 `.card` 而不是 `#scroll .card`：card 这个类只给会话卡片用，
  // 而卡片现在分居两处；写死容器名的话，加一处新列表就静默漏一处。
  document.querySelectorAll(".card").forEach((el) => {
    el.addEventListener("click", () => selectSession(el.dataset.id));
    // ⚠️ 卡片现在是个 `role="button"` 的 div，浏览器**不会**替它把 Enter/Space
    // 转成 click（那是真 <button> 才有的待遇）。少了这一段，键盘就用不了卡片 ——
    // 而侧栏那块本来就被 mousedown preventDefault 拿掉了鼠标焦点，
    // 键盘是残障用户和"用键盘切会话"的人唯一的路。
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();          // 空格默认会滚一屏
        selectSession(el.dataset.id);
      }
    });
    el.classList.toggle("sel", el.dataset.id === selected?.id);
  });
}

const workspaceRootHint = "D:\\AIAgents\\workspace";

// 卡片行尾那两颗图标。内联 SVG 而不是字符：▶ 和 ⋯ 的字宽/基线随字体变，
// 落在网格里会歪；项目里其它图标也都是这么来的。
// ⚠️ 声明放在 cardHTML **上面**：const 是 TDZ 的，万一哪天有人在模块求值期间
// 就叫到 cardHTML（这里踩过一次同类的坑，见 createTab 里 `ready` 那段），
// 它会抛 ReferenceError 而不是画一张少了图标的卡。
const ICON_PLAY = `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>`;
const ICON_DOTS = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>`;

function cardHTML(s) {
  const perm = s.permission === "auto" ? `<span class="chip">auto</span>`
    : s.permission ? `<span class="chip warn">${esc(s.permission)}</span>` : "";
  const branch = s.branch ? `<span class="chip br" title="git 分支">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M6 8.5v7M18 6a6 6 0 0 1-6 6"/><circle cx="18" cy="6" r="2.5"/></svg>
      <span class="x">${esc(s.branch)}</span></span>` : "";
  const repo = s.cwd ? `<span class="chip" title="${esc(s.cwd)}"><span class="x">${esc(shortPath(s.cwd))}</span></span>` : "";
  const atype = s.agentType ? `<span class="chip" title="agent 类型"><span class="x">${esc(s.agentType)}</span></span>` : "";
  const agents = s.agents ? `<span class="pill b" title="子代理会话">◈ ${s.agents}</span>` : "";
  const turns = s.turns ? `<span class="pill" title="轮次">${s.turns} 轮</span>` : "";
  const size = s.bytes ? `<span class="pill" title="会话文件大小">${(s.bytes / 1048576).toFixed(1)}M</span>` : "";
  // 子代理卡：图标换成绿色分支点、加一枚「子代理」标记，和主会话一眼可分
  const icon = s.sidechain
    ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.9" style="flex:none"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>`
    : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--claude)" stroke-width="1.9" style="flex:none"><path d="M5 6l5 6-5 6M13 18h6"/></svg>`;
  const sideTag = s.sidechain ? `<span class="pill g">子代理</span>` : "";
  /* C7：子代理卡的第二行从「类型 + 分支」换成「类型 + **来自哪条会话**」。
     分支对子代理没有信息量 —— 它是从主会话兜过来的（store.go:209-211）；
     而"这条子代理是谁派出来的"，正是用户说的"根本不知道有什么区别"里最缺的那条。
     （Orca 那边区分兄弟子代理靠的是 label + parentId + 重名时补一个序号，
      native-chat-types.ts:142-154。) */
  const parent = (s.sidechain && s.parent)
    ? (STATE?.sessions || []).find((v) => v.id === s.parent) : null;
  const fromChip = s.sidechain
    ? `<span class="chip" title="派它的那条会话：${esc((parent && sessionTitle(parent)) || s.parent || "?")}"><span class="x">来自 ${esc((parent && sessionTitle(parent)) || String(s.parent || "?").slice(0, 8))}</span></span>`
    : "";
  /* C7：状态签。st === "" 表示**判不出来**（判据见 subStateOf）—— 那时候什么都不画，
     而不是猜一个"已完成"：会话库里几十张老卡，猜错一次就是"我以为它跑完了"。
     why 单独抽成 cardSubWhy 是因为它还得被 refreshSubChips 用（状态会过期，见那儿）。 */
  const subst = s.sidechain ? subStateOf(s) : "";
  /* 行尾两颗（照 Orca 的"常驻预算"）：⋯ 永远在，「接上」在 hover/聚焦时浮出。
     ⚠️ 接不上时**做灰不做隐**（Orca 的 resumeDisabled 就是这个意思）：藏起来用户
     只会觉得"这个功能没有"，做灰 + title 才说得清"为什么这条接不上"。
     判据全是本地能确定的（见 resumeWhy）——"正被别的格子跑着"那条前端判不了，
     由 Go 拒绝 + toast 说明，这里不猜。 */
  const why = resumeWhy(s);
  const resumeBtn = `<button class="cardbtn${why ? " na" : ""}" data-act="resume"
    title="${esc(why || "接上这条会话（新开一格）")}">${ICON_PLAY}</button>`;
  return `<div class="card${s.sidechain ? " side" : ""}" role="button" tabindex="0"
    data-id="${esc(s.id)}" title="${esc(sessionTitle(s))}\n${esc(s.cwd || "")}">
    <span class="t">
      ${icon}
      <span class="nm ell">${esc(sessionTitle(s))}</span>
      <span class="cardacts">
        <span class="hgroup">${resumeBtn}</span>
        <button class="cardbtn" data-act="menu" title="更多动作">${ICON_DOTS}</button>
      </span>
    </span>
    <span class="r2">${s.sidechain ? atype + fromChip : repo + branch + perm}</span>
    ${s.preview ? `<span class="p ell2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(s.preview)}</span>` : ""}
    <span class="r3">${rel(s.updated)}<span class="t2" style="display:flex;gap:5px;align-items:center">${subChipHTML(subst, s.id, cardSubWhy(s, subst), s.id)}${sideTag}${turns}${agents}${size}</span></span>
  </div>`;
}

/* 这条会话"现在能不能接"的**本地**判据，返回 null = 能。
   只有两种，都是这张卡片自己身上就看得出来的事实：

   · sidechain（子代理会话）：它的 id 不是一条独立会话（文件在
     <主会话>\subagents\agent-<hex>.jsonl），`--resume` 拿它起不来。
     这也正是 Go 那边 sessionFileExists 会拒掉的那一类 —— 两侧判据一致，
     只是这里能提前做灰。
   · turns == 0：这条会话没存下往来。Orca 对同一件事有专门一态：
     "Conversation not saved" / "This session has no saved conversation and
     cannot be resumed."（AiVaultSessionUnsavedNotice.tsx:28-43）。

   ⚠️ 第三种"正被别的格子跑着"**故意不在这里判**：权威的「谁占着谁」表在 Go 的
   tabManager.bySession 里，前端手上没有会话 id。硬猜会得到第二个、偶尔和 Go
   矛盾的答案源 —— 那比没有更糟。 */
function resumeWhy(s) {
  if (!s) return "没有这条会话";
  if (s.sidechain) return "子代理会话不能单独接上（它的 id 不是一条独立会话）";
  if (!s.turns) return "这条会话没存下往来，接不上（Conversation not saved）";
  return null;
}

/* ===========================================================================
   下段「对话流」：主语 + 跟随状态机 + 只追加的渲染

   这三件事缺一件，就有一个"看着像 bug"的行为：

   1. **主语有两种**：当前格（实时，默认）和会话库（你点了哪张卡片）。两者长得
      一模一样，所以头上必须有一枚小签写出来 —— 否则你没法知道这段对话是谁的，
      而"这格怎么在说我没说过的话"是这类界面里最贵的一类误解。
   2. **跟随是一个状态机，不是"离底多少就归位"的一次性判断**（这套照 Orca 的
      `native-chat-autoscroll.ts` 搬）。默认跟着走；**只有读者手势**（滚轮/触摸/
      按键/拖滚动条）能脱离底部 —— 内容变化、程序写入、布局变化都不算；
      回到尾部只有一个条件：距离在**缩小** 且 已经进到 4px 以内。
   3. **两个阈值管两件事**：48px 只决定"跳回最新"那颗按钮显不显示，4px 才是重新
      吸底的线。混用这两个数的症状是"往上滚一点就被拽回去"，那种界面没法读。
   =========================================================================== */
const FLOW_BOTTOM_PX = 48;
const FLOW_REARM_PX = 4;
// 进对话流的三种：你说的 / agent 说的 / 系统条目（子代理回报、跨会话消息…）。
// 工具调用和"思考…"**不进** —— 那是「流水」的活儿。同一栏里两处都画同一件事，
// 那一栏就没有存在的必要了（子代理模块那条同理，见 renderSideLive）。
const FLOW_ROLE = { prompt: "user", text: "agent", system: "sys" };
const FLOW_TAG = { user: "你", agent: "agent", sys: "系统" };
const FLOW_ICON = {
  user: '<circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.6-3.6 4-5.4 7-5.4s5.4 1.8 7 5.4"/>',
  agent: '<path d="M12 3l2.2 6.1L20.5 11l-6.3 1.9L12 19l-2.2-6.1L3.5 11l6.3-1.9z"/>',
  sys: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',
};

let flowSub = { kind: "live" };  // {kind:"live"} | {kind:"lib", id}
let flowStamp = "";              // "主语 + 换代"标识：一变就整表重建
/* ⚠️ 追加游标**不能是一个条数**（我第一版就是 `flowDrawn = n`，两处会当场出错）：
   ① Go 那边流水超过 300 条会**从头砍**，砍完之后条数可能比游标还小 ——
      光比条数会得出"没有新内容"，屏上就停在旧内容上；
   ② 同一条消息正文是**边写边长**的（同一个 id 反复覆盖），条数完全不变，
      比条数永远发现不了它该重画。
   所以锚点记 **最后画出的那条的 id**（Orca 的 `Map<id,index>` 是同一件事：
   按 id 定位，而不是按位置）。找不到锚点 = 它被砍了或被换掉了，整表重建。 */
let flowLastId = "";
let flowTexts = new Map();       // id -> 上次画进去的正文（判"这一条变了没有"）
let flowFollowing = true;        // 跟随状态机
let flowPrevDist = 0;            // 上一次量到的离底距离（判"距离在缩小"）
let flowLeaveWhy = "";           // 刚脱离底部的原因（等 scroll 停了再把读数打全）
let flowLeaveTimer = 0;          // 那次"停稳了再记"的定时器
/* 一条正文多长算"太长"（用户 2026-10-16 定的形态：这一栏是监视面，不是阅读面 ——
   一条长报告灌进来，整栏就只剩它一条了）。预算 = 4 行（12.5px × 1.6 = 20px 一行）。
   ⚠️ 这类"多长算长"的数**必须用真实读数标定**（见 [[threshold-defaults-need-calibration]]）：
   "该收的没收"在界面上看不出来（行高不同而已），所以判据和阈值都要进日志。
   ⚠️ 预算只有这一个来源：CSS 变量从它写出去，CSS 里不许再写第二个数。 */
const FLOW_CLAMP_PX = 80;
document.documentElement.style.setProperty("--flow-clamp", FLOW_CLAMP_PX + "px");
const flowOpen = new Set();      // **用户亲手摊开**的那几条（按 id）
const flowFit = new Map();       // id -> {t, fold}：这条在这个宽度下收没收 + 量的是哪一版正文
let flowFoldSig = "";            // 上一次那条读数（变了才回日志，不刷屏）
let flowFoldRaf = 0;             // 尺寸变化时合帧用

function flowHost() { return $("hist"); }
function flowDist() {
  const h = flowHost();
  return h ? Math.max(0, h.scrollHeight - h.clientHeight - h.scrollTop) : 0;
}
function flowStick() {
  const h = flowHost();
  if (h) h.scrollTop = h.scrollHeight;
}
// 主语 → 条目。两种主语的形状在这**归一**成 {role,text,at}，下游只认这一种。
function flowSource() {
  if (flowSub.kind === "lib") {
    const s = (STATE?.sessions || []).find((x) => x.id === flowSub.id);
    const hist = (STATE?.history || {})[flowSub.id] || [];
    /* C7：主语是**子代理会话**时，下段头上要多两件事：它是子代理、现在什么状态。
       这不是装饰 —— 一头扎进某个子代理、却看不出"我在看谁"，是这个模块最容易
       让人读错的地方（子代理的对话流和主会话长得一模一样）。
       状态用 s 上现成的字段现算（subStateOf），**不在这里报日志**：renderFlow
       每次都跑；观察腿在 cardHTML 那一条（每张卡一条，且只在变化时报）。 */
    const st = s && s.sidechain ? subStateOf(s) : "";
    const par = (s && s.sidechain && s.parent)
      ? (STATE?.sessions || []).find((v) => v.id === s.parent) : null;
    return {
      stamp: "lib:" + flowSub.id,
      title: s ? sessionTitle(s) : String(flowSub.id).slice(0, 8),
      from: (s && s.sidechain) ? ((par && sessionTitle(par)) || String(s.parent || "").slice(0, 8)) : "",
      foot: s ? [s.sidechain ? "子代理" : "", st ? SUB_WORD[st] : "",
                 `${s.turns || 0}轮`, `${(s.bytes / 1048576).toFixed(1)}MB`].filter(Boolean).join(" · ") : "",
      items: hist.map((it, i) => ({ id: "lib:" + i, role: it.role === "user" ? "user" : "agent", text: it.text, at: it.at })),
      empty: "这个会话里没有可显示的对话文本（只有工具调用/附件）。",
    };
  }
  const t = activeTab;
  const v = t ? LIVE.get(t.id) : null;
  const acts = (v && v.acts) || [];
  return {
    // actsGen 是 Go 那次"整份替换"的代际号（见 applyActs）：它变了就说明这一格
    // 换了会话/页面补发了快照，列表要整表重建而不是接着追加。
    stamp: `live:${t ? t.id : 0}:${((v && v.actsGen) | 0) || 0}`,
    title: t ? currentTabTitle(t) : "没有当前格",
    foot: t ? "格" + t.id : "",
    items: acts.filter((a) => FLOW_ROLE[a.kind]).map((a) => ({ id: String(a.id || ""), role: FLOW_ROLE[a.kind], text: a.text, at: a.at, fullLen: a.fullLen | 0 })),
    empty: "这一格还没有动。",
  };
}
/* 正文被截断时**明说**（`fullLen` = 原文总字数，Go 的 msgText 带过来的）。
   只留一个没头没尾的 `…` 是不够的：读的人分不清那是作者写的还是我们砍的
   （实测里就是这么被读错的）。显示前多少字按**手上这条**算，不写死那个上限 ——
   写死就等于让前端去猜 Go 的常量。 */
const truncNote = (it) => (it.fullLen
  ? `<div class="trunc">这条被截了 —— 全文 ${it.fullLen} 字，这里显示前 ${(it.text || "").length} 字。` +
    `原文在那一格的终端里。</div>`
  : "");
function flowRowHTML(it) {
  const r = it.role;
  // 角色的图标**不带色**（单色纪律，见 CSS 里那段）：stroke 走 currentColor，
  // 颜色由 .fh .who 那一处定。三套角色色是原来"丑"的一部分 —— 它和正文抢注意力。
  // 时间戳带 data-at：它是**相对时间**，会随时间走样（见下面的定时刷新）。
  // `open` = 用户亲手摊开过这一条（重建之后还在，见 flowOpen）。
  const open = flowOpen.has(String(it.id || ""));
  return `<div class="hit ${r}${open ? " open" : ""}"${it.id ? ` data-fid="${esc(it.id)}"` : ""}>
    <div class="fh">
      <span class="who"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">${FLOW_ICON[r] || FLOW_ICON.agent}</svg></span>
      <span class="rl">${FLOW_TAG[r] || r}</span>
      <span class="tm" data-at="${esc(it.at || "")}">${rel(it.at)}</span>
    </div>
    <div class="tx"><div>${md(it.text || "")}</div></div>
    ${truncNote(it)}
    <div class="more"><button type="button" class="mo" data-flow-more="${esc(it.id || "")}" aria-expanded="${open ? "true" : "false"}">${open ? "收起 ▴" : "… 摊开 ▾"}</button></div>
  </div>`;
}
// 单独一条重画（正文变长了）：只换里那个 div，**不换整行** ——
// 换整行会把时间节点也一起重置，而且正落在这里的鼠标选中会丢。
function flowRedraw(it) {
  const host = flowHost();
  if (!host || !it.id) return;
  const row = host.querySelector(`[data-fid="${CSS.escape(it.id)}"]`);
  if (!row) return;
  const body = row.querySelector(".tx > div");
  if (body) body.innerHTML = md(it.text || "");
  row.querySelector(".tm").dataset.at = it.at || "";
}
/* 那颗「… 其余 N 行 ▾ / 收起 ▴」的按钮。留了多少行是**算出来的**
   （收掉的高度 ÷ 一行高），所以只有在量过之后它才说得准。 */
function flowMoreLabel(el, open, overPx) {
  const b = el.querySelector(":scope > .more .mo");
  if (!b) return;
  const n = Math.max(1, Math.round((overPx || 0) / 20));
  b.textContent = open ? "收起 ▴" : `… 其余 ${n} 行 ▾`;
  b.title = open
    ? "收起来，回到只出一部分"
    : "这一条只出了一部分 —— 点它就地摊开全文（不碰终端、不换栏）";
  b.setAttribute("aria-expanded", String(!!open));
}
/* 量一遍"哪几条正文超出了预算"，把结论写进类名（`.fold`）。
   ⚠️ 三个读数是这一块唯一的证据：收着几条 / 面板多大多小 / 最多的溢出多少。
   界面上"该收的没收"和"不该收的收了"长得一模一样（都只是行高不同），
   只有把判据和阈值打进日志才分得清（见 [[threshold-defaults-need-calibration]]）。 */
function flowFoldPass(why) {
  const host = flowHost();
  // ⚠️ 下段折叠着（0 高）的时候**一条都别量**：那时没有可视高度，
  // 量出来全是"溢出"，一展开就是满屏收着态的错样子。
  if (!host || !host.clientHeight) return;
  let folded = 0, opened = 0, seen = 0, maxOver = 0;
  for (const el of host.children) {
    const id = el.dataset.fid || "";
    if (!id) continue;                       // 空态那一条（.hist-empty）
    const tx = el.querySelector(":scope > .tx");
    if (!tx) continue;
    const t = flowTexts.get(id);
    // ⚠️ 摊开的那几条**单算**，不算进"收着"里：日志把二者混成一个数，
    // 就等于在说一件它自己知道不对的事（这一块最容易出的错就是读数说谎）。
    if (el.classList.contains("open")) { opened++; flowFit.set(id, { t: t, fold: true }); continue; }
    const c = flowFit.get(id);
    // 正文没变过就别再量（300 条全量 scrollHeight = 每帧一次布局抖动）
    if (c && c.t === t) { if (c.fold) folded++; continue; }
    seen++;
    const over = tx.scrollHeight - tx.clientHeight;   // max-height 生效 ⇒ 这差就是被收掉的高度
    const fold = over > 2;
    el.classList.toggle("fold", fold);
    flowMoreLabel(el, false, over);
    flowFit.set(id, { t: t, fold: fold });
    if (fold) { folded++; if (over > maxOver) maxOver = over; }
  }
  const sig = [host.clientWidth, host.clientHeight, host.children.length, folded, opened, FLOW_CLAMP_PX, Math.round(maxOver)].join("|");
  if (sig !== flowFoldSig) {
    flowFoldSig = sig;
    sendCtrl({
      type: "log",
      msg: `对话流 收着=${folded} 摊开=${opened} /共${host.children.length} 条（预算=${FLOW_CLAMP_PX}px≈${Math.round(FLOW_CLAMP_PX / 20)}行` +
           ` 面板=${host.clientWidth}x${host.clientHeight} 本轮量=${seen} 最多少=${Math.round(maxOver)}px，${why}）`,
    });
  }
}
/* 摊开 / 收起一条。**只动 DOM，不碰终端**（也不换主语）——
   所以它是"就地看全文"最省事的那条路：不跳格、不换栏、滚动位置不动。
   ⚠️ 摊开算**读者手势** ⇒ 当场停止吸底：不然接着来的新内容会把刚摊开这一条
   从眼前拽走（点开一段长报告、一秒钟后被顶到底部，是这一栏最容易让人放弃的体验）。 */
function setFlowOpen(el, open, why) {
  const id = el.dataset.fid || "";
  el.classList.toggle("open", open);
  if (open) flowOpen.add(id); else flowOpen.delete(id);
  flowFit.delete(id);                       // 高度变了，下一条要重新量
  flowMoreLabel(el, open, 0);
  const tx = el.querySelector(":scope > .tx");
  if (open) {
    flowLeave("摊开一条");
    // 上面那句已经把"为什么离开底部"记进 flowLeaveWhy 了，而那个读数由 scroll
    // 处理器在**下一次滚动**时补。摊开未必发生滚动 ⇒ 那行会挂到很久以后的某次
    // 滚动上，说的不是当时的事。所以这里清掉，由下面这行自己把话说清。
    flowLeaveWhy = "";
    // 就地摊开：只在"这一条的起点已经被顶出视野"时才挪屏（最短滚动量）。
    el.scrollIntoView({ block: "nearest" });
    sendCtrl({ type: "log", msg: `对话流 摊开一条 id=${id}（${why}）全文=${((flowTexts.get(id) || "") + "").length} 字 屏上=${tx ? Math.round(tx.scrollHeight) : 0}px` });
  } else {
    const over = tx ? tx.scrollHeight - tx.clientHeight : 0;
    el.classList.toggle("fold", over > 2);
    flowMoreLabel(el, false, over);
    flowFit.set(id, { t: flowTexts.get(id), fold: over > 2 });
    sendCtrl({ type: "log", msg: `对话流 收起一条 id=${id}（${why}）收掉=${Math.round(over)}px` });
  }
  paintJump();
}
// 「跳回最新」：常挂载 + 淡入淡出，"隐藏"用 inert + aria-hidden 而不是 display:none
// （display:none 会当场掐掉过渡）。inert 让它在隐藏时既点不到也 Tab 不到。
function setJump(on) {
  const b = $("h-jump");
  if (!b) return;
  const was = b.classList.contains("on");
  b.classList.toggle("on", on);
  b.inert = !on;
  if (on) b.removeAttribute("aria-hidden");
  else b.setAttribute("aria-hidden", "true");
  // 出现的那一刻把自己的盒子报一次（只在 false→true 那一次，不会刷屏）。
  // 理由和当初给分割条加几何读数是同一条：要"点它"就得知道它在哪，
  // 而这个位置是**布局算出来的**（底 10px + 居中 + 下段高度可拖），估必定偏。
  if (on && !was) {
    const r = b.getBoundingClientRect();
    sendCtrl({
      type: "log",
      msg: `跳回最新按钮出现 ${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}x${Math.round(r.height)}`,
    });
  }
}
// 出现条件照 Orca 的 shouldShowJumpToLatest：**没在吸底**且离底超过 48px。
// 注意它和"回到尾部"用的是两个不同的数（4px），这里刻意不共用。
function paintJump() {
  setJump(!flowFollowing && flowDist() > FLOW_BOTTOM_PX);
}

/* 量一次下段到底有没有横向溢出、是谁撑的。
   ⚠️ 这不是"顺手加的调试"：横向滚动条是**能被缩略图骗过**的那类现象
   （内容被裁在右边界之外，截图里只能看到它被裁）。所以先让页面报宽度和
   最宽的那几条，再决定改哪条 CSS —— 而不是先猜"大概是长 token"。
   每次换主语/换会话各报一次，不刷屏。 */
function flowWidthProbe(why) {
  const h = flowHost();
  if (!h) return;
  const kids = Array.from(h.children)
    .map((el) => ({ w: Math.round(el.scrollWidth), t: (el.textContent || "").replace(/\s+/g, " ").slice(0, 36) }))
    .sort((a, b) => b.w - a.w)
    .slice(0, 3);
  // 代码块单独报：它是**故意**横向滚动的那个（保留缩进 = white-space:pre），
  // 所以"它自己滚动"和"它把整栏撑宽"是两件事，只看容器那个数分不出来。
  // 判据：`pre.scrollWidth > pre.clientWidth`（它在自己里面滚）**且**
  //       容器 `scrollWidth == clientWidth`（没有把外面撑开）。
  const pres = Array.from(h.querySelectorAll(".tx pre.code"));
  const code = pres.length
    ? ` 代码块${pres.length}个 最宽=${Math.max(...pres.map((p) => p.scrollWidth))}/${Math.max(...pres.map((p) => p.clientWidth))}`
    : "";
  sendCtrl({
    type: "log",
    msg: `对话流 宽=${h.clientWidth} 内容=${h.scrollWidth}（${why}）最宽=${kids.map((k) => k.w).join("/")}${code} 首条="${kids[0] ? kids[0].t : ""}"`,
  });
}

function renderFlow(why) {
  const host = flowHost();
  if (!host) return;
  const src = flowSource();
  const stale = src.stamp !== flowStamp;
  // ⚠️ 吸底判定必须在**动 DOM 之前**：动完再量，量到的是动完之后的位置。
  const distBefore = flowDist();
  const topBefore = host.scrollTop;
  // 锚点在不在，也是一次"要不要整表重建"的判据（被砍掉了/换了会话）。
  /* ⚠️ 第三种情形是**兜底**，而且是踩出来的：条目没有 id 时（Go 那边第一版
     只给工具调用发 id）`flowLastId` 是空串，锚点判据静默失效、`from` 从 0 起，
     于是每来一条新内容整个列表**重画一遍** —— 日志里是 `流水 +1 条` 而前端写着
     `追加5 条 共5 条`。所以"锚不住"一律当重建：重建只是白画一次，重复追加
     是屏上真的多出一份对话。 */
  const anchor = (!stale && flowLastId) ? src.items.findIndex((x) => x.id === flowLastId) : -1;
  const fresh = stale || (src.items.length > 0 && (anchor < 0 || !flowLastId));

  if (fresh) {
    flowStamp = src.stamp;
    flowLastId = "";
    flowTexts.clear();
    // 换主语/换代 = 整表重建：**摊开状态跟着一起清**。不清会串台 ——
    // 库模式的 id 是 `lib:<序号>`，两个会话里第 4 条叫同一个名字。
    flowOpen.clear();
    flowFit.clear();
    host.innerHTML = "";
    flowFollowing = true;      // 换主语 / 换代 = 回到"跟着走"
    flowPrevDist = 0;
    setJump(false);
  }

  let added = 0, changed = 0;
  if (!src.items.length) {
    if (!host.querySelector(".hist-empty")) host.innerHTML = `<div class="hist-empty">${esc(src.empty)}</div>`;
  } else {
    const em = host.querySelector(".hist-empty");
    if (em) em.remove();       // 空态是占位：第一条真内容到了就下台
    const from = fresh ? 0 : anchor + 1;
    if (from < src.items.length) {
      const add = src.items.slice(from);
      host.insertAdjacentHTML("beforeend", add.map(flowRowHTML).join(""));
      flowLastId = add[add.length - 1].id || "";
      added = add.length;
    }
    // 已画过的那几条：正文变长了就**就地重画那一条**。不做这一步，
    // 流式输出在对话流里会停在第一帧 —— 而这正是"实时"最容易露馅的地方。
    // fresh 时 from=0，这个循环自然一次都不跑（刚 append 的那些没有"变没变"）——
    // 这不是巧合，是刻意的：重建之后没有"已画过"的行。
    for (let i = 0; i < from; i++) {
      const it = src.items[i];
      if (flowTexts.get(it.id) === it.text) continue;
      flowRedraw(it);
      changed++;
    }
  }
  for (const it of src.items) flowTexts.set(it.id, it.text);

  /* 只留模型窗口那么多行。Go 那边封顶 300 条，而**前端这份只追加、从不从顶上删** ——
     于是它一直在 300 之上慢慢涨。实测：内容一条一条来的时候模型停在 300，
     屏上行数 300→301→302…，每来一条 +1，永不回收（一条会话跑一小时就是几千个
     行）。以前不是问题，因为这块是"一屏快照"（最多 30 条），现在是活的。

     ⚠️ 砍头**必须补偿 scrollTop**：删掉的行在上方，DOM 一删，正在读的那一段会
     整体上移同样高度（浏览器自带的 scroll anchoring 被我们关掉了，见 #hist 那条
     注释 —— 所以这份补偿得自己做）。判据很硬：删掉多少高度，scrollTop 就减多少，
     "屏幕上那一行还是那一行"。 */
  if (src.items.length && host.children.length > src.items.length) {
    const drop = host.children.length - src.items.length;
    const h0 = host.scrollHeight, top0 = host.scrollTop;
    for (let i = 0; i < drop; i++) {
      const el = host.firstElementChild;
      if (el.dataset.fid) flowTexts.delete(el.dataset.fid);  // 别让这张表跟着涨
      if (el.dataset.fid) flowFit.delete(el.dataset.fid);    // 这张同理（少了它 = 每次砍头都留下量过期的记录）
      // 摊开状态也一起删：这条已经被砍掉了，留着它的 id 就是留了个雷 ——
      // 万一以后哪条消息拿到同一个 id，它会**无缘无故自己摊开**。
      if (el.dataset.fid) flowOpen.delete(el.dataset.fid);
      host.removeChild(el);
    }
    const dh = h0 - host.scrollHeight;
    if (dh > 0) host.scrollTop = Math.max(0, top0 - dh);
    sendCtrl({
      type: "log",
      msg: `对话流 顶上收回 ${drop} 行（−${dh}px，位=${Math.round(top0)}→${Math.round(host.scrollTop)}，` +
           `应等于 ${Math.round(top0 - dh)}）`,
    });
  }

  /* 收/不收**必须在 DOM 写完、且在量宽度之后**：判据是 scrollHeight 对 clientHeight，
     早一步量到的是上一次的排版（同 flowWidthProbe 那条注释里的坑）。 */
  flowFoldPass(fresh ? "换主语" : (added || changed) ? "新内容" : "复查");

  /* ⚠️ 量横向溢出必须**在写完 DOM 之后**。第一版把它放在 fresh 分支开头（"先量后写"），
     量到的是上一次的内容 —— 换主语那一刻恰好是空列表，于是每次都报
     `宽=397 内容=397`，看起来"没有横向滚动条"，而那时屏上一条都还没画。
     这类"读数总是对的、对象却不存在"的错，正是这个项目里最容易被信以为真的那类
     （见 [[spike-verify-loop]] 里徽标那条）。 */
  if (fresh) flowWidthProbe(why || "换主语");

  $("h-sub").textContent = src.title;
  // 子代理主语时，悬停里补上"谁派出来的"（标题是**人写的任务描述**，
  // 而同一个描述在多条会话里完全可能重复出现）。
  $("h-sub").title = flowSub.kind === "lib"
    ? (src.title + (src.from ? ` · 来自 ${src.from}` : "") + "（会话库）")
    : (src.title + "（当前格）");
  $("h-foot").textContent = src.foot;
  $("h-cnt").textContent = String(src.items.length);
  const chip = $("h-src");
  chip.textContent = flowSub.kind === "lib" ? "会话库" : "当前格";
  chip.classList.toggle("lib", flowSub.kind === "lib");
  chip.title = flowSub.kind === "lib" ? "看的是会话库里的会话 —— 点一下回到当前格" : "下段跟着当前格实时走";

  if (flowFollowing) flowStick();
  paintJump();

  // 只在"真的动了"的时候回日志（每次 scheduleLive 都回会把日志淹掉）。
  // 报的是**滚动位置的前后两个数**（不是离底距离）：新内容是加在**下面**的，
  // 所以离底距离本来就该变大 —— 那不能拿来判"有没有打扰你"。真正该相等的是
  // scrollTop：它就是"你正看着的那一行还在原处"。吸底时两数都该是 0。
  if (fresh || added || changed) {
    sendCtrl({
      type: "log",
      msg: `对话流 ${fresh ? "换主语" : added ? "追加" + added + " 条" : "续写" + changed + " 条"} 共${src.items.length} 条` +
           `（主语=${flowSub.kind === "lib" ? "库 " + String(flowSub.id).slice(0, 8) : "格" + (activeTab ? activeTab.id : "?")}` +
           `${fresh ? "，" + (why || "") : ""}，吸底=${flowFollowing ? "是" : "否"}，` +
           `位=${Math.round(topBefore)}→${Math.round(host.scrollTop)} 离底=${Math.round(distBefore)}→${Math.round(flowDist())}px` +
           // 屏上的行数 vs 模型里的条数：**这两个数会分家**（Go 那边砍到 300 条，
           // 前端是只追加、从不从顶上删），分家多少一眼看得出来。
           ` 行=${host.children.length}）`,
    });
  }
}

// 脱离底部：**只由读者手势调用**。内容变化、程序写入、布局变化都不许调它 ——
// 这是整套状态机的分界线（Orca 原话：Following stops only on a reader gesture
// or a row jump, never on layout or an application write）。
function flowLeave(why) {
  if (!flowFollowing) return;
  flowFollowing = false;
  /* ⚠️ **读数不在这里打**。wheel / mousedown 是"用户要滚了"的**前兆**，
     那一刻浏览器还没挪 scrollTop —— 当场量必然是 `位=1402 离底=0`，
     看起来像"刚从底部离开"，而这既不真也没用。
     我试过推到 requestAnimationFrame 里再量：**还是早**（Chromium 里
     scroll 事件排在那一帧的 rAF 之后），实测依旧读到滚之前的值。
     真正知道结果的是下面的 scroll 处理器 —— 所以这里只留个"为什么"，
     由那边把数字补上（一次脱离只打一行）。 */
  flowLeaveWhy = why;
  paintJump();
}
function flowToLib(id, why) {
  flowSub = { kind: "lib", id: id };
  renderFlow(why);
}
function flowToLive(why) {
  if (flowSub.kind === "live") return;
  flowSub = { kind: "live" };
  sendCtrl({ type: "log", msg: `对话流 主语回到当前格（${why}）` });
  renderFlow(why);
}

$("hist").addEventListener("wheel", () => flowLeave("滚轮"), { passive: true });
$("hist").addEventListener("touchmove", () => flowLeave("触摸"), { passive: true });
$("hist").addEventListener("keydown", (e) => {
  // 只有"往尾部反方向"的那几个键算脱离；PageDown/End/ArrowDown 是朝尾部去的。
  if (e.key === "PageUp" || e.key === "Home" || e.key === "ArrowUp") flowLeave("按键 " + e.key);
});
$("hist").addEventListener("mousedown", (e) => {
  const h = flowHost();
  // 点在滚动条那条带上（选区之外 = clientWidth/clientHeight 之外）也是"读者在手拖"。
  if (h && (e.offsetX > h.clientWidth || e.offsetY > h.clientHeight)) flowLeave("拖滚动条");
});
/* 点这一条 = **就地摊开它的全文**（用户 2026-10-16 定的；另外两个候选
   "跳到那一格的终端 / 拎成一页"都没要：这一栏就在眼前，跳走再跳回来会把你
   "刚才在看第几条"丢掉）。
   ⚠️ 摊开着的时候点正文**不动作** —— 那时的点击几乎都是为了选字；
   要收起来请点那颗「收起」按钮。收起来的那些**整块可点**（光标也是 pointer）。 */
$("hist").addEventListener("click", (e) => {
  const el = e.target.closest(".hit");
  if (!el || !el.dataset.fid) return;
  const open = el.classList.contains("open");
  if (e.target.closest("[data-flow-more]")) { setFlowOpen(el, !open, "点按钮"); return; }
  if (open) {
    // 摊开着的时候点**头行** = 收起。那颗「收起」按钮在这一条的末尾，
    // 一条 850px 的长文摊开后它在视野之外 —— 而你的眼睛在开头。
    // ⚠️ 点正文仍然**不动作**：那时的点击几乎都是为了选字。
    if (e.target.closest(".fh")) setFlowOpen(el, false, "点头行");
    return;
  }
  if (!el.classList.contains("fold")) return;
  if (String(window.getSelection() || "")) return;   // 有选中文本时不动作
  setFlowOpen(el, true, "点正文");
});
/* 面板宽度一变，换行就变了 ⇒ "溢出多少"整份作废，得重量一遍（拖分割条、
   折叠/展开下段、拉窗口都走这条）。用 rAF 合帧：拖动途中每个像素都量一次没意义。 */
new ResizeObserver(() => {
  if (flowFoldRaf) return;
  flowFoldRaf = requestAnimationFrame(() => {
    flowFoldRaf = 0;
    flowFit.clear();
    flowFoldPass("面板尺寸变了");
  });
}).observe($("hist"));
$("hist").addEventListener("scroll", () => {
  const d = flowDist();
  if (flowFollowing) { flowPrevDist = d; return; }
  // 重新吸底：距离**在缩小** 且 已经进到 4px 以内。少了"在缩小"这一半，
  // 往上滚的过程中就会在半路被拽回去。
  if (d < flowPrevDist && d <= FLOW_REARM_PX) {
    flowFollowing = true;
    flowLeaveWhy = "";
    clearTimeout(flowLeaveTimer);
    sendCtrl({ type: "log", msg: `对话流 回到尾部（离底=${Math.round(d)}px，上一帧=${Math.round(flowPrevDist)}px）` });
  } else if (flowLeaveWhy) {
    // ⚠️ 一次滚轮会连出好几个 scroll 事件，**第一个只挪 1px**（Chromium 的平滑滚动
    // 分帧落地）。所以"停在哪儿"要等这一串停稳（150ms）再记 —— 否则日志里
    // 永远写着 `位=1608 离底=1px`，看着像"滚轮没生效"。
    clearTimeout(flowLeaveTimer);
    flowLeaveTimer = setTimeout(() => {
      sendCtrl({
        type: "log",
        msg: `对话流 脱离底部（${flowLeaveWhy}）位=${Math.round(flowHost().scrollTop)} 离底=${Math.round(flowDist())}px`,
      });
      flowLeaveWhy = "";
    }, 150);
  }
  flowPrevDist = d;
  paintJump();
});
// 按钮自己别把焦点抢走 —— 键盘焦点在终端里，点它只是为了回尾部，不该顺带打断打字。
$("h-jump").addEventListener("mousedown", (e) => e.preventDefault());
$("h-jump").addEventListener("click", () => {
  flowFollowing = true;
  flowStick();
  setJump(false);
  sendCtrl({ type: "log", msg: "对话流 跳回最新（点按钮）" });
});
// 点来源签 = 回到当前格（在库模式时它才是可点的，样式见 CSS 的 #h-src.lib）
$("h-src").addEventListener("click", () => flowToLive("点来源签"));

/* 相对时间会**永久停在渲染那一刻**：快照时代看不出来（页面本来就只画一次），
   实时之后新的条目不断进来，老的那几条就永远写着"刚刚"。所以每 60s 只把
   .tm 的文本按 data-at 重算一遍 —— 不重画任何一行，只动时间节点
   （Orca 那边干脆用绝对 HH:MM 绕开了这件事；我们保留相对时间，代价就是这一条）。
   ⚠️ 选择器**不限定在 #hist 里**：这条规矩（"带 data-at 的时间节点都得按时重算"）
   说的是这件事本身，不是右栏那一份 —— 群组的行里也有时间节点，漏掉它就会出现
   一片"刚刚"（那种错看着完全正常，只是说的不是真的）。 */
setInterval(() => {
  document.querySelectorAll(".tm[data-at]").forEach((el) => {
    const t = rel(el.dataset.at);
    if (el.textContent !== t) el.textContent = t;
  });
  // C7：状态签和相对时间是同一类东西 —— 都是"算出来的、会过期的一小段文字"。
  // 区别是时间过期只是不精确，状态过期是**说假话**（见 refreshSubChips）。
  refreshSubChips();
}, 60000);

/* 点左栏那张卡片 = 把下段**切成"看这个会话"**（静态历史，不走实时）。
   它不再直接往 #hist 里写 —— 渲染只有一个出口（renderFlow），否则两种写法
   迟早分叉：live 那边追加、这边整表重写，一交替就是"内容重复/丢字"。

   ⚠️ `selected`（卡片高亮）和 `flowSub`（下段主语）现在是**两件事**：
   selected 只说"左栏高亮了谁"，flowSub 才说"下段在讲谁"。以前它们恒等，
   所以合并成一个变量没人看得出来；改成实时之后，用户点一下格（现实时）
   而左栏还亮着某张卡，两者就必须能分开。 */
function selectSession(id) {
  const s = (STATE?.sessions || []).find((x) => x.id === id);
  if (!s) return;
  selected = s;
  document.querySelectorAll(".card").forEach((el) =>
    el.classList.toggle("sel", el.dataset.id === id));
  flowToLib(id, "点左栏卡片");
}

/* ===========================================================================
   C2：复接一条已有会话 —— 卡片的动作

   **三个出口，一份数据**（照 Orca 抄的形制：它那边有四个出口 —— hover 图标组 /
   kebab 菜单 / 右键 ContextMenu / 展开详情条里的带字按钮 —— 全部共用同一份
   SessionActionMenuItems，见 AiVaultSessionRow.tsx:145-282）。我们三个：
   hover 浮出的 ▶、常驻的 ⋯、右键卡片。菜单项和可用性只在一处算（cardMenuItems）。

   下面这几条是**从 Orca 学来的、不写清楚下次一定会丢**的：

   1. **接上永远新开一格，绝不占用当前格**。Orca 的 Resume 就是
      `session.tabs.createTerminal`（golden: aivault-resume-launch-locked.json:10），
      它跟"当前在看哪个面板"没有任何关系 —— 要接的是**那条会话**。
   2. **可不可用由 Go 说了算**（tab.new 的应答里带 err/msg，见 main.go 的护栏）。
      前端只做"本地就能确定"的灰态（resumeWhy），并且**灰了也能点** —— 点一下
      把原因说出来。真正的占用冲突前端判不了，也不该猜：权威的「谁占着谁」表在
      Go 的 tabManager.bySession 里。
   3. **拒绝必须把占位格撤掉**（Orca 状态里有显式的 `launched:"unlaunched"`）。
      一个没有 PTY 的格子比"什么都没发生"更糟 —— 它看起来在跑。
   =========================================================================== */

const ICON_FORK = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2a6 6 0 0 1-6 6H8"/></svg>`;
const ICON_COPY = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>`;
const ICON_OPEN = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>`;
const ICON_DIR = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;

let cardMenuCard = null;   // 菜单现在讲的是哪张卡（null = 没开）
let toastTimer = 0;

/* 提示条。拒绝/失败的事实要有地方落地 —— 从前端只有对话流能显示文字，而对话流
   是"会话的内容"，往里塞一条系统消息等于伪造内容。 */
function showToast(msg, kind) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "on" + (kind === "err" ? " err" : "");
  clearTimeout(toastTimer);
  // 4.5s：拒绝的理由是**要读**的一句话（里面有关键信息），比一般 toast 留久一点。
  toastTimer = setTimeout(() => { el.className = ""; }, 4500);
  sendCtrl({ type: "log", msg: `提示条 ${kind || "info"}：${msg}` });
}

/* 菜单项。`hint` 同时是 title（鼠标停上去能读到原因）和灰态点击时那句解释 ——
   一处写、两处用，不会出现"灰的理由"和"说了什么"不一致。 */
function cardMenuItems(s) {
  const why = resumeWhy(s);
  const na = why ? " na" : "";
  const hasFile = !!s.path;
  return [
    { act: "resume", icon: ICON_PLAY, label: "接上这条会话", cls: na,
      hint: why || "新开一格，在它自己的工作目录里继续" },
    { act: "fork", icon: ICON_FORK, label: "另起分支", cls: na,
      hint: why || "读这条会话、写一条新的（原会话不动，两条可以并着跑）" },
    { sep: true },
    { act: "copycmd", icon: ICON_COPY, label: "复制 resume 命令",
      hint: `claude --resume ${s.id}（在 ${s.cwd || "默认目录"} 里执行）` },
    { act: "copyid", icon: ICON_COPY, label: "复制会话 id", hint: s.id },
    { sep: true },
    { act: "openlog", icon: ICON_OPEN, label: "打开会话文件", cls: hasFile ? "" : " na",
      hint: hasFile ? s.path : "这张卡片没有文件路径" },
    { act: "reveallog", icon: ICON_DIR, label: "在文件夹中显示", cls: hasFile ? "" : " na",
      hint: hasFile ? s.path : "这张卡片没有文件路径" },
    { act: "opencwd", icon: ICON_DIR, label: "打开工作目录", cls: s.cwd ? "" : " na",
      hint: s.cwd || "这条会话没有工作目录" },
  ];
}

/* 开菜单。`anchor` 是一个矩形（⋯ 按钮那个，或者右键时鼠标那一点），
   alignRight=true 表示**优先**把菜单的右边缘对上锚点的右边缘。

   落点的算法有个实测教训：第一次实现是"右对齐 + 钳到窗口内"，结果菜单
   （352px 宽）被右对齐到侧栏（213px 宽）之后左边缘变成 -9，被钳到 6 ——
   菜单**飘到了窗口最左边的导航条上**，看起来像是那里的东西，而不是这张卡的。
   所以顺序必须是：先试右对齐；放不下（会跑出左边界）就改成**从锚点左边缘
   往右长**，允许它盖住主区（下拉菜单盖住邻居是正常的，飘到另一边不是）。
   落点算完再显示：先显示再量会量到上一帧的尺寸，菜单会先闪在错的位置。 */
function openCardMenu(cardEl, anchor, alignRight) {
  const s = (STATE?.sessions || []).find((v) => v.id === cardEl.dataset.id);
  if (!s) return;
  const menu = $("cardmenu");
  const items = cardMenuItems(s);
  menu.innerHTML =
    `<div class="mhead" title="${esc(sessionTitle(s))}">${esc(sessionTitle(s))}</div>` +
    items.map((it) => it.sep
      ? `<div class="sep"></div>`
      : `<button class="mi${it.cls || ""}" data-act="${it.act}"
           title="${esc(it.hint)}">${it.icon}<span>${esc(it.label)}</span></button>`
    ).join("");
  menu.classList.add("on");
  const r = menu.getBoundingClientRect();
  let left = alignRight ? anchor.right - r.width : anchor.left;
  if (left < 6) left = anchor.left;                    // 右对齐放不下 → 从左边缘往右长
  left = Math.max(6, Math.min(left, window.innerWidth - r.width - 6));
  let top = anchor.bottom + 4;
  if (top + r.height > window.innerHeight - 6) top = anchor.top - r.height - 4;
  top = Math.max(6, Math.min(top, window.innerHeight - r.height - 6));
  menu.style.left = Math.round(left) + "px";
  menu.style.top = Math.round(top) + "px";
  cardMenuCard = s;
  // 自证读数：菜单"在不在、落在哪、几项、几项灰"全回日志 —— 这三件事在截图里
  // 都不好认（尤其"灰"，一眼看不出是灰还是配色），而落点错了更是只有量才知道
  // （上面那条"飘到导航条上"就是这么逮到的）。
  sendCtrl({ type: "log", msg: `卡片菜单 打开 id=${s.id} ` +
    `锚=${Math.round(anchor.left)},${Math.round(anchor.top)}-${Math.round(anchor.right)},${Math.round(anchor.bottom)} ` +
    `落=${Math.round(left)},${Math.round(top)} ${Math.round(r.width)}x${Math.round(r.height)} ` +
    `项=${items.filter((i) => !i.sep).length} 灰=${items.filter((i) => i.cls).length}` });
}

function closeCardMenu(why) {
  const menu = $("cardmenu");
  if (!cardMenuCard) return;
  cardMenuCard = null;
  menu.classList.remove("on");
  if (why) sendCtrl({ type: "log", msg: `卡片菜单 关闭（${why}）` });
}

// 复制到剪贴板。两条路：navigator.clipboard 只在**安全上下文**里有（Wails 给的
// 是 http://127.0.0.1:port，算 secure context，但这条依赖不值得赌），
// 兜底走 execCommand。**走哪条要回日志** —— 否则"复制没反应"就只能猜。
async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      sendCtrl({ type: "log", msg: `剪贴板 写入 ${text.length} 字符（navigator.clipboard）` });
      return true;
    }
  } catch (e) {
    sendCtrl({ type: "log", msg: `剪贴板 navigator.clipboard 失败（${e && e.message}），退回 execCommand` });
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
